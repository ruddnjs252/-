<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리퀘: 끝없는 성장</title>

    <style>
        /* [MOD-001: 기본 화면 및 캔버스 스타일] */
        body { 
            background-color: #222; 
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            margin: 0; 
            touch-action: none; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none;
        }
        #gameContainer { 
            position: relative; 
            width: 1000px; 
            height: 750px; 
            margin: 10px auto 20px auto; 
            border: 2px solid #888; 
            overflow: hidden; 
            background-color: #333; 
            user-select: none; 
        }
        canvas { display: block; cursor: crosshair; }
        /* [MOD-001-END] */

        /* [MOD-002: UI 레이어 및 공통 팝업 스타일] */
        .ui-layer { 
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.85); 
            z-index: 10; 
        }
        .panel { padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .item, .class-item { 
            background: #444; 
            padding: 10px; 
            margin-bottom: 5px; 
            border: 1px solid #777; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
        }
        .item:hover { background: #555; }
        .class-item:hover:not(.locked) { background: #555; }
        .class-item.selected { border: 2px solid gold; background: #665500; }
        .class-item.locked { background: #222; color: #555; border: 1px dashed #444; cursor: not-allowed; }
        .close-btn { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            padding: 5px 15px; 
            background: red; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            z-index: 20; 
        }
        .btn { 
            padding: 8px 20px; 
            background: #555; 
            color: white; 
            border: 1px solid #888; 
            cursor: pointer; 
            margin: 5px; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        .btn:hover:not(:disabled) { background: #777; }
        .stat-text { font-size: 13px; color: lightgray; margin-bottom: 3px; }
        .nav-btn { padding: 10px; background: #222; color: white; border: 1px solid #666; cursor: pointer; width: 48%; }
        .nav-btn.active { background: #555; font-weight: bold; }
        #ccPlayerName { 
            padding: 8px; 
            font-size: 16px; 
            width: 220px; 
            background: #111; 
            color: white; 
            border: 1px solid #777; 
            text-align: center; 
            margin-bottom: 10px; 
        }
        .stat-control-box { text-align: center; background: #111; padding: 5px; border-radius: 5px; border: 1px solid #444; }
        .stat-btn { 
            background: #333; 
            color: white; 
            border: 1px solid #666; 
            cursor: pointer; 
            width: 25px; 
            height: 25px; 
            font-weight: bold; 
        }
        .stat-btn:hover { background: #555; }
        /* [MOD-002-END] */

        /* [MOD-003: 모바일 가상 패드 UI 스타일] */
        .vpad-btn {
            position: fixed;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 9999;
        }
        .vpad-btn:active { background: rgba(255, 255, 255, 0.4); }
        #vpad-atk { right: 25px; bottom: 35px; width: 75px; height: 75px; font-size: 16px; border-color: #ff5555; }
        #vpad-skill { right: 115px; bottom: 25px; width: 65px; height: 65px; font-size: 14px; border-color: #55ff55; }
        #vpad-r { right: 30px; bottom: 125px; width: 50px; height: 50px; font-size: 13px; border-color: #ffaa00; }
        #vpad-e { right: 105px; bottom: 105px; width: 45px; height: 45px; font-size: 12px; border-color: #aaaaaa; }
        #vpad-stick-base {
            position: fixed;
            left: 40px;
            bottom: 40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            display: none;
            z-index: 9999;
        }
        #vpad-stick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 8px #ffffff;
        }
        /* [MOD-003-END] */
    </style>
</head>
<body>

    <!-- [MOD-004: 모바일 가상 패드 HTML 구조] -->
    <div id="vpad-container">
        <div id="vpad-stick-base"><div id="vpad-stick-knob"></div></div>
        <div id="vpad-atk" class="vpad-btn">공격</div>
        <div id="vpad-skill" class="vpad-btn">스킬</div>
        <div id="vpad-r" class="vpad-btn">R변경</div>
        <div id="vpad-e" class="vpad-btn">가방</div>
    </div>
    <!-- [MOD-004-END] -->

    <!-- [MOD-005: 타이틀 및 버전 표기] -->
    <h1>리퀘: 끝없는 성장</h1>
    <div id="versionTag" style="font-size: 12px; color: #888; margin-bottom: 5px;">v0.2.6 (Dev)</div>
    <!-- [MOD-005-END] -->

  <!-- [MOD-006: 캔버스 및 팝업 레이어 HTML] -->
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="750"></canvas>

        <!-- 캐릭터 생성 UI (기본 display: none으로 수정) -->
        <div id="charCreationUI" class="ui-layer" style="display: none; align-items: center; justify-content: center;">
            <div style="background: #2b2b2b; border: 2px solid gold; border-radius: 8px; padding: 20px; width: 620px; max-width: 90%; box-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: auto;">
                <h2 style="color: gold; margin-top: 0;">모험가 등록증</h2>
                <input type="text" id="ccPlayerName" placeholder="모험가 이름을 입력하세요" value="모험가">
                
                <div style="display: flex; justify-content: space-around; margin: 15px 0;">
                    <div style="text-align: left;">
                        <div style="color: #4da6ff; font-weight: bold; margin-bottom: 5px;">기본 스탯 (전사)</div>
                        <div style="font-size: 14px; color: #ccc; line-height: 1.8;">
                            힘(STR): 12 | 민첩(AGI): 10<br>
                            체력(VIT): 12 | 지능(INT): 8<br>
                            감각(PER): 8
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <div style="font-weight: bold; margin-bottom: 8px; color: #aaa;">선택된 클래스: <span style="color: #ffaa00;">워리어 (Warrior)</span></div>
                </div>

                <button id="btnStartGame" class="btn" style="background: #2a752a; border-color: #4da64d; padding: 10px 30px; font-size: 16px;" onclick="finishCharacterCreation()">등록 완료하고 시작</button>
            </div>
        </div>

        <!-- 인벤토리 및 직업 상태창 UI -->
        <div id="inventoryUI" class="ui-layer">
            <button class="close-btn" onclick="closeUI()">닫기 (ESC)</button>
            <div style="display: flex; width: 100%; height: 100%;">
                <div class="panel" style="width: 50%; border-right: 1px solid #555;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <button class="nav-btn active" id="tabInv" onclick="switchTab('inv')">인벤토리</button>
                        <button class="nav-btn" id="tabJob" onclick="switchTab('job')">직업 계통</button>
                    </div>
                    <div id="panelInvContent">
                        <h3>소지품</h3>
                        <div id="itemList">
                            <div class="item" style="color: #ffaa00;">시작의 대검 [귀속]</div>
                        </div>
                    </div>
                    <div id="panelJobContent" style="display: none;">
                        <h3>직업 특성 및 해금</h3>
                        <div id="jobDetails">워리어 계통 숙련 진행 중...</div>
                    </div>
                </div>
                <div class="panel" style="width: 50%;">
                    <h3>캐릭터 정보</h3>
                    <div id="playerStatsDisplay" style="text-align: left; padding: 10px; line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- [MOD-006-END] -->

    <!-- [MOD-007: 외부 데이터 모듈 연결] -->
    <script src="data/maps.js"></script>
    <script src="data/jobs.js"></script>
    <!-- [MOD-007-END] -->

    <!-- 메인 게임 스크립트 -->
    <script>
        // [MOD-008: 엔진 핵심 상태 변수 및 엔티티 정의]
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "playing"; // "playing", "inventory", "creation"
        let currentMap = "town";
        let mouseX = 500, mouseY = 375;
        let keys = {};

        const player = {
            x: 500,
            y: 400,
            width: 30,
            height: 30,
            radius: 15,
            speed: 4,
            currentHp: 100,
            maxHp: 100,
            currentStamina: 100,
            maxStamina: 100,
            staminaRegenTimer: 0,
            stats: { str: 10, agi: 10, int: 10, vit: 10, per: 10 },
            class: "warrior",
            activeSkillType: null,
            inventory: []
        };

        const npcReceptionist = { x: 500, y: 250, radius: 25, name: "길드 접수원" };

        const availableSkills = ["slash", "thrust", "charge", "leap_attack"];
        let currentSkillIndex = 0;
        let activeSkill = { name: "베기", type: "slash", bonusDmg: 5 };
        // [MOD-008-END]

        // [MOD-009: 모바일 가상 조작 엔진 로직]
        (function initVirtualPad() {
            const stickBase = document.getElementById("vpad-stick-base");
            const stickKnob = document.getElementById("vpad-stick-knob");
            const btnAtk = document.getElementById("vpad-atk");
            const btnSkill = document.getElementById("vpad-skill");
            const btnR = document.getElementById("vpad-r");
            const btnE = document.getElementById("vpad-e");

            let touchId = null;
            let startX = 0, startY = 0;

            window.addEventListener("touchstart", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.clientX < window.innerWidth / 2 && touchId === null) {
                        touchId = t.identifier;
                        startX = t.clientX;
                        startY = t.clientY;
                        stickBase.style.left = (startX - 60) + "px";
                        stickBase.style.top = (startY - 60) + "px";
                        stickBase.style.bottom = "auto";
                        stickBase.style.display = "block";
                        stickKnob.style.transform = `translate(0px, 0px)`;
                    }
                }
            }, { passive: false });

            window.addEventListener("touchmove", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.identifier === touchId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxR = 45;
                        if (dist > maxR) {
                            dx = (dx / dist) * maxR;
                            dy = (dy / dist) * maxR;
                        }
                        stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

                        // 가상 이동 키 변환
                        keys["w"] = dy < -12;
                        keys["s"] = dy > 12;
                        keys["a"] = dx < -12;
                        keys["d"] = dx > 12;

                        // 이동 방향과 조준 방향 일치
                        if (dist > 5) {
                            let moveAngle = Math.atan2(dy, dx);
                            mouseX = player.x + Math.cos(moveAngle) * 120;
                            mouseY = player.y + Math.sin(moveAngle) * 120;
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        stickBase.style.display = "none";
                        keys["w"] = false; keys["s"] = false; keys["a"] = false; keys["d"] = false;
                    }
                }
            };
            window.addEventListener("touchend", endTouch);
            window.addEventListener("touchcancel", endTouch);

            btnAtk.addEventListener("touchstart", (e) => {
                e.preventDefault();
                canvas.dispatchEvent(new MouseEvent("mousedown", { button: 0, clientX: canvas.offsetLeft + mouseX, clientY: canvas.offsetTop + mouseY }));
            });

            btnSkill.addEventListener("touchstart", (e) => {
                e.preventDefault();
                canvas.dispatchEvent(new MouseEvent("mousedown", { button: 2, clientX: canvas.offsetLeft + mouseX, clientY: canvas.offsetTop + mouseY }));
            });

            btnR.addEventListener("touchstart", (e) => {
                e.preventDefault();
                handleRKey();
            });

            btnE.addEventListener("touchstart", (e) => {
                e.preventDefault();
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    switchTab('inv');
                } else {
                    closeUI();
                }
            });
        })();
        // [MOD-009-END]

        // [MOD-010: PC 키보드 & 마우스 이벤트 리스너]
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (e.key === "e" || e.key === "E") {
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    switchTab('inv');
                } else if (gameState === "inventory") {
                    closeUI();
                }
            }
            if (e.key === "r" || e.key === "R") handleRKey();
            if (e.key === "Escape") closeUI();
        });

        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        // [MOD-010-END]

        // [MOD-011: 스킬 시스템 및 UI 보조 함수]
        function handleRKey() {
            currentSkillIndex = (currentSkillIndex + 1) % availableSkills.length;
            const skillType = availableSkills[currentSkillIndex];
            if (skillType === "slash") activeSkill = { name: "베기", type: "slash", bonusDmg: 5 };
            if (skillType === "thrust") activeSkill = { name: "찌르기", type: "thrust", bonusDmg: 8 };
            if (skillType === "charge") activeSkill = { name: "돌진", type: "charge", bonusDmg: 12 };
            if (skillType === "leap_attack") activeSkill = { name: "도약 공격", type: "leap_attack", bonusDmg: 15 };
        }

        function closeUI() {
            gameState = "playing";
            document.getElementById("inventoryUI").style.display = "none";
            document.getElementById("charCreationUI").style.display = "none";
        }

        function openCharCreation() {
            gameState = "creation";
            const ui = document.getElementById("charCreationUI");
            ui.style.display = "flex";
        }

        function finishCharacterCreation() {
            const nameInput = document.getElementById("ccPlayerName");
            if (nameInput && nameInput.value.trim() !== "") {
                player.name = nameInput.value.trim();
            }
            closeUI();
        }

        function switchTab(tab) {
            document.getElementById("tabInv").classList.toggle("active", tab === 'inv');
            document.getElementById("tabJob").classList.toggle("active", tab === 'job');
            document.getElementById("panelInvContent").style.display = tab === 'inv' ? "block" : "none";
            document.getElementById("panelJobContent").style.display = tab === 'job' ? "block" : "none";

            // 상태창 갱신
            const statsDiv = document.getElementById("playerStatsDisplay");
            if (statsDiv) {
                statsDiv.innerHTML = `
                    <b>이름:</b> ${player.name || "모험가"}<br>
                    <b>직업:</b> ${player.class}<br>
                    <b>체력:</b> ${player.currentHp} / ${player.maxHp}<br>
                    <b>스태미나:</b> ${player.currentStamina} / ${player.maxStamina}<br><br>
                    <b>[능력치]</b><br>
                    STR(힘): ${player.stats.str} | AGI(민첩): ${player.stats.agi}<br>
                    VIT(체력): ${player.stats.vit} | INT(지능): ${player.stats.int}<br>
                    PER(감각): ${player.stats.per}
                `;
            }
        }
        // [MOD-011-END]
        // [MOD-012: 물리 판정 및 충돌 검사 유틸리티]
        function checkObstacleCollision(x, y) {
            return false; // 추가 장애물 검사용 간이 함수
        }

        function checkRectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function applyDamageToGoblin(dmg) {
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon && MAP_DATA.dungeon.goblin) {
                MAP_DATA.dungeon.goblin.hp -= dmg;
                if (MAP_DATA.dungeon.goblin.hp <= 0) MAP_DATA.dungeon.goblin.active = false;
            }
        }
        // [MOD-012-END]

        // [MOD-013: 게임 물리 업데이트 루프 (이동, 스킬, 끼임 방지)]
        function update() {
            if (gameState !== "playing") return;

            let nextX = player.x;
            let nextY = player.y;

            // 스킬 특수 이동 vs 일반 이동 판정
            if ((player.activeSkillType === "charge" || player.activeSkillType === "leap_attack") && currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon && MAP_DATA.dungeon.goblin && MAP_DATA.dungeon.goblin.active) {
                let gob = MAP_DATA.dungeon.goblin;
                if (checkRectCollision(nextX, nextY, player.width, player.height, gob.x - gob.size/2, gob.y - gob.size/2, gob.size, gob.size)) {
                    const dmg = (player.stats.str * 3) + activeSkill.bonusDmg;
                    applyDamageToGoblin(dmg);
                }
            } else {
                if (keys["ArrowUp"] || keys["w"] || keys["W"]) nextY -= player.speed;
                if (keys["ArrowDown"] || keys["s"] || keys["S"]) nextY += player.speed;
                if (keys["ArrowLeft"] || keys["a"] || keys["A"]) nextX -= player.speed;
                if (keys["ArrowRight"] || keys["d"] || keys["D"]) nextX += player.speed;
            }

            // NPC 및 오브젝트 끼임 방지 (도약 착지 및 이동 공통 튕겨내기)
            if (currentMap === "town" && typeof npcReceptionist !== "undefined") {
                let pRadius = player.radius || 15;
                let npcRadius = npcReceptionist.radius || 20;
                let dx = nextX - npcReceptionist.x;
                let dy = nextY - npcReceptionist.y;
                let dist = Math.hypot(dx, dy);
                let minDist = pRadius + npcRadius + 4;
                if (dist < minDist && dist > 0) {
                    nextX = npcReceptionist.x + (dx / dist) * minDist;
                    nextY = npcReceptionist.y + (dy / dist) * minDist;
                }
            }

            // 캔버스 화면 경계 체크
            nextX = Math.max(player.radius, Math.min(nextX, canvas.width - player.radius));
            nextY = Math.max(player.radius, Math.min(nextY, canvas.height - player.radius));

            // 장애물 충돌 검사
            if (checkObstacleCollision(nextX, nextY)) {
                nextX = player.x;
                nextY = player.y;
            }

            // 최종 위치 확정
            player.x = nextX;
            player.y = nextY;

            // 스태미나 자연 회복
            if (player.currentStamina < player.maxStamina) {
                player.staminaRegenTimer++;
                if (player.staminaRegenTimer >= 60) {
                    player.currentStamina = Math.min(player.maxStamina, player.currentStamina + 1);
                    player.staminaRegenTimer = 0;
                }
            }
        }
        // [MOD-013-END]

        // [MOD-014: 캔버스 그래픽 렌더링 루프]
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 맵 배경
            ctx.fillStyle = currentMap === "town" ? "#2e3b2e" : "#1a1a24";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // NPC 렌더링 (마을)
            if (currentMap === "town") {
                ctx.fillStyle = "#e0a96d";
                ctx.beginPath();
                ctx.arc(npcReceptionist.x, npcReceptionist.y, npcReceptionist.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                ctx.fillStyle = "#fff";
                ctx.font = "12px sans-serif";
                ctx.fillText(npcReceptionist.name, npcReceptionist.x - 28, npcReceptionist.y - 32);
            }

            // 플레이어 렌더링
            ctx.fillStyle = "#3498db";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 공격 조준선
            let angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            ctx.strokeStyle = "rgba(255, 255, 0, 0.7)";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(angle) * 35, player.y + Math.sin(angle) * 35);
            ctx.stroke();

            // 상단 간이 HUD
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(10, 10, 260, 65);
            ctx.fillStyle = "#fff";
            ctx.font = "14px sans-serif";
            ctx.fillText(`체력: ${player.currentHp} / ${player.maxHp}`, 20, 30);
            ctx.fillText(`스태미나: ${player.currentStamina} / ${player.maxStamina}`, 20, 48);
            ctx.fillStyle = "#55ff55";
            ctx.fillText(`선택 스킬 [R]: ${activeSkill.name}`, 20, 66);
        }
        // [MOD-014-END]

        // [MOD-015: 메인 엔진 루프 실행부]
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
        // [MOD-015-END]
    </script>
</body>
</html>
