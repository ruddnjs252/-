<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리퀘 (Re-Quest) v0.2.36</title>
    
    <style>
        /* [MOD-001: 기본 화면 및 전체화면 캔버스 스타일] */
        body { background-color: #222; color: white; font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        h1 { display: none; } /* 전체화면을 위해 기존 텍스트 타이틀 숨김 */
        #gameContainer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            margin: 0; 
            border: none; /* 불필요한 테두리 제거 */
            overflow: hidden; 
            background-color: #2a2a2a; 
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        /* [MOD-001-END] */

        /* [MOD-002: UI 레이어 및 팝업 공통 스타일] */
        .ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10; }
        .panel { padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .item, .class-item { background: #444; padding: 10px; margin-bottom: 5px; border: 1px solid #777; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .item:hover { background: #555; }
        .class-item:hover:not(.locked) { background: #555; }
        .class-item.selected { border: 2px solid gold; background: #665500; }
        .class-item.locked { background: #222; color: #555; border: 1px dashed #444; cursor: not-allowed; }
        /* [MOD-002-END] */

        /* [MOD-003: 버튼 컨트롤 및 모바일 가상 패드(vmin 반응형) 스타일] */
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 5px 15px; background: red; color: white; border: none; cursor: pointer; font-weight: bold; z-index: 20; }
        .btn { padding: 8px 20px; background: #555; color: white; border: 1px solid #888; cursor: pointer; margin: 5px; font-weight: bold; border-radius: 4px; }
        .btn:hover:not(:disabled) { background: #777; }
        .stat-text { font-size: 13px; color: lightgray; margin-bottom: 3px; }
        .nav-btn { padding: 10px; background: #222; color: white; border: 1px solid #666; cursor: pointer; width: 48%; }
        .nav-btn.active { background: #555; font-weight: bold; }
        #ccPlayerName { padding: 8px; font-size: 16px; width: 220px; background: #111; color: white; border: 1px solid #777; text-align: center; margin-bottom: 10px; }
        .stat-control-box { text-align: center; background: #111; padding: 5px; border-radius: 5px; border: 1px solid #444;}
        .stat-btn { background: #333; color: white; border: 1px solid #666; cursor: pointer; width: 25px; height: 25px; font-weight: bold; }
        .stat-btn:hover { background: #555; }

        /* 가상 패드 UI */
        .vpad-btn { position: fixed; border-radius: 50%; background: rgba(0, 0, 0, 0.65); border: 2px solid rgba(255, 255, 255, 0.5); color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; z-index: 9999; }
        .vpad-btn:active { background: rgba(255, 255, 255, 0.4); }
        
        #vpad-atk { right: 4vmin; bottom: 6vmin; width: 16vmin; height: 16vmin; font-size: 3.5vmin; border-color: #ff5555; }
        #vpad-skill { right: 23vmin; bottom: 4vmin; width: 14vmin; height: 14vmin; font-size: 3vmin; border-color: #55ff55; }
        #vpad-r { right: 5vmin; bottom: 25vmin; width: 11vmin; height: 11vmin; font-size: 2.5vmin; border-color: #ffaa00; }
        #vpad-e { right: 21vmin; bottom: 21vmin; width: 10vmin; height: 10vmin; font-size: 2.2vmin; border-color: #aaaaaa; }
        
        #vpad-stick-base { position: fixed; left: 8vmin; bottom: 8vmin; width: 26vmin; height: 26vmin; border-radius: 50%; background: rgba(0, 0, 0, 0.6); border: 3px solid #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); display: none; z-index: 9999; }
        #vpad-stick-knob { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border-radius: 50%; background: #00ffff; box-shadow: 0 0 8px #ffffff; }

        /* [추가] 방사형(Radial) 퀵슬롯 UI - 리볼버 회전 적용 */
        #quick-slot-wrapper {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 50vmin; height: 25vmin; z-index: 9000;
            overflow: hidden; pointer-events: none;
        }
        #quick-slot-container {
            position: absolute; bottom: 0; left: 0; width: 50vmin; height: 25vmin;
            border-top-left-radius: 50vmin; border-top-right-radius: 50vmin;
            background-color: rgba(255, 165, 0, 0.85); border: 3px solid #ffcc00; border-bottom: none;
        }
        /* 탄창처럼 돌아갈 둥근 휠 */
        #quick-slot-wheel {
            position: absolute; bottom: 0; left: 50%;
            width: 36vmin; height: 36vmin; margin-left: -18vmin; margin-bottom: -18vmin;
            border-radius: 50%; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* 12시 방향 고정 붉은 침 */
        .quick-slot-pointer {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 2vmin solid transparent; border-right: 2vmin solid transparent;
            border-bottom: 12vmin solid #e60000; z-index: 9001; transform-origin: bottom center;
        }
        .q-slot {
            position: absolute; width: 9vmin; height: 9vmin; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8); background: rgba(0, 0, 0, 0.4);
            top: 50%; left: 50%; margin-top: -4.5vmin; margin-left: -4.5vmin;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
        }
        .q-slot-inner {
            display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* 5개 슬롯을 360도(72도 간격)로 둥글게 배치 */
        #q-slot-1 { transform: rotate(0deg) translateY(-17vmin); }
        #q-slot-2 { transform: rotate(72deg) translateY(-17vmin); }
        #q-slot-3 { transform: rotate(144deg) translateY(-17vmin); }
        #q-slot-4 { transform: rotate(216deg) translateY(-17vmin); }
        #q-slot-5 { transform: rotate(288deg) translateY(-17vmin); }
        
        /* [MOD-003-END] */
    </style>
</head>
<body>
    <!-- [MOD-004: 타이틀 및 HTML 레이어] -->
    <div id="vpad-container">
        <!-- [추가] 방사형 퀵슬롯 HTML (리볼버 기능) -->
        <div id="quick-slot-wrapper">
            <div id="quick-slot-container"></div>
            <div class="quick-slot-pointer"></div>
            <div id="quick-slot-wheel">
                <div id="q-slot-1" class="q-slot"><div class="q-slot-inner"></div></div>
                <div id="q-slot-2" class="q-slot"><div class="q-slot-inner"></div></div>
                <div id="q-slot-3" class="q-slot"><div class="q-slot-inner"></div></div>
                <div id="q-slot-4" class="q-slot"><div class="q-slot-inner"></div></div>
                <div id="q-slot-5" class="q-slot"><div class="q-slot-inner"></div></div>
            </div>
        </div>
        
        <div id="vpad-stick-base"><div id="vpad-stick-knob"></div></div>
        <div id="vpad-atk" class="vpad-btn">공격</div>
        <div id="vpad-skill" class="vpad-btn">스킬</div>
        <div id="vpad-r" class="vpad-btn">R변경</div>
        <div id="vpad-e" class="vpad-btn">가방</div>
    </div>

    <h1>리퀘: 끝없는 성장</h1>
    
    <div id="gameContainer">
        <!-- 캔버스는 가상 렌더링 크기를 1000x750으로 고정하되 화면비에 맞춰 자동 스케일링 -->
        <canvas id="gameCanvas" width="1000" height="750"></canvas>
    <!-- [MOD-004-END] -->
        <!-- [MOD-005: 길드 가입 신청서 (캐릭터 생성) UI] -->
        <div id="charCreationUI" class="ui-layer" style="display: none; flex-direction: column; align-items: center; justify-content: center;">
            <div class="panel" style="width: 840px; height: 640px; background: #222; border: 2px solid #aaa; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative;">
                <h2 style="margin: 5px 0;">모험가 길드 가입 신청서</h2>
                <input type="text" id="ccPlayerName" placeholder="캐릭터 이름 입력" maxlength="10">
                <div style="margin-bottom: 15px;">
                    <span style="margin: 0 5px;">남은 포인트: <span id="ccFreePoints" style="color: gold; font-weight: bold; font-size: 18px;">30</span></span>
                    <span style="font-size: 12px; color: lightgray;">(스탯 조건 충족 시 중복 습득 가능)</span>
                </div>
                
                <div style="display: flex; justify-content: space-between; width: 100%; text-align: left; flex: 1; overflow-y: auto; padding-bottom: 40px;">
                    <div style="width: 48%; display: flex; flex-direction: column; align-items: center;">
                        <canvas id="ccRadarCanvas" width="320" height="250" style="background: transparent; border: none;"></canvas>
                        
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%;">
                            <div class="stat-control-box"><div class="stat-text">체력</div><button class="stat-btn" onclick="adjustStat('hp', -1)">-</button><strong id="st_hp" style="display:inline-block; width:20px; font-size:14px;">3</strong><button class="stat-btn" onclick="adjustStat('hp', 1)">+</button></div>
                            <div class="stat-control-box"><div class="stat-text">힘</div><button class="stat-btn" onclick="adjustStat('str', -1)">-</button><strong id="st_str" style="display:inline-block; width:20px; font-size:14px;">3</strong><button class="stat-btn" onclick="adjustStat('str', 1)">+</button></div>
                            <div class="stat-control-box"><div class="stat-text">민첩</div><button class="stat-btn" onclick="adjustStat('dex', -1)">-</button><strong id="st_dex" style="display:inline-block; width:20px; font-size:14px;">3</strong><button class="stat-btn" onclick="adjustStat('dex', 1)">+</button></div>
                            <div class="stat-control-box"><div class="stat-text">마나</div><button class="stat-btn" onclick="adjustStat('mana', -1)">-</button><strong id="st_mana" style="display:inline-block; width:20px; font-size:14px;">3</strong><button class="stat-btn" onclick="adjustStat('mana', 1)">+</button></div>
                            <div class="stat-control-box"><div class="stat-text">스테미나</div><button class="stat-btn" onclick="adjustStat('stamina', -1)">-</button><strong id="st_stamina" style="display:inline-block; width:20px; font-size:16px;">3</strong><button class="stat-btn" onclick="adjustStat('stamina', 1)">+</button></div>
                            <div class="stat-control-box"><div class="stat-text">매력</div><button class="stat-btn" onclick="adjustStat('charm', -1)">-</button><strong id="st_charm" style="display:inline-block; width:20px; font-size:16px;">3</strong><button class="stat-btn" onclick="adjustStat('charm', 1)">+</button></div>
                        </div>
                    </div>
                    
                    <div style="width: 48%; border-left: 1px solid #555; padding-left: 12px; display: flex; flex-direction: column;">
                        <h4 style="margin: 0 0 5px 0; color: gold;">직업 목록</h4>
                        <div id="ccClassList" style="height: 310px; overflow-y: auto; padding-right: 5px;"></div>
                    </div>
                </div>
                <button id="ccStartBtn" class="btn" style="position: absolute; bottom: 10px; padding: 10px 40px; font-size: 16px; background: gray;" onclick="finishGuildJoin()" disabled>가입 완료</button>
            </div>
        </div>
        <!-- [MOD-005-END] -->

        <!-- [MOD-006: 인벤토리 및 상태창 UI] -->
        <div id="inventoryUI" class="ui-layer" style="display: none; flex-direction: column;">
            <div style="width: 100%; padding: 10px; background: #111; display: flex; justify-content: space-around;">
                <button id="tabInv" class="nav-btn active" onclick="switchTab('inv')">가방 / 장비</button>
                <button id="tabStats" class="nav-btn" onclick="switchTab('stats')">능력치 정보</button>
                <button class="close-btn" onclick="closeUI()">X</button>
            </div>
            <div id="viewInv" style="display: flex; height: 100%;">
                <div class="panel" style="width: 33.3%; border-right: 2px solid #666;"><h3 style="margin-top:0;">장비창</h3><div id="equipList"></div></div>
                <div class="panel" style="width: 66.7%;"><h3 style="margin-top:0;">가방</h3><div id="invBagList"></div></div>
            </div>
            <div id="viewStats" class="panel" style="display: none; height: 100%; text-align: left; padding: 20px;">
                <div style="display: flex; justify-content: space-around; align-items: flex-start;">
                    <div style="width: 40%;">
                        <h2 style="color: gold; margin-top: 0;">상태창</h2>
                        <h3 id="infoNameLevel" style="margin-bottom: 5px;"></h3>
                        <h4 id="infoClass" style="margin-top: 0; margin-bottom: 20px; color: lightgray;"></h4>
                        <h3 style="color: lightblue; border-bottom: 1px solid #555; padding-bottom: 5px;">보유 스킬 목록</h3>
                        <div id="skillList" style="background: #222; border: 1px solid #444; border-radius: 5px; padding: 10px; height: 350px; overflow-y: auto;"></div>
                    </div>
                    <div style="width: 55%; display: flex; justify-content: center;">
                        <canvas id="infoRadarCanvas" width="400" height="400" style="background: transparent; border: none; cursor: default;"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- [MOD-006-END] -->

        <!-- [MOD-007: 개인 창고 UI] -->
        <div id="storageUI" class="ui-layer" style="display: none; flex-direction: column;">
            <div style="width: 100%; padding: 10px; background: #111; text-align: center;">
                <h2 style="color: gold; margin: 0;">개인 창고 <span style="font-size: 14px; color: gray;">(타인 접근 불가)</span></h2>
                <button class="close-btn" onclick="closeUI()">X</button>
            </div>
            <div style="display: flex; height: 100%;">
                <div class="panel" style="width: 50%; border-right: 2px solid #666;"><h3 style="margin-top:0;">내 가방 (클릭하여 보관)</h3><div id="storageInvList"></div></div>
                <div class="panel" style="width: 50%;"><h3 style="margin-top:0;">창고 내부 (클릭하여 꺼내기)</h3><div id="storageBoxList"></div></div>
            </div>
        </div>
        <!-- [MOD-007-END] -->

        <!-- [MOD-008: NPC 메뉴 및 사망 모달] -->
        <div id="npcMenuUI" class="ui-layer" style="display: none; justify-content: center; align-items: center;">
            <div class="panel" style="background: #222; border: 2px solid #aaa; min-width: 300px;">
                <h2 id="npcMenuTitle" style="color: gold; margin-top:0;">메뉴</h2>
                <div id="npcMenuContent" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;"></div>
                <button class="btn" style="margin-top: 20px; width: 100%;" onclick="closeNPCMenu()">닫기</button>
            </div>
        </div>

        <div id="deathUI" class="ui-layer" style="display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(150, 0, 0, 0.7);">
            <h1 style="color: white; font-size: 50px;">사망하셨습니다.</h1>
            <h3 style="color: lightgray;">접수원은 매우 강합니다...</h3>
            <button class="btn" style="font-size: 20px; padding: 10px 20px; margin-top: 20px;" onclick="respawn()">길드에서 부활하기</button>
        </div>
        <!-- [MOD-008-END] -->
    </div>

    <!-- [MOD-009: 외부 데이터 스크립트 연결] -->
    <script src="data/maps.js"></script>
    <script src="data/jobs.js"></script>
    <!-- [MOD-009-END] -->

    <script>
     // [MOD-010: 엔진 Setup 및 월드/카메라/게임 데이터 변수]
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 3000;
        let camera = { x: 0, y: 0, width: 1000, height: 750 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            camera.width = canvas.width;
            camera.height = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = "playing"; 
        let currentMap = "guild";

        let player = {
            name: "방랑자",
            x: 500, y: 500, width: 30, height: 30, color: "cyan", speed: 5,
            stats: { hp: 3, str: 3, dex: 3, mana: 3, stamina: 3, charm: 3 },
            job: "무소속", 
            acquiredJobs: [],
            currentSkillIdx: 0,
            skillCooldowns: {},
            level: 1, exp: 0, maxExp: 100,
            maxHp: 9, currentHp: 9,
            maxStamina: 9, currentStamina: 9, staminaRegenTimer: 0,
            maxMana: 9, currentMana: 9,
            knockbackDirX: 0, knockbackDirY: 0,
            dashSpeed: 0, dashDirX: 0, dashDirY: 0, dashTimer: 0,
            targetX: 0, targetY: 0,
            activeSkillType: null,
            aimingSkill: null, // <-- [해결] 콤마 추가!
            currentQuickSlotIdx: 0,
            lockedTarget: null
        };

        let quest = { active: false, target: 10, current: 0 };
        let floatingTexts = [];
        let visualEffects = [];
        let inventory = []; 
        let equipment = []; 
        let personalStorage = []; 
        
        let totalFreePoints = 30; 
        let tempSelectedJobs = [];

        let mouseX = 0, mouseY = 0; 
        let attackTimer = 0;
        let keys = {};
        const statKeys = ["hp", "str", "dex", "mana", "stamina", "charm"];
        // [MOD-010-END]
        
        // [MOD-011: 직업 및 스킬 정보 반환 유틸리티]
      
        // [MOD-011-END]

        // [MOD-012: NPC 상호작용 및 게임 진행 로직]
        function openNPCMenu(type) {
            gameState = "npcMenu";
            const ui = document.getElementById("npcMenuUI");
            const title = document.getElementById("npcMenuTitle");
            const content = document.getElementById("npcMenuContent");
            ui.style.display = "flex";

            if (type === 'receptionist') {
                title.innerText = "접수원";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="talkReceptionist()">대화하기</button>
                    <button class="btn" style="padding: 15px; background: darkred;" onclick="attackReceptionist()">공격하기</button>
                `;
            } else if (type === 'receptionist_talk') {
                title.innerText = "접수원: 무엇을 도와드릴까요?";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="openCharCreation()">길드 가입 작성</button>
                    <button class="btn" style="padding: 15px;" onclick="takeQuest()">퀘스트 받기</button>
                `;
            } else if (type === 'portal') {
                title.innerText = "포탈";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px; background: purple;" onclick="enterDungeon()">발러 던전 입장</button>
                `;
            }
        }

        function closeNPCMenu() {
            gameState = "playing";
            document.getElementById("npcMenuUI").style.display = "none";
        }

        function talkReceptionist() { openNPCMenu('receptionist_talk'); }

        function attackReceptionist() {
            closeNPCMenu();
            addFloatingText(player.x, player.y, "9999", "red");
            player.currentHp = 0;
            player.knockbackDirX = player.x < MAP_DATA.guild.receptionist.x ? -1 : 1;
            player.knockbackDirY = -0.5; 
            gameState = "knockback";
        }

        function respawn() {
            player.currentHp = player.maxHp;
            player.currentStamina = player.maxStamina;
            player.currentMana = player.maxMana;
            player.x = 500; player.y = 500;
            currentMap = "guild";
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon) {
                MAP_DATA.dungeon.goblin.active = false;
            }
            player.aimingSkill = null;
            player.dashTimer = 0;
            gameState = "playing";
            document.getElementById("deathUI").style.display = "none";
        }

        function takeQuest() {
            quest.active = true;
            quest.current = 0;
            alert("퀘스트 수락: 고블린 10마리 잡기");
            closeNPCMenu();
        }

        function enterDungeon() {
            currentMap = "dungeon";
            player.x = 1500; player.y = 1500; // 던전은 맵 중앙 부근에서 시작
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon) {
                MAP_DATA.dungeon.goblin.hp = MAP_DATA.dungeon.goblin.maxHp; 
                MAP_DATA.dungeon.goblin.x = 1500; MAP_DATA.dungeon.goblin.y = 1200;
                MAP_DATA.dungeon.goblin.active = true;
            }
            player.aimingSkill = null;
            player.dashTimer = 0;
            closeNPCMenu();
        }
        // [MOD-012-END]

        // [MOD-013: 개인 창고 UI 로직]
        function openStorage() {
            gameState = "storage";
            document.getElementById("storageUI").style.display = "flex";
            renderStorageUI();
        }

        function renderStorageUI() {
            const invDiv = document.getElementById("storageInvList");
            const boxDiv = document.getElementById("storageBoxList");
            invDiv.innerHTML = ""; boxDiv.innerHTML = "";

            inventory.forEach((item, index) => {
                let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                div.innerHTML = `[${item.type}] ${item.name}`;
                div.onclick = () => { personalStorage.push(item); inventory.splice(index, 1); renderStorageUI(); };
                invDiv.appendChild(div);
            });

            personalStorage.forEach((item, index) => {
                let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                div.innerHTML = `[${item.type}] ${item.name}`;
                div.onclick = () => { inventory.push(item); personalStorage.splice(index, 1); renderStorageUI(); };
                boxDiv.appendChild(div);

        // [MOD-014: 캐릭터 생성(길드 가입) 로직 및 UI]
        function openCharCreation() {
            closeNPCMenu();
            gameState = "charCreation";
            document.getElementById("charCreationUI").style.display = "flex";

            updateCharCreationUI();

        function drawRadarChart(canvasId) {
            const rc = document.getElementById(canvasId);
            if (!rc) return;
            const rctx = rc.getContext("2d");
            const w = rc.width, h = rc.height, cx = w / 2, cy = h / 2;
            const maxR = cx - 75; 
            const maxStat = 25; 
            rctx.clearRect(0, 0, w, h);
            const labels = ["체력", "힘", "민첩", "마나", "스테미나", "매력"];

            rctx.strokeStyle = "#555"; rctx.lineWidth = 1;
            for(let step = 1; step <= 4; step++) {
                let r = maxR * (step / 4);
                rctx.beginPath();
                for(let i=0; i<6; i++) {
                    let angle = (Math.PI / 3) * i - (Math.PI / 2);
                    let x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
                    if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
                }
                rctx.closePath(); rctx.stroke();
            }

            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                rctx.beginPath();
                rctx.moveTo(cx, cy);
                rctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
                rctx.stroke();

                rctx.fillStyle = "white"; rctx.font = "12px sans-serif";
                rctx.textAlign = "center"; rctx.textBaseline = "middle";
                let lx = cx + Math.cos(angle) * (maxR + 35);
                let ly = cy + Math.sin(angle) * (maxR + 35);
                rctx.fillText(`${labels[i]}: ${player.stats[statKeys[i]]}`, lx, ly);
            }

            rctx.fillStyle = "rgba(255, 215, 0, 0.5)"; 
            rctx.strokeStyle = "gold"; rctx.lineWidth = 2;
            rctx.beginPath();
            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                let val = Math.min(player.stats[statKeys[i]], maxStat); 
                let r = maxR * (val / maxStat);
                let x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
                if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
            }
            rctx.closePath(); rctx.fill(); rctx.stroke();
        }

        function adjustStat(stat, amount) {
            if (amount > 0 && totalFreePoints > 0) {
                player.stats[stat]++;
                totalFreePoints--;
            } else if (amount < 0 && player.stats[stat] > 3) {
                player.stats[stat]--;
                totalFreePoints++;
            }
            updateCharCreationUI();
        }

        function updateCharCreationUI() {
            document.getElementById("ccFreePoints").innerText = totalFreePoints;
            statKeys.forEach(k => {
                const el = document.getElementById(`st_${k}`);
                if(el) el.innerText = player.stats[k];
            });
            renderClassList();
            drawRadarChart("ccRadarCanvas");
            checkStartBtn();
        }

        function toggleJob(job) {
            let targetVal = job.reqVal || 6;
            let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);

            if (!meetsReq && job.req.length > 0) {
                alert(`스탯 조건을 먼저 만족해야 합니다! (${job.desc})`);
                return;
            }

            let idx = tempSelectedJobs.indexOf(job.name);
            if (idx > -1) {
                if (tempSelectedJobs.length <= 1) {
                    alert("최소 1개의 직업은 선택되어 있어야 합니다!");
                    return;
                }
                tempSelectedJobs.splice(idx, 1);
            } else {
                if (job.name === "기사") {
                    let kIdx = tempSelectedJobs.indexOf("견습 기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                } else if (job.name === "견습 기사") {
                    let kIdx = tempSelectedJobs.indexOf("기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                }
                tempSelectedJobs.push(job.name);
            }
            updateCharCreationUI();
        }

        function checkStartBtn() {
            const btn = document.getElementById("ccStartBtn");
            if (tempSelectedJobs.length > 0) {
                btn.disabled = false;
                btn.style.background = "limegreen";
            } else {
                btn.disabled = true;
                btn.style.background = "gray";
            }
        }

        function renderClassList() {
            const listDiv = document.getElementById("ccClassList");
            listDiv.innerHTML = "";
            
            JOB_DATA.forEach(job => {
                let targetVal = job.reqVal || 6;
                let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);
                let isSelected = tempSelectedJobs.includes(job.name);

                let div = document.createElement("div");
                div.className = "class-item";
                
                if (isSelected) {
                    div.classList.add("selected");
                    div.innerHTML = `<span style='color:gold;'>[보유 중]</span> ${job.name} <br><small style="color:white;">R스킬: ${job.skill.name}</small>`;
                } else if (!meetsReq && job.req.length > 0) {
                    div.classList.add("locked");
                    div.innerHTML = `<span style="color:gray;">[조건 미달]</span> ${job.name} <br><small>${job.desc}</small>`;
                } else {
                    div.innerHTML = `<span style='color:cyan;'>[습득 가능]</span> ${job.name} <br><small style="color:lightgray;">${job.desc}</small>`;
                }
                
                div.onclick = () => toggleJob(job);
                listDiv.appendChild(div);
            });
        }

            player.job = player.acquiredJobs.join(" + ");

       // [MOD-015: 스킬 시스템 및 전투 연산 로직 (직업 제거 및 퀵슬롯 기반)]
        
        // 테스트용 임시 스킬 데이터 (추후 인챈트 부여 시 장착될 데이터)
        const MOCK_SKILLS = {
            leap: { id: "leap", name: "도약", type: "leap_only", cooldown: 2, bonusDmg: 0 },
            charge: { id: "charge", name: "돌진", type: "charge", cooldown: 3, bonusDmg: 10 },
            slam: { id: "slam", name: "강타", type: "jump_slam", cooldown: 5, bonusDmg: 20 }
        };
        
        // 플레이어 퀵슬롯 변수 초기화
        if (!player.quickSlots) {
            player.quickSlots = [ MOCK_SKILLS.leap, MOCK_SKILLS.charge, MOCK_SKILLS.slam, null, null ];

        // 현재 활성화된 퀵슬롯의 스킬 반환
        function getActiveQuickSlotSkill() {
            return player.quickSlots[player.currentQuickSlotIdx];
        }

        // R키: 퀵슬롯 회전 및 UI 업데이트
        function handleRKey() {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            
            player.currentQuickSlotIdx = (player.currentQuickSlotIdx + 1) % 5;
            player.aimingSkill = null; // 회전 시 기존 조준 취소
            updateQuickSlotUI();
        }

        // 퀵슬롯 UI 시각적 갱신 (리볼버 회전 로직)
        function updateQuickSlotUI() {
            const wheel = document.getElementById("quick-slot-wheel");
            if (wheel) {
                // 선택된 슬롯 인덱스에 따라 탄창 전체를 역방향으로 72도씩 회전
                let rotation = -(player.currentQuickSlotIdx * 72);
                wheel.style.transform = `rotate(${rotation}deg)`;
            }

            for(let i=0; i<5; i++) {
                let slot = document.getElementById("q-slot-" + (i+1));
                let inner = slot ? slot.querySelector('.q-slot-inner') : null;
                if (!slot || !inner) continue;
                
                let skill = player.quickSlots[i];
                inner.innerHTML = skill ? `<span style="color:white; font-size:11px; font-weight:bold;">${skill.name}</span>` : "";

                // 휠이 돌아가도 스킬 이름 텍스트는 항상 똑바로 서있도록 보정
                let counterRotation = -(i * 72) - (-(player.currentQuickSlotIdx * 72));
                inner.style.transform = `rotate(${counterRotation}deg)`;

                // 12시(정중앙)에 위치한 슬롯 강조
                if (i === player.currentQuickSlotIdx) {
                    slot.style.border = "3px solid #ff3333";
                    slot.style.background = "rgba(255, 50, 50, 0.6)";
                } else {
                    slot.style.border = "2px solid rgba(255, 255, 255, 0.8)";
                    slot.style.background = "rgba(0, 0, 0, 0.4)";
                }
            }
        }

        // 우클릭: 퀵슬롯 스킬 조준(활성화)
        function aimCurrentQuickSlot() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) {
                addFloatingText(player.x + player.width/2, player.y - 10, "빈 슬롯입니다.", "gray");
                return;
            }

            let cd = player.skillCooldowns[activeSkill.id] || 0;
            if (cd > 0) {
                addFloatingText(player.x + player.width/2, player.y - 10, `${activeSkill.name} 쿨타임!`, "yellow");
                return;
            }

            player.aimingSkill = activeSkill.type;
            addFloatingText(player.x + player.width/2, player.y - 30, `[${activeSkill.name}] 조준 중...`, "cyan");
        }

        function startSkillCooldown(skillId, cooldownSec) {
            player.skillCooldowns[skillId] = cooldownSec * 60;
        }

        // 좌클릭: 조준된 스킬 발동
        function executeAimingSkill() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) return false;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x + player.width / 2;
            const pCenterY = player.y + player.height / 2;
            const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);

            if (player.aimingSkill === "leap_only") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                player.dashSpeed = 15;
                player.dashDirX = Math.cos(aimAngle);
                player.dashDirY = Math.sin(aimAngle);
                player.dashTimer = 6;
                player.activeSkillType = "leap_only";
                addVisualEffect(pCenterX, pCenterY, 30, "cyan");
                player.aimingSkill = null;
                return true;
            }
            else if (player.aimingSkill === "jump_slam") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                let targetX = Math.max(0, Math.min(WORLD_WIDTH - player.width, wMouseX - player.width / 2));
                let targetY = Math.max(0, Math.min(WORLD_HEIGHT - player.height, wMouseY - player.height / 2));
                
                if (!checkObstacleCollision(targetX, targetY)) {
                    player.x = targetX;
                    player.y = targetY;
                }
                const slamX = player.x + player.width / 2;
                const slamY = player.y + player.height / 2;
                addVisualEffect(slamX, slamY, 80, "red");

                const totalDmg = (player.stats.str * 3) + activeSkill.bonusDmg;
                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    if (Math.hypot(MAP_DATA.dungeon.goblin.x - slamX, MAP_DATA.dungeon.goblin.y - slamY) < 80 + MAP_DATA.dungeon.goblin.size / 2) {
                        applyDamageToGoblin(totalDmg);
                    }
                }
                player.aimingSkill = null;
                return true;
            } 
            else if (player.aimingSkill === "charge") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                const dx = wMouseX - pCenterX;
                const dy = wMouseY - pCenterY;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const speed = 22; 
                    player.dashSpeed = speed;
                    player.dashDirX = dx / dist;
                    player.dashDirY = dy / dist;
                    player.dashTimer = Math.min(40, Math.ceil(dist / speed));
                    player.targetX = wMouseX - player.width / 2;
                    player.targetY = wMouseY - player.height / 2;
                    player.activeSkillType = "charge";
                    addVisualEffect(pCenterX, pCenterY, 40, "yellow");
                }
                player.aimingSkill = null;
                return true;
            }
            return false;
        }

        // 데미지 처리 및 타겟 초기화 로직
        function applyDamageToGoblin(dmg) {
            let gob = MAP_DATA.dungeon.goblin;
            gob.hp -= dmg;
            addFloatingText(gob.x, gob.y - gob.size, dmg, "orange");
            if (gob.hp <= 0) {
                gob.hp = gob.maxHp;
                gob.x = Math.random() * (WORLD_WIDTH - 200) + 100;
                gob.y = Math.random() * (WORLD_HEIGHT - 200) + 100;
                
                player.lockedTarget = null; // 적 사망 시 고정 타겟 해제

                player.exp += gob.expReward;
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp = Math.floor(player.maxExp * 1.5);
                    player.currentHp = player.maxHp;
                    player.currentStamina = player.maxStamina;
                    player.currentMana = player.maxMana;
                    addFloatingText(player.x + player.width/2, player.y - 30, "LEVEL UP!", "gold");
                }
            }
        }

        function addVisualEffect(x, y, radius, color) {
            visualEffects.push({ x: x, y: y, radius: radius, color: color, alpha: 0.6, timer: 15 });
        }

        // [MOD-016: 입력 이벤트 리스너 (조작계 변경 및 오토 타겟팅)]
        function selectQuickSlot(index) {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            player.currentQuickSlotIdx = index;
            player.aimingSkill = null; 
            if (typeof updateQuickSlotUI === "function") updateQuickSlotUI();
        }

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (e.key.toLowerCase() === 'r') handleRKey();
            if (e.key.toLowerCase() === 'e' && gameState !== "charCreation" && gameState !== "dead" && gameState !== "knockback") {
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            }
            if (gameState === "playing") {
                if (e.key === '1') selectQuickSlot(0);
                if (e.key === '2') selectQuickSlot(1);
                if (e.key === '3') selectQuickSlot(2);
                if (e.key === '4') selectQuickSlot(3);
                if (e.key === '5') selectQuickSlot(4);
            }
        });
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        window.addEventListener("contextmenu", (e) => {
            e.preventDefault(); 
        });

        for (let i = 1; i <= 5; i++) {
            let el = document.getElementById("q-slot-" + i);
            if (el) {
                el.addEventListener("touchstart", (e) => { e.preventDefault(); selectQuickSlot(i - 1); });
                el.addEventListener("mousedown", (e) => { e.preventDefault(); selectQuickSlot(i - 1); });
            }
        }

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x: x + (Math.random() * 20 - 10), y: y - 10, text: text, color: color, alpha: 1.0, timer: 30 });
        }

        canvas.addEventListener("mousedown", (e) => {
            if (gameState !== "playing") return;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x + player.width / 2;
            const pCenterY = player.y + player.height / 2;

            if (e.button === 2) {
                aimCurrentQuickSlot();
                return;
            }

            if (e.button === 0) {
                if (player.aimingSkill) {
                    executeAimingSkill();
                    return;
                }

                if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                    const rec = MAP_DATA.guild.receptionist;
                    const por = MAP_DATA.guild.portal;
                    if (wMouseX >= rec.x && wMouseX <= rec.x + rec.size && wMouseY >= rec.y && wMouseY <= rec.y + rec.size) {
                        if (Math.hypot((rec.x+15) - pCenterX, (rec.y+15) - pCenterY) < 100) { openNPCMenu('receptionist'); return; }
                    }
                    if (wMouseX >= por.x && wMouseX <= por.x + por.w && wMouseY >= por.y && wMouseY <= por.y + por.h) {
                        if (Math.hypot((por.x+20) - pCenterX, (por.y+100) - pCenterY) < 100) { openNPCMenu('portal'); return; }
                    }
                }

                if (player.currentStamina < 2) {
                    addFloatingText(pCenterX, player.y - 10, "스테미나 부족!", "yellow");
                    return;
                }
                player.currentStamina -= 2;
                attackTimer = 10;

                const baseRange = 60; 
                const baseSpread = Math.PI / 2; 
                const totalDmg = (player.stats.str * 3) + 5; 
                const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);

                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    const gob = MAP_DATA.dungeon.goblin;
                    
                    if (Math.hypot(wMouseX - gob.x, wMouseY - gob.y) < gob.size) {
                        player.lockedTarget = gob;
                        addFloatingText(gob.x, gob.y - 30, "타겟 고정!", "red");
                    }

                    let targetToAttack = null;
                    if (player.lockedTarget && Math.hypot(player.lockedTarget.x - pCenterX, player.lockedTarget.y - pCenterY) <= baseRange + player.lockedTarget.size / 2) {
                        targetToAttack = player.lockedTarget;
                    } 
                    else if (Math.hypot(gob.x - pCenterX, gob.y - pCenterY) <= baseRange + gob.size / 2) {
                        targetToAttack = gob;
                    }

                    if (targetToAttack) {
                        applyDamageToGoblin(totalDmg);
                    } else {
                        const dx = gob.x - pCenterX;
                        const dy = gob.y - pCenterY;
                        if (Math.hypot(dx, dy) < baseRange + gob.size / 2) {
                            let angleDiff = Math.abs(Math.atan2(dy, dx) - aimAngle);
                            if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                            if (angleDiff <= baseSpread / 2) {
                                applyDamageToGoblin(totalDmg);
                            }
                        }
                    }
                }
            }
        });

        (function initVirtualPad() {
            const stickBase = document.getElementById("vpad-stick-base");
            const stickKnob = document.getElementById("vpad-stick-knob");
            const btnAtk = document.getElementById("vpad-atk");
            const btnSkill = document.getElementById("vpad-skill");
            const btnR = document.getElementById("vpad-r");
            const btnE = document.getElementById("vpad-e");

            let touchId = null;
            let startX = 0, startY = 0;

            window.addEventListener("touchstart", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.clientX < window.innerWidth / 2 && touchId === null) {
                        touchId = t.identifier;
                        startX = t.clientX;
                        startY = t.clientY;
                        if(stickBase) {
                            stickBase.style.left = (startX - (window.innerWidth * 0.08)) + "px";
                            stickBase.style.top = (startY - (window.innerHeight * 0.08)) + "px";
                            stickBase.style.bottom = "auto";
                            stickBase.style.display = "block";
                            if(stickKnob) stickKnob.style.transform = `translate(0px, 0px)`;
                        }
                    }
                }
            }, { passive: false });

            window.addEventListener("touchmove", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.identifier === touchId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxR = 45;
                        if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
                        if(stickKnob) stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

                        keys["w"] = dy < -12; keys["s"] = dy > 12;
                        keys["a"] = dx < -12; keys["d"] = dx > 12;

                        if (dist > 5) {
                            let moveAngle = Math.atan2(dy, dx);
                            let screenPx = player.x + player.width/2 - camera.x;
                            let screenPy = player.y + player.height/2 - camera.y;
                            
                            mouseX = screenPx + Math.cos(moveAngle) * 120;
                            mouseY = screenPy + Math.sin(moveAngle) * 120;
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        if(stickBase) stickBase.style.display = "none";
                        keys["w"] = false; keys["s"] = false; keys["a"] = false; keys["d"] = false;
                    }
                }
            };
            window.addEventListener("touchend", endTouch);
            window.addEventListener("touchcancel", endTouch);

            if(btnAtk) btnAtk.addEventListener("touchstart", (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 0 })); });
            if(btnSkill) btnSkill.addEventListener("touchstart", (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 2 })); });
            if(btnR) btnR.addEventListener("touchstart", (e) => { e.preventDefault(); handleRKey(); });
            if(btnE) btnE.addEventListener("touchstart", (e) => {
                e.preventDefault();
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            });
        })();
        // [MOD-016-END]

        // [MOD-017: UI 제어 및 충돌 유틸리티]
        function switchTab(tabId) {
            if(tabId === 'inv') {
                document.getElementById("viewInv").style.display = "flex";
                document.getElementById("viewStats").style.display = "none";
                document.getElementById("tabInv").classList.add("active");
                document.getElementById("tabStats").classList.remove("active");
                
                const equipDiv = document.getElementById("equipList");
                const bagDiv = document.getElementById("invBagList");
                equipDiv.innerHTML = ""; bagDiv.innerHTML = "";
                equipment.forEach(item => {
                    let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                    div.innerHTML = `[${item.type}] ${item.name} <br><small>${item.desc || ''}</small>`; equipDiv.appendChild(div);
                });
                inventory.forEach(item => {
                    let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                    div.innerHTML = `[${item.type}] ${item.name}`; bagDiv.appendChild(div);
                });
            } else {
                document.getElementById("viewInv").style.display = "none";
                document.getElementById("viewStats").style.display = "flex";
                document.getElementById("tabInv").classList.remove("active");
                document.getElementById("tabStats").classList.add("active");
                document.getElementById("infoNameLevel").innerText = `${player.name} [Lv.${player.level}]`;
                document.getElementById("infoClass").innerText = `장비 기반 스킬 운용 중`;
                
                const skillListDiv = document.getElementById("skillList");
                skillListDiv.innerHTML = "<span style='color:gray;'>퀵슬롯 스킬 내역이 여기에 표시될 예정입니다.</span>";

                drawRadarChart("infoRadarCanvas");
            }
        }

        function closeUI() {
            gameState = "playing";
            document.getElementById("inventoryUI").style.display = "none";
            document.getElementById("storageUI").style.display = "none";
        }

        function checkRectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function checkObstacleCollision(x, y) {
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const rec = MAP_DATA.guild.receptionist;
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;
                if (checkRectCollision(x, y, player.width, player.height, rec.x, rec.y, rec.size, rec.size)) return true;
                if (checkRectCollision(x, y, player.width, player.height, por.x, por.y, por.w, por.h)) return true;
                if (checkRectCollision(x, y, player.width, player.height, chs.x, chs.y, chs.w, chs.h)) return true;
            }
            return false;
        }
        // [MOD-017-END]

       // [MOD-018: 메인 게임 루프 (업데이트 & 렌더링 - 직업 완전 제거)]
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === "charCreation" || gameState === "npcMenu") { 
                requestAnimationFrame(gameLoop); return; 
            }

            const pCenterX = player.x + player.width / 2;
            const pCenterY = player.y + player.height / 2;
            
            // 직업 스킬 대신 현재 퀵슬롯에 등록된 스킬 확인
            const activeSkill = typeof getActiveQuickSlotSkill === "function" ? getActiveQuickSlotSkill() : null;

            for (let sId in player.skillCooldowns) {
                if (player.skillCooldowns[sId] > 0) player.skillCooldowns[sId]--;
            }

            // === [업데이트 로직] ===
            if (gameState === "playing") {
                let nextX = player.x;
                let nextY = player.y;

                if (player.dashTimer > 0) {
                    player.dashTimer--;
                    nextX += player.dashDirX * player.dashSpeed;
                    nextY += player.dashDirY * player.dashSpeed;

                    if (player.activeSkillType === "charge") {
                        const distToTarget = Math.hypot((player.targetX) - nextX, (player.targetY) - nextY);
                        if (distToTarget <= player.dashSpeed) {
                            nextX = player.targetX;
                            nextY = player.targetY;
                            player.dashTimer = 0;
                        }
                    }

                    if (nextX <= 0 || nextX >= WORLD_WIDTH - player.width || nextY <= 0 || nextY >= WORLD_HEIGHT - player.height || checkObstacleCollision(nextX, nextY)) {
                        player.dashTimer = 0;
                        nextX = player.x; 
                        nextY = player.y; 
                    }

                    if ((player.activeSkillType === "charge" || player.activeSkillType === "leap_attack") && currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                        let gob = MAP_DATA.dungeon.goblin;
                        if (checkRectCollision(nextX, nextY, player.width, player.height, gob.x - gob.size/2, gob.y - gob.size/2, gob.size, gob.size)) {
                            // 임시 무기 데미지 + 스킬 데미지 연산
                            const dmg = (player.stats.str * 3) + (activeSkill ? activeSkill.bonusDmg : 0);
                            applyDamageToGoblin(dmg);
                        }
                    }
                } else {
                    if (keys["ArrowUp"] || keys["w"]) nextY -= player.speed;
                    if (keys["ArrowDown"] || keys["s"]) nextY += player.speed;
                    if (keys["ArrowLeft"] || keys["a"]) nextX -= player.speed;
                    if (keys["ArrowRight"] || keys["d"]) nextX += player.speed;

                    nextX = Math.max(0, Math.min(nextX, WORLD_WIDTH - player.width));
                    nextY = Math.max(0, Math.min(nextY, WORLD_HEIGHT - player.height));

                    if (checkObstacleCollision(nextX, nextY)) {
                        nextX = player.x; nextY = player.y;
                    }
                }

                player.x = nextX;
                player.y = nextY;

                if (player.currentStamina < player.maxStamina) {
                    player.staminaRegenTimer++;
                    if (player.staminaRegenTimer >= 60) {
                        player.currentStamina = Math.min(player.maxStamina, player.currentStamina + 1);
                        player.staminaRegenTimer = 0;
                    }
                }
            } else if (gameState === "knockback") {
                player.x += player.knockbackDirX * 25;
                player.y += player.knockbackDirY * 5;
                
                if (player.x <= 0 || player.x >= WORLD_WIDTH - player.width || player.y <= 0) {
                    player.x = Math.max(0, Math.min(player.x, WORLD_WIDTH - player.width));
                    gameState = "dead";
                    document.getElementById("deathUI").style.display = "flex";
                }
            }

            // 1. 카메라 추적 연산
            camera.x = player.x + player.width / 2 - canvas.width / 2;
            camera.y = player.y + player.height / 2 - canvas.height / 2;
            camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - canvas.width));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - canvas.height));

            // === [월드 렌더링 시작] ===
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 격자무늬(Grid) 바닥
            ctx.strokeStyle = "#3a3a3a";
            ctx.lineWidth = 1;
            for(let i = 0; i <= WORLD_WIDTH; i += 100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_HEIGHT); ctx.stroke();
            }
            for(let i = 0; i <= WORLD_HEIGHT; i += 100) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_WIDTH, i); ctx.stroke();
            }

            // 맵 환경
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const rec = MAP_DATA.guild.receptionist;
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;

                ctx.fillStyle = por.color; ctx.fillRect(por.x, por.y, por.w, por.h);
                ctx.fillStyle = "white"; ctx.font = "bold 14px sans-serif"; 
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("포탈", por.x + por.w/2, por.y - 15);

                ctx.fillStyle = rec.color; ctx.fillRect(rec.x, rec.y, rec.size, rec.size);
                
                const recY = rec.y - rec.size - 10;
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(rec.x - 25, recY, 80, 16);
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; 
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("접수원", rec.x + rec.size/2, recY + 8);
                ctx.fillStyle = "red"; ctx.fillRect(rec.x - 25, recY + 18, 80, 3);

                ctx.fillStyle = chs.color; ctx.fillRect(chs.x, chs.y, chs.w, chs.h);
                ctx.strokeStyle = "#8B6508"; ctx.lineWidth = 3; ctx.strokeRect(chs.x, chs.y, chs.w, chs.h);
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("개인 창고", chs.x + chs.w/2, chs.y - 10);
            } 
            else if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined") {
                let gob = MAP_DATA.dungeon.goblin;
                if (gob.active) {
                    const dx = pCenterX - gob.x, dy = pCenterY - gob.y;
                    const dist = Math.hypot(dx, dy);
                    if (gameState === "playing") {
                        if (dist > 20) {
                            gob.x += (dx / dist) * gob.speed; gob.y += (dy / dist) * gob.speed;
                        } else {
                            if (Math.random() < 0.05) { 
                                player.currentHp -= gob.damage;
                                addFloatingText(pCenterX, player.y - 10, gob.damage, "red");
                                if (player.currentHp < 0) player.currentHp = 0; 
                            }
                        }
                    }

                    // [추가] 락온 타겟 시각적 표시 (붉은색 점선 원)
                    if (player.lockedTarget === gob) {
                        ctx.beginPath();
                        ctx.arc(gob.x, gob.y, gob.size + 10, 0, Math.PI * 2);
                        ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
                        ctx.lineWidth = 3;
                        ctx.setLineDash([6, 6]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    ctx.fillStyle = "limegreen";
                    ctx.beginPath(); ctx.moveTo(gob.x, gob.y - gob.size / 2);
                    ctx.lineTo(gob.x - gob.size / 2, gob.y + gob.size / 2);
                    ctx.lineTo(gob.x + gob.size / 2, gob.y + gob.size / 2); ctx.fill();

                    const tagY = gob.y - gob.size - 25;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(gob.x - 40, tagY, 80, 16);
                    ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; 
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(gob.name, gob.x, tagY + 8);
                    ctx.fillStyle = "red"; ctx.fillRect(gob.x - 40, tagY + 18, 80 * Math.max(0, gob.hp / gob.maxHp), 3);
                }
            }

            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let eff = visualEffects[i];
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.fillStyle = eff.color; ctx.globalAlpha = eff.alpha; ctx.fill(); ctx.restore();
                eff.alpha -= 0.04; eff.timer--;
                if (eff.timer <= 0) visualEffects.splice(i, 1);
            }

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 무기 및 스킬 조준선 렌더링
            if (gameState === "playing") {
                let wMouseX = mouseX + camera.x;
                let wMouseY = mouseY + camera.y;
                const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);

                if (player.aimingSkill === "leap_only") {
                    const fixedLeapDist = player.width * 3;
                    const leapW = player.width + 10;
                    ctx.save(); ctx.translate(pCenterX, pCenterY); ctx.rotate(aimAngle);
                    ctx.fillStyle = "rgba(255, 215, 0, 0.3)"; ctx.fillRect(0, -leapW / 2, fixedLeapDist, leapW);
                    ctx.strokeStyle = "gold"; ctx.lineWidth = 2; ctx.strokeRect(0, -leapW / 2, fixedLeapDist, leapW); ctx.restore();
                }
                else if (player.aimingSkill === "jump_slam") {
                    ctx.save(); ctx.beginPath(); ctx.arc(wMouseX, wMouseY, 80, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 69, 0, 0.25)"; ctx.fill();
                    ctx.strokeStyle = "orangered"; ctx.lineWidth = 2; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(pCenterX, pCenterY); ctx.lineTo(wMouseX, wMouseY);
                    ctx.strokeStyle = "rgba(255, 69, 0, 0.4)"; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.restore();
                } 
                else if (player.aimingSkill === "charge") {
                    const chargeDist = Math.hypot(wMouseX - pCenterX, wMouseY - pCenterY);
                    const chargeW = player.width + 10;
                    ctx.save(); ctx.translate(pCenterX, pCenterY); ctx.rotate(aimAngle);
                    ctx.fillStyle = "rgba(255, 215, 0, 0.25)"; ctx.fillRect(0, -chargeW / 2, chargeDist, chargeW);
                    ctx.strokeStyle = "gold"; ctx.lineWidth = 2; ctx.strokeRect(0, -chargeW / 2, chargeDist, chargeW); ctx.restore();
                } 
                else {
                    const baseRange = 60; // 무기 기본 사거리
                    const baseSpread = Math.PI / 2;
                    ctx.beginPath(); ctx.moveTo(pCenterX, pCenterY);
                    ctx.arc(pCenterX, pCenterY, baseRange, aimAngle - baseSpread / 2, aimAngle + baseSpread / 2);
                    ctx.lineTo(pCenterX, pCenterY);
                    ctx.fillStyle = attackTimer > 0 ? "rgba(255, 255, 255, 0.7)" : "rgba(255, 255, 255, 0.15)";
                    if(attackTimer > 0) attackTimer--;
                    ctx.fill();
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
                ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(ft.text, ft.x, ft.y);
                ft.y -= 1; ft.alpha -= 0.03; ft.timer--;
                if (ft.timer <= 0) floatingTexts.splice(i, 1); 
            }
            ctx.globalAlpha = 1.0; 

            ctx.restore(); 
            // === [월드 렌더링 종료] ===

            // === [HUD 렌더링 시작 (고정 픽셀 좌표)] ===
            const hudX = 10, hudY = 10, hudW = 210, hudH = 95;

            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(hudX, hudY, hudW, hudH);

            ctx.fillStyle = "white"; ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "left"; ctx.textBaseline = "top";
            ctx.fillText(`[Lv.${player.level}] ${player.name}`, hudX + 10, hudY + 10); // 직업 텍스트 삭제됨

            const barW = 180, barH = 10;
            let currentBarY = hudY + 30;

            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "red"; ctx.fillRect(hudX + 15, currentBarY, barW * (Math.max(0, player.currentHp) / player.maxHp), barH);
            ctx.fillStyle = "white"; ctx.font = "10px sans-serif"; ctx.fillText(`HP: ${Math.floor(player.currentHp)}/${player.maxHp}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "yellow"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.currentStamina / player.maxStamina), barH);
            ctx.fillStyle = "black"; ctx.fillText(`ST: ${Math.floor(player.currentStamina)}/${player.maxStamina}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "dodgerblue"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.currentMana / player.maxMana), barH);
            ctx.fillStyle = "white"; ctx.fillText(`MP: ${Math.floor(player.currentMana)}/${player.maxMana}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH - 2);
            ctx.fillStyle = "limegreen"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.exp / player.maxExp), barH - 2);
            ctx.fillStyle = "black"; ctx.fillText(`EXP: ${Math.floor(player.exp)}/${player.maxExp}`, hudX + 20, currentBarY - 2);

            // 퀘스트 HUD (해상도 자동 조절 대응을 위해 우측 정렬 유지)
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(canvas.width - 220, 10, 210, 36);
            ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillStyle = quest.active && quest.current >= quest.target ? "gold" : "white";
            ctx.fillText(quest.active ? `퀘스트: 고블린 (${quest.current}/${quest.target})` : "진행중인 퀘스트 없음", canvas.width - 210, 28);

            requestAnimationFrame(gameLoop);
        }
        // [MOD-018-END]

        // [MOD-019: 메인 실행부]
        gameLoop();
        // [MOD-019-END]
    </script>
</body>
</html>
