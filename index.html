        <!-- [MOD-007: 개인 창고 UI (추후 그리드 시스템으로 연동 예정)] -->
        <div id="storageUI" class="ui-layer" style="display: none; flex-direction: column;">
            <div style="width: 100%; padding: 10px; background: #111; text-align: center;">
                <h2 style="color: gold; margin: 0;">개인 창고 <span style="font-size: 14px; color: gray;">(타인 접근 불가)</span></h2>
                <button class="close-btn" onclick="closeUI()">X</button>
            </div>
            <div style="display: flex; height: 100%;">
                <div class="panel" style="width: 50%; border-right: 2px solid #666;"><h3 style="margin-top:0;">내 가방 (클릭하여 보관)</h3><div id="storageInvList"></div></div>
                <div class="panel" style="width: 50%;"><h3 style="margin-top:0;">창고 내부 (클릭하여 꺼내기)</h3><div id="storageBoxList"></div></div>
            </div>
        </div>
        <!-- [MOD-007-END] -->

        <!-- [MOD-008: NPC 메뉴 및 사망 모달 팝업] -->
        <!-- 접수원, 포탈 등 NPC 클릭 시 뜨는 인터랙션 메뉴 -->
        <div id="npcMenuUI" class="ui-layer" style="display: none; justify-content: center; align-items: center;">
            <div class="panel" style="background: #222; border: 2px solid #aaa; min-width: 300px;">
                <h2 id="npcMenuTitle" style="color: gold; margin-top:0;">메뉴</h2>
                <div id="npcMenuContent" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;"></div>
                <button class="btn" style="margin-top: 20px; width: 100%;" onclick="closeNPCMenu()">닫기</button>
            </div>
        </div>

        <!-- 체력이 0이 되었을 때 표시되는 데스 스크린 -->
        <div id="deathUI" class="ui-layer" style="display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(150, 0, 0, 0.7);">
            <h1 style="color: white; font-size: 50px;">사망하셨습니다.</h1>
            <h3 style="color: lightgray;">접수원은 매우 강합니다...</h3>
            <button class="btn" style="font-size: 20px; padding: 10px 20px; margin-top: 20px;" onclick="respawn()">길드에서 부활하기</button>
        </div>
        <!-- [MOD-008-END] -->
    </div>

    <!-- [MOD-009: 외부 데이터 스크립트 파일 연결] -->
    <!-- 맵 좌표 데이터 및 직업 스탯 데이터 (현재 HTML 환경 내엔 생략됨) -->
    <script src="data/maps.js"></script>
    <script src="data/jobs.js"></script>
    <!-- [MOD-009-END] -->

    <script>
        // [MOD-010: 게임 엔진 초기화 및 전역 변수 선언]
        // [MOD-010-1: 캔버스 및 카메라 설정]
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const WORLD_WIDTH = 3000;  // 전체 월드의 가로 크기
        const WORLD_HEIGHT = 3000; // 전체 월드의 세로 크기
        let camera = { x: 0, y: 0, width: 1000, height: 750 }; // 카메라 뷰포트 영역

        // 창 크기 변경 시 캔버스 해상도를 동기화하여 깨짐 방지
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            camera.width = canvas.width;
            camera.height = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // [MOD-010-2: 게임 상태 및 플레이어 데이터 객체]
        let gameState = "playing"; // 현재 게임 상태 (playing, inventory, charCreation, npcMenu, dead 등)
        let currentMap = "guild";  // 현재 위치한 맵 이름

        let player = {
            name: "방랑자",
            x: 500, y: 500, width: 30, height: 30, color: "cyan", speed: 5, // 기본 위치 및 렌더링 정보 (width/height는 추후 44로 덮어씌워짐)
            stats: { hp: 3, str: 3, dex: 3, mana: 3, stamina: 3, charm: 3 }, // 기본 스탯
            job: "무소속", 
            acquiredJobs: [], // 습득한 직업 목록
            currentSkillIdx: 0,
            skillCooldowns: {}, // 스킬별 쿨타임 관리 객체
            level: 1, exp: 0, maxExp: 100, // 레벨업 관련 경험치
            maxHp: 9, currentHp: 9, // 체력
            maxStamina: 9, currentStamina: 9, staminaRegenTimer: 0, // 달리기 및 스킬에 소모되는 스태미나
            maxMana: 9, currentMana: 9, // 마나
            knockbackDirX: 0, knockbackDirY: 0, // 피격 시 넉백 방향
            dashSpeed: 0, dashDirX: 0, dashDirY: 0, dashTimer: 0, // 돌진(Charge) 등 이동기 상태
            targetX: 0, targetY: 0, // 이동기 목표 좌표
            activeSkillType: null, // 현재 발동 중인 스킬 종류
            aimingSkill: null, // 마우스 우클릭으로 조준 중인 스킬
            currentQuickSlotIdx: 0, // 8칸 퀵슬롯 중 현재 활성화된 인덱스
            lockedTarget: null // 좌클릭으로 고정(락온)한 적 객체
        };

        // [MOD-010-3: 시스템, 퀘스트, 이펙트 등 전역 관리 변수]
        let quest = { active: false, target: 10, current: 0 }; // 퀘스트 진행 상태
        let floatingTexts = []; // 데미지, 타겟팅 텍스트 등 공중에 뜨는 글자 관리
        let visualEffects = []; // 스킬 타격 이펙트 (원형 파티클 등) 관리
        let inventory = []; // 플레이어 가방 (추후 그리드 시스템 연동)
        let equipment = []; // 장착 중인 장비
        let personalStorage = []; // 창고 보관 아이템
        
        let totalFreePoints = 30; // 캐릭터 생성 시 주어지는 잔여 스탯 포인트
        let tempSelectedJobs = []; // 캐릭터 생성 시 임시로 선택한 직업 목록

        let mouseX = 0, mouseY = 0; // 월드 좌표계 기준 마우스 위치
        let attackTimer = 0; // 기본 공격 쿨타임 및 무기 스윙 애니메이션 프레임 제어
        let keys = {}; // 키보드 입력 상태 저장 객체
        const statKeys = ["hp", "str", "dex", "mana", "stamina", "charm"];
        // [MOD-010-END]
        
        // [MOD-011: 직업 및 스킬 정보 반환 (외부 js 연동 영역)]
        // 외부 파일(jobs.js)에서 데이터를 불러올 공간입니다.
        // [MOD-011-END]

        // [MOD-012: NPC 상호작용 및 맵 이동 이벤트 처리]
        // [MOD-012-1: NPC 메뉴 열기 및 닫기]
        // 길드 내 오브젝트(접수원, 포탈) 클릭 시 팝업을 띄우는 로직입니다.
        function openNPCMenu(type) {
            gameState = "npcMenu";
            const ui = document.getElementById("npcMenuUI");
            const title = document.getElementById("npcMenuTitle");
            const content = document.getElementById("npcMenuContent");
            ui.style.display = "flex";

            if (type === 'receptionist') {
                title.innerText = "접수원";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="talkReceptionist()">대화하기</button>
                    <button class="btn" style="padding: 15px; background: darkred;" onclick="attackReceptionist()">공격하기</button>
                `;
            } else if (type === 'receptionist_talk') {
                title.innerText = "접수원: 무엇을 도와드릴까요?";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="openCharCreation()">길드 가입 작성</button>
                    <button class="btn" style="padding: 15px;" onclick="takeQuest()">퀘스트 받기</button>
                `;
            } else if (type === 'portal') {
                title.innerText = "포탈";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px; background: purple;" onclick="enterDungeon()">발러 던전 입장</button>
                `;
            }
        }

        function closeNPCMenu() {
            gameState = "playing"; // 메뉴를 닫고 조작 권한 반환
            document.getElementById("npcMenuUI").style.display = "none";
        }

        // [MOD-012-2: 대화, 공격, 퀘스트 수락 및 부활 액션]
        function talkReceptionist() { openNPCMenu('receptionist_talk'); }

        // 접수원을 공격하면 즉사 후 뒤로 밀려나는 연출(knockback)을 발생시킵니다.
        function attackReceptionist() {
            closeNPCMenu();
            addFloatingText(player.x, player.y, "9999", "red");
            player.currentHp = 0;
            player.knockbackDirX = player.x < MAP_DATA.guild.receptionist.x ? -1 : 1;
            player.knockbackDirY = -0.5; 
            gameState = "knockback";
        }

        // 데스 스크린에서 '길드에서 부활하기' 버튼 클릭 시 스탯을 모두 회복시키고 길드 중앙으로 좌표를 옮깁니다.
        function respawn() {
            player.currentHp = player.maxHp;
            player.currentStamina = player.maxStamina;
            player.currentMana = player.maxMana;
            player.x = 500; player.y = 500;
            currentMap = "guild";
            // 던전에 있던 몬스터(고블린)의 상태를 비활성화(어그로 해제) 시킵니다.
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon) {
                MAP_DATA.dungeon.goblin.active = false;
            }
            player.aimingSkill = null;
            player.dashTimer = 0;
            gameState = "playing";
            document.getElementById("deathUI").style.display = "none";
        }

        function takeQuest() {
            quest.active = true;
            quest.current = 0;
            alert("퀘스트 수락: 고블린 10마리 잡기");
            closeNPCMenu();
        }

        // 포탈을 타고 던전으로 진입할 때 몬스터를 활성화시키고 좌표를 재설정합니다.
        function enterDungeon() {
            currentMap = "dungeon";
            player.x = 1500; player.y = 1500; 
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon) {
                MAP_DATA.dungeon.goblin.hp = MAP_DATA.dungeon.goblin.maxHp; 
                MAP_DATA.dungeon.goblin.x = 1500; MAP_DATA.dungeon.goblin.y = 1200;
                MAP_DATA.dungeon.goblin.active = true;
            }
            player.aimingSkill = null;
            player.dashTimer = 0;
            closeNPCMenu();
        }
        // [MOD-012-END]

        // [MOD-013: 개인 창고 보관/꺼내기 로직]
        // [MOD-013-1: 텍스트 기반 창고 UI 렌더링 (그리드화 전단계)]
        function openStorage() {
            gameState = "storage";
            document.getElementById("storageUI").style.display = "flex";
            renderStorageUI();
        }

        // 인벤토리 배열과 창고 배열 사이의 데이터를 클릭 시 스왑(Push & Splice)하여 이동시킵니다.
        function renderStorageUI() {
            const invDiv = document.getElementById("storageInvList");
            const boxDiv = document.getElementById("storageBoxList");
            invDiv.innerHTML = ""; boxDiv.innerHTML = "";

            inventory.forEach((item, index) => {
                let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                div.innerHTML = `[${item.type}] ${item.name}`;
                div.onclick = () => { personalStorage.push(item); inventory.splice(index, 1); renderStorageUI(); };
                invDiv.appendChild(div);
            });

            personalStorage.forEach((item, index) => {
                let div = document.createElement("div"); div.className = "item"; div.style.borderLeft = `5px solid ${item.color}`;
                div.innerHTML = `[${item.type}] ${item.name}`;
                div.onclick = () => { inventory.push(item); personalStorage.splice(index, 1); renderStorageUI(); };
                boxDiv.appendChild(div);
            });
        }
        // [MOD-013-END]

        // [MOD-014: 캐릭터 생성(스탯 분배 및 직업 선택) 로직]
        // [MOD-014-1: 육각형 레이더 차트 렌더링]
        function openCharCreation() {
            closeNPCMenu();
            gameState = "charCreation";
            document.getElementById("charCreationUI").style.display = "flex";
            tempSelectedJobs = [...player.acquiredJobs]; // 기존 직업 백업
            updateCharCreationUI();
        }

        // 캔버스 Context를 이용해 플레이어 스탯(6가지)을 오각형/육각형 그래프 척도로 시각화합니다.
        function drawRadarChart(canvasId) {
            const rc = document.getElementById(canvasId);
            if (!rc) return;
            const rctx = rc.getContext("2d");
            const w = rc.width, h = rc.height, cx = w / 2, cy = h / 2;
            const maxR = cx - 75; // 반지름 최대치 지정 (여백 확보)
            const maxStat = 25; // 차트 끝부분에 도달하는 최대 스탯 상한
            rctx.clearRect(0, 0, w, h);
            const labels = ["체력", "힘", "민첩", "마나", "스테미나", "매력"];

            // 1. 거미줄 바탕선 그리기
            rctx.strokeStyle = "#555"; rctx.lineWidth = 1;
            for(let step = 1; step <= 4; step++) {
                let r = maxR * (step / 4);
                rctx.beginPath();
                for(let i=0; i<6; i++) {
                    let angle = (Math.PI / 3) * i - (Math.PI / 2);
                    let x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
                    if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
                }
                rctx.closePath(); rctx.stroke();
            }

            // 2. 방사형 축선 및 라벨 텍스트 그리기
            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                rctx.beginPath();
                rctx.moveTo(cx, cy);
                rctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
                rctx.stroke();

                rctx.fillStyle = "white"; rctx.font = "12px sans-serif";
                rctx.textAlign = "center"; rctx.textBaseline = "middle";
                let lx = cx + Math.cos(angle) * (maxR + 35);
                let ly = cy + Math.sin(angle) * (maxR + 35);
                rctx.fillText(`${labels[i]}: ${player.stats[statKeys[i]]}`, lx, ly);
            }

            // 3. 현재 스탯을 나타내는 다각형 영역 색칠하기
            rctx.fillStyle = "rgba(255, 215, 0, 0.5)"; 
            rctx.strokeStyle = "gold"; rctx.lineWidth = 2;
            rctx.beginPath();
            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                let val = Math.min(player.stats[statKeys[i]], maxStat); 
                let r = maxR * (val / maxStat);
                let x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
                if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
            }
            rctx.closePath(); rctx.fill(); rctx.stroke();
        }

        // [MOD-014-2: 스탯 증감 및 UI 업데이트]
        // 포인트 잔여량과 최소 한계치(3)를 검사하여 스탯을 더하거나 뺍니다.
        function adjustStat(stat, amount) {
            if (amount > 0 && totalFreePoints > 0) {
                player.stats[stat]++;
                totalFreePoints--;
            } else if (amount < 0 && player.stats[stat] > 3) {
                player.stats[stat]--;
                totalFreePoints++;
            }
            updateCharCreationUI();
        }

        function updateCharCreationUI() {
            document.getElementById("ccFreePoints").innerText = totalFreePoints;
            statKeys.forEach(k => {
                const el = document.getElementById(`st_${k}`);
                if(el) el.innerText = player.stats[k];
            });
            renderClassList();
            drawRadarChart("ccRadarCanvas");
            checkStartBtn();
        }

        // [MOD-014-3: 직업 요구사항 확인 및 토글]
        // 클릭한 직업의 스탯 요구치(req)를 확인하고 만족하면 배열에 추가/제거합니다.
        function toggleJob(job) {
            let targetVal = job.reqVal || 6;
            let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);

            if (!meetsReq && job.req.length > 0) {
                alert(`스탯 조건을 먼저 만족해야 합니다! (${job.desc})`);
                return;
            }

            let idx = tempSelectedJobs.indexOf(job.name);
            if (idx > -1) {
                if (tempSelectedJobs.length <= 1) {
                    alert("최소 1개의 직업은 선택되어 있어야 합니다!");
                    return;
                }
                tempSelectedJobs.splice(idx, 1);
            } else {
                // 상위 직업(기사)과 하위 직업(견습 기사)의 상호 배제 처리
                if (job.name === "기사") {
                    let kIdx = tempSelectedJobs.indexOf("견습 기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                } else if (job.name === "견습 기사") {
                    let kIdx = tempSelectedJobs.indexOf("기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                }
                tempSelectedJobs.push(job.name);
            }
            updateCharCreationUI();
        }

        // 직업이 최소 1개 선택되었을 때만 '가입 완료' 버튼을 활성화합니다.
        function checkStartBtn() {
            const btn = document.getElementById("ccStartBtn");
            if (tempSelectedJobs.length > 0) {
                btn.disabled = false;
                btn.style.background = "limegreen";
            } else {
                btn.disabled = true;
                btn.style.background = "gray";
            }
        }

        // JOB_DATA를 순회하며 충족 여부에 따라 CSS 클래스(locked, selected 등)를 입혀 리스트 렌더링
        function renderClassList() {
            const listDiv = document.getElementById("ccClassList");
            listDiv.innerHTML = "";
            
            if (typeof JOB_DATA !== "undefined") {
                JOB_DATA.forEach(job => {
                    let targetVal = job.reqVal || 6;
                    let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);
                    let isSelected = tempSelectedJobs.includes(job.name);

                    let div = document.createElement("div");
                    div.className = "class-item";
                    
                    if (isSelected) {
                        div.classList.add("selected");
                        div.innerHTML = `<span style='color:gold;'>[보유 중]</span> ${job.name} <br><small style="color:white;">R스킬: ${job.skill.name}</small>`;
                    } else if (!meetsReq && job.req.length > 0) {
                        div.classList.add("locked");
                        div.innerHTML = `<span style="color:gray;">[조건 미달]</span> ${job.name} <br><small>${job.desc}</small>`;
                    } else {
                        div.innerHTML = `<span style='color:cyan;'>[습득 가능]</span> ${job.name} <br><small style="color:lightgray;">${job.desc}</small>`;
                    }
                    
                    div.onclick = () => toggleJob(job);
                    listDiv.appendChild(div);
                });
            }
        }

        // [MOD-014-4: 스탯 최종 반영]
        // 가입 완료 버튼을 누르면 스탯을 기반으로 최대 HP/MP/ST를 계산하여 세팅합니다.
        function finishGuildJoin() {
            const nameInput = document.getElementById("ccPlayerName").value.trim();
            if (!nameInput) { alert("캐릭터 이름을 입력해주세요!"); return; }
            if (tempSelectedJobs.length === 0) return;

            player.name = nameInput;
            player.acquiredJobs = [...tempSelectedJobs];
            player.job = player.acquiredJobs.join(" + ");
            player.currentSkillIdx = 0;
            player.aimingSkill = null;

            player.maxHp = player.stats.hp * 3;
            player.currentHp = player.maxHp;
            player.maxStamina = player.stats.stamina * 3;
            player.currentStamina = player.maxStamina;
            player.maxMana = player.stats.mana * 3;
            player.currentMana = player.maxMana;

            gameState = "playing"; // 게임 상태 복귀
            document.getElementById("charCreationUI").style.display = "none";
        }
        // [MOD-014-END]

        // [MOD-015: 스킬 시스템 및 전투 연산 로직]
        // [MOD-015-1: 스킬 데이터 모형 및 퀵슬롯 초기화]
        // (추후 에디터에서 JSON 형태로 분리될 데이터 구조입니다.)
        const MOCK_SKILLS = {
            leap: { id: "leap", name: "도약", type: "leap_only", cooldown: 2, bonusDmg: 0 },
            charge: { id: "charge", name: "돌진", type: "charge", cooldown: 3, bonusDmg: 10 },
            slam: { id: "slam", name: "강타", type: "jump_slam", cooldown: 5, bonusDmg: 20 },
            slash: { id: "slash", name: "베기", type: "slash", cooldown: 1, bonusDmg: 5 },
            heal: { id: "heal", name: "치료", type: "heal", cooldown: 10, bonusDmg: 0 },
            fire: { id: "fire", name: "화염", type: "fire", cooldown: 4, bonusDmg: 15 },
            ice: { id: "ice", name: "얼음", type: "ice", cooldown: 4, bonusDmg: 12 },
            wind: { id: "wind", name: "바람", type: "wind", cooldown: 3, bonusDmg: 8 }
        };
        
        // 8칸 퀵슬롯이 비어있다면 테스트용 스킬로 가득 채워 초기화합니다.
        if (!player.quickSlots) {
            player.quickSlots = [ MOCK_SKILLS.leap, MOCK_SKILLS.charge, MOCK_SKILLS.slam, MOCK_SKILLS.slash, MOCK_SKILLS.heal, MOCK_SKILLS.fire, MOCK_SKILLS.ice, MOCK_SKILLS.wind ];
            player.currentQuickSlotIdx = 0;
            player.rotationCount = 0; 
            player.lockedTarget = null;
        }

        // 리워크된 캐릭터 동그라미 크기에 맞춰 충돌 판정용 width/height 44px로 덮어쓰기
        player.width = 44;
        player.height = 44;

        function getActiveQuickSlotSkill() {
            return player.quickSlots[player.currentQuickSlotIdx];
        }

        // [MOD-015-2: 리볼버 UI 회전 로직]
        // R키를 누를 때마다 누적 카운트를 올려 바퀴를 무한 회전시킵니다. (CSS transform 대응)
        function handleRKey() {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            
            player.rotationCount++; // 회전수 누적
            player.currentQuickSlotIdx = ((player.rotationCount % 8) + 8) % 8; // 음수 방어 및 8칸 인덱스 보정
            player.aimingSkill = null; // 무기(스킬)가 변경되면 조준 상태 해제
            updateQuickSlotUI(); // DOM 요소 업데이트
        }

        function updateQuickSlotUI() {
            const wheel = document.getElementById("quick-slot-wheel");
            if (wheel) {
                let rotation = -(player.rotationCount * 45); // 1회전당 반시계로 45도 회전
                wheel.style.transform = `rotate(${rotation}deg)`;
            }

            for(let i=0; i<8; i++) {
                let slot = document.getElementById("q-slot-" + (i+1));
                let inner = slot ? slot.querySelector('.q-slot-inner') : null;
                if (!slot || !inner) continue;
                
                let skill = player.quickSlots[i];
                inner.innerHTML = skill ? `<span style="color:white; font-size:11px; font-weight:bold;">${skill.name}</span>` : "";

                // 바퀴가 돌아도 텍스트 글씨는 항상 똑바로 서있도록 역방향(Counter-Rotation) 회전 적용
                let counterRotation = -(i * 45) + (player.rotationCount * 45);
                inner.style.transform = `rotate(${counterRotation}deg)`;

                // 현재 선택된 슬롯(12시 바늘 위치)은 빨간 테두리로 강조
                if (i === player.currentQuickSlotIdx) {
                    slot.style.border = "3px solid #ff3333";
                    slot.style.background = "rgba(255, 50, 50, 0.6)";
                } else {
                    slot.style.border = "2px solid rgba(255, 255, 255, 0.8)";
                    slot.style.background = "rgba(0, 0, 0, 0.4)";
                }
            }
        }

        // [MOD-015-3: 스킬 조준 및 발동 로직]
        // 마우스 우클릭 시 현재 선택된 슬롯의 스킬 쿨타임을 점검하고 조준(aiming) 상태로 전환합니다.
        function aimCurrentQuickSlot() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) { addFloatingText(player.x, player.y - 10, "빈 슬롯입니다.", "gray"); return; }
            let cd = player.skillCooldowns[activeSkill.id] || 0;
            if (cd > 0) { addFloatingText(player.x, player.y - 10, `${activeSkill.name} 쿨타임!`, "yellow"); return; }
            player.aimingSkill = activeSkill.type;
            addFloatingText(player.x, player.y - 30, `[${activeSkill.name}] 조준 중...`, "cyan");
        }

        function startSkillCooldown(skillId, cooldownSec) {
            player.skillCooldowns[skillId] = cooldownSec * 60; // 60프레임 = 1초
        }

        // 마우스 좌클릭 시 조준 중이던 스킬을 마우스 커서 위치(월드 좌표)로 발사/이동시킵니다.
        function executeAimingSkill() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) return false;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x;
            const pCenterY = player.y;
            const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);
            const playerRadius = player.width / 2;

            // 이동계 스킬 1: 도약 (마우스 방향으로 짧고 빠르게 전진)
            if (player.aimingSkill === "leap_only") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                player.dashSpeed = 15;
                player.dashDirX = Math.cos(aimAngle);
                player.dashDirY = Math.sin(aimAngle);
                player.dashTimer = 6;
                player.activeSkillType = "leap_only";
                addVisualEffect(pCenterX, pCenterY, 30, "cyan");
                player.aimingSkill = null;
                return true;
            }
            // 이동+공격계 스킬: 강타 (마우스 커서 지점으로 텔레포트하듯 점프 후 착지 딜레이/데미지)
            else if (player.aimingSkill === "jump_slam") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                let targetX = Math.max(playerRadius, Math.min(WORLD_WIDTH - playerRadius, wMouseX));
                let targetY = Math.max(playerRadius, Math.min(WORLD_HEIGHT - playerRadius, wMouseY));
                
                // 장애물이 없다면 즉시 좌표 이동
                if (!checkObstacleCollision(targetX - playerRadius, targetY - playerRadius)) {
                    player.x = targetX;
                    player.y = targetY;
                }
                const slamX = player.x;
                const slamY = player.y;
                addVisualEffect(slamX, slamY, 80, "red"); // 붉은 파장 생성

                const totalDmg = (player.stats.str * 3) + activeSkill.bonusDmg;
                // 고블린이 범위 내에 있다면 광역 데미지
                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    if (Math.hypot(MAP_DATA.dungeon.goblin.x - slamX, MAP_DATA.dungeon.goblin.y - slamY) < 80 + MAP_DATA.dungeon.goblin.size / 2) {
                        applyDamageToGoblin(totalDmg);
                    }
                }
                player.aimingSkill = null;
                return true;
            } 
            // 이동+공격계 스킬: 돌진 (마우스 커서 방향으로 긴 거리를 쭉 밀고 나감)
            else if (player.aimingSkill === "charge") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                const dx = wMouseX - pCenterX;
                const dy = wMouseY - pCenterY;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const speed = 22; 
                    player.dashSpeed = speed;
                    player.dashDirX = dx / dist;
                    player.dashDirY = dy / dist;
                    player.dashTimer = Math.min(40, Math.ceil(dist / speed));
                    player.targetX = wMouseX;
                    player.targetY = wMouseY;
                    player.activeSkillType = "charge";
                    addVisualEffect(pCenterX, pCenterY, 40, "yellow");
                }
                player.aimingSkill = null;
                return true;
            }
            return false;
        }

        // [MOD-015-4: 타격 및 경험치/레벨업 로직]
        function applyDamageToGoblin(dmg) {
            let gob = MAP_DATA.dungeon.goblin;
            gob.hp -= dmg;
            addFloatingText(gob.x, gob.y - gob.size, dmg, "orange"); // 딜 캐치 텍스트
            
            // 고블린 체력 소진 시 맵 랜덤 위치에 즉시 리스폰 및 경험치 처리
            if (gob.hp <= 0) {
                gob.hp = gob.maxHp;
                gob.x = Math.random() * (WORLD_WIDTH - 200) + 100;
                gob.y = Math.random() * (WORLD_HEIGHT - 200) + 100;
                
                player.lockedTarget = null; // 죽었으므로 락온 해제

                player.exp += gob.expReward;
                // 경험치 임계치 도달 시 레벨업 및 상태 풀 회복
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp = Math.floor(player.maxExp * 1.5); // 다음 요구 경험치 1.5배 증가
                    player.currentHp = player.maxHp;
                    player.currentStamina = player.maxStamina;
                    player.currentMana = player.maxMana;
                    addFloatingText(player.x, player.y - 30, "LEVEL UP!", "gold");
                }
            }
        }

        // 지정된 좌표에 15프레임간 지속되며 크기가 줄어드는 이펙트 추가
        function addVisualEffect(x, y, radius, color) {
            visualEffects.push({ x: x, y: y, radius: radius, color: color, alpha: 0.6, timer: 15 });
        }
        
        setTimeout(updateQuickSlotUI, 100); // 로드 시 UI 강제 갱신
        // [MOD-015-END]
        
        // [MOD-016: 입력 이벤트 리스너]
        // [MOD-016-1: 키보드 단축키 (숫자 슬롯 지정 및 인벤토리/R키)]
        function selectQuickSlot(index) {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            
            let currentIdx = ((player.rotationCount % 8) + 8) % 8;
            let diff = index - currentIdx;
            if (diff < -4) diff += 8;
            if (diff > 4) diff -= 8;
            
            player.rotationCount += diff;
            player.currentQuickSlotIdx = index;
            player.aimingSkill = null; 
            if (typeof updateQuickSlotUI === "function") updateQuickSlotUI();
        }

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (e.key.length === 1) keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'r') handleRKey();
            if (e.key.toLowerCase() === 'e' && gameState !== "charCreation" && gameState !== "dead" && gameState !== "knockback") {
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    // [추가] 인벤토리를 열 때 화면의 퀵슬롯과 버튼 컨테이너를 통째로 숨깁니다.
                    document.getElementById("vpad-container").style.display = "none";
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            }
            
            if (gameState === "playing") {
                if (e.key >= '1' && e.key <= '8') { selectQuickSlot(parseInt(e.key) - 1); }
            }
        });

        window.addEventListener("keyup", (e) => { 
            keys[e.key] = false; 
            if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener("contextmenu", (e) => { e.preventDefault(); });

        for (let i = 1; i <= 8; i++) {
            let el = document.getElementById("q-slot-" + i);
            if (el) {
                el.addEventListener("touchstart", (e) => { e.preventDefault(); selectQuickSlot(i - 1); });
                el.addEventListener("mousedown", (e) => { e.preventDefault(); selectQuickSlot(i - 1); });
            }
        }
        // [MOD-016-1-END]

        // [MOD-016-2: 마우스 이동 및 클릭 처리]
        // 캔버스 크기 비율에 맞춰 실제 픽셀 좌표값을 추출합니다.
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        // 텍스트를 약간 랜덤한 좌표(흔들림)에 띄우기 위함
        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x: x + (Math.random() * 20 - 10), y: y - 10, text: text, color: color, alpha: 1.0, timer: 30 });
        }

        canvas.addEventListener("mousedown", (e) => {
            if (gameState !== "playing") return;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x + player.width / 2;
            const pCenterY = player.y + player.height / 2;

            if (e.button === 2) { aimCurrentQuickSlot(); return; } // 우클릭(2) : 조준

            if (e.button === 0) { // 좌클릭(0) : 발사 및 락온
                if (player.aimingSkill) { executeAimingSkill(); return; } // 조준 중이면 스킬 발사

                // 길드 로비 NPC(접수원/포탈) 클릭 상호작용
                if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                    const rec = MAP_DATA.guild.receptionist;
                    const por = MAP_DATA.guild.portal;
                    if (wMouseX >= rec.x && wMouseX <= rec.x + rec.size && wMouseY >= rec.y && wMouseY <= rec.y + rec.size) {
                        if (Math.hypot((rec.x+15) - pCenterX, (rec.y+15) - pCenterY) < 100) { openNPCMenu('receptionist'); return; }
                    }
                    if (wMouseX >= por.x && wMouseX <= por.x + por.w && wMouseY >= por.y && wMouseY <= por.y + por.h) {
                        if (Math.hypot((por.x+20) - pCenterX, (por.y+100) - pCenterY) < 100) { openNPCMenu('portal'); return; }
                    }
                }

                // 던전 내 고블린 수동 락온 시스템 (우선 타겟팅)
                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    const gob = MAP_DATA.dungeon.goblin;
                    if (Math.hypot(wMouseX - gob.x, wMouseY - gob.y) < gob.size) {
                        player.lockedTarget = gob;
                        addFloatingText(gob.x, gob.y - 30, "타겟 고정!", "red");
                    } else {
                        player.lockedTarget = null; // 허공 클릭 시 락온 해제
                    }
                }
            }
        });

        // [MOD-016-3: 모바일 터치 패드 초기화 및 이벤트 연결]
        (function initVirtualPad() {
            const stickBase = document.getElementById("vpad-stick-base");
            const stickKnob = document.getElementById("vpad-stick-knob");
            const btnAtk = document.getElementById("vpad-atk");
            const btnSkill = document.getElementById("vpad-skill");
            const btnR = document.getElementById("vpad-r");
            const btnE = document.getElementById("vpad-e");

            let touchId = null;
            let startX = 0, startY = 0;

            window.addEventListener("touchstart", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.clientX < window.innerWidth / 2 && touchId === null) {
                        touchId = t.identifier;
                        startX = t.clientX;
                        startY = t.clientY;
                        if(stickBase) {
                            stickBase.style.left = (startX - (window.innerWidth * 0.08)) + "px";
                            stickBase.style.top = (startY - (window.innerHeight * 0.08)) + "px";
                            stickBase.style.bottom = "auto";
                            stickBase.style.display = "block";
                            if(stickKnob) stickKnob.style.transform = `translate(0px, 0px)`;
                        }
                    }
                }
            }, { passive: false });

            window.addEventListener("touchmove", (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.identifier === touchId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxR = 45; 
                        if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
                        if(stickKnob) stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

                        keys["w"] = dy < -12; keys["s"] = dy > 12;
                        keys["a"] = dx < -12; keys["d"] = dx > 12;

                        if (dist > 5) {
                            let moveAngle = Math.atan2(dy, dx);
                            let screenPx = player.x + player.width/2 - camera.x;
                            let screenPy = player.y + player.height/2 - camera.y;
                            
                            mouseX = screenPx + Math.cos(moveAngle) * 120;
                            mouseY = screenPy + Math.sin(moveAngle) * 120;
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        if(stickBase) stickBase.style.display = "none";
                        keys["w"] = false; keys["s"] = false; keys["a"] = false; keys["d"] = false;
                    }
                }
            };
            window.addEventListener("touchend", endTouch);
            window.addEventListener("touchcancel", endTouch);

            if(btnAtk) btnAtk.addEventListener("touchstart", (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 0 })); });
            if(btnSkill) btnSkill.addEventListener("touchstart", (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 2 })); });
            if(btnR) btnR.addEventListener("touchstart", (e) => { e.preventDefault(); handleRKey(); });
            
            // 가방 버튼(E) 터치 시 그리드 인벤토리 호출 및 HUD 숨김 처리
            if(btnE) btnE.addEventListener("touchstart", (e) => {
                e.preventDefault();
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    document.getElementById("vpad-container").style.display = "none"; // HUD 숨김
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            });
        })();
        // [MOD-016-3-END]

        // [MOD-017: UI 제어 및 충돌(Collision) 유틸리티]
       // [MOD-017-1: 인벤토리 및 스탯창 탭 스위치 / UI 닫기]
        function switchTab(tabId) {
            if(tabId === 'inv') {
                document.getElementById("viewInv").style.display = "flex";
                document.getElementById("viewStats").style.display = "none";
                document.getElementById("tabInv").classList.add("active");
                document.getElementById("tabStats").classList.remove("active");
                
                // [수정됨] 탭을 열 때 기존의 텍스트 리스트 대신 그리드 인벤토리 렌더링 함수를 호출합니다!
                if(typeof renderGridInventory === "function") renderGridInventory();
                
            } else {
                document.getElementById("viewInv").style.display = "none";
                document.getElementById("viewStats").style.display = "flex";
                document.getElementById("tabInv").classList.remove("active");
                document.getElementById("tabStats").classList.add("active");
                document.getElementById("infoNameLevel").innerText = `${player.name} [Lv.${player.level}]`;
                document.getElementById("infoClass").innerText = `장비 기반 스킬 운용 중`;
                
                const skillListDiv = document.getElementById("skillList");
                skillListDiv.innerHTML = "<span style='color:gray;'>퀵슬롯 스킬 내역이 여기에 표시될 예정입니다.</span>";

                drawRadarChart("infoRadarCanvas");
            }
        }

        function closeUI() {
            gameState = "playing";
            document.getElementById("inventoryUI").style.display = "none";
            document.getElementById("storageUI").style.display = "none";
            
            // [추가됨] UI 창을 닫고 게임으로 돌아오면 숨겨뒀던 HUD(퀵슬롯, 버튼 등)를 다시 켜줍니다.
            const vpad = document.getElementById("vpad-container");
            if(vpad) vpad.style.display = "block"; 
        }
        // [MOD-017-1-END]
        // [MOD-017-2: AABB 2D 사각형 충돌 계산 유틸리티]
        function checkRectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        // 플레이어의 다음 이동 좌표(x, y)에 지형지물(접수원, 포탈, 상자)이 있는지 미리 검사합니다.
        function checkObstacleCollision(x, y) {
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const rec = MAP_DATA.guild.receptionist;
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;
                if (checkRectCollision(x, y, player.width, player.height, rec.x, rec.y, rec.size, rec.size)) return true;
                if (checkRectCollision(x, y, player.width, player.height, por.x, por.y, por.w, por.h)) return true;
                if (checkRectCollision(x, y, player.width, player.height, chs.x, chs.y, chs.w, chs.h)) return true;
            }
            return false;
        }
        // [MOD-017-END]

        // [MOD-018: 메인 게임 루프 (60프레임 반복 렌더링)]
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 프레임 지우기

            // UI 조작 중에는 배경 업데이트 및 연산을 멈춥니다.
            if (gameState === "charCreation" || gameState === "npcMenu") { 
                requestAnimationFrame(gameLoop); return; 
            }

            const pCenterX = player.x;
            const pCenterY = player.y;
            const playerRadius = player.width / 2; // 중심 기준 22px
            
            const activeSkill = typeof getActiveQuickSlotSkill === "function" ? getActiveQuickSlotSkill() : null;

            // 스킬 쿨타임 감소 타이머 (-1 프레임씩)
            for (let sId in player.skillCooldowns) {
                if (player.skillCooldowns[sId] > 0) player.skillCooldowns[sId]--;
            }

            // === [업데이트 영역] ===
            if (gameState === "playing") {
                let nextX = player.x;
                let nextY = player.y;

                // [MOD-018-1: 대시(Charge/Leap) 강제 이동 로직]
                if (player.dashTimer > 0) {
                    player.dashTimer--;
                    nextX += player.dashDirX * player.dashSpeed;
                    nextY += player.dashDirY * player.dashSpeed;

                    // 차지 중 타겟 좌표에 도달하면 즉시 멈춤
                    if (player.activeSkillType === "charge") {
                        const distToTarget = Math.hypot((player.targetX) - nextX, (player.targetY) - nextY);
                        if (distToTarget <= player.dashSpeed) {
                            nextX = player.targetX;
                            nextY = player.targetY;
                            player.dashTimer = 0;
                        }
                    }

                    // 벽에 박으면 멈춤 (원형 충돌 경계 계산)
                    if (nextX - playerRadius <= 0 || nextX + playerRadius >= WORLD_WIDTH || nextY - playerRadius <= 0 || nextY + playerRadius >= WORLD_HEIGHT || checkObstacleCollision(nextX - playerRadius, nextY - playerRadius)) {
                        player.dashTimer = 0;
                        nextX = player.x; 
                        nextY = player.y; 
                    }

                    // 대시 중 몬스터(고블린)를 스치면 충돌 데미지 입힘
                    if ((player.activeSkillType === "charge" || player.activeSkillType === "leap_attack") && currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                        let gob = MAP_DATA.dungeon.goblin;
                        if (Math.hypot(nextX - gob.x, nextY - gob.y) < playerRadius + gob.size/2) {
                            const dmg = (player.stats.str * 3) + (activeSkill ? activeSkill.bonusDmg : 0);
                            applyDamageToGoblin(dmg);
                        }
                    }
                } 
                // [MOD-018-2: 키보드 이동 및 Shift 달리기 스태미나 소모]
                else {
                    let isMoving = keys["ArrowUp"] || keys["w"] || keys["s"] || keys["ArrowDown"] || keys["a"] || keys["ArrowLeft"] || keys["d"] || keys["ArrowRight"];
                    let currentSpeed = player.speed;
                    let isSprinting = false;

                    // 스태미나가 1 이상이고, 이동 중이며, Shift를 눌렀을 때만 발동
                    if (keys["Shift"] && isMoving && player.currentStamina >= 1) {
                        isSprinting = true;
                        currentSpeed = player.speed * 1.6; // 질주 속도 배율
                        
                        player.sprintTimer = (player.sprintTimer || 0) + 1;
                        if (player.sprintTimer >= 60) { // 약 1초당 1 스태미나 소모
                            player.currentStamina -= 1;
                            player.sprintTimer = 0;
                        }
                    } else {
                        player.sprintTimer = 0; // 달리기를 멈추면 소모 타이머 초기화
                    }

                    // 상하좌우 조작에 따른 next 좌표 적용
                    if (keys["ArrowUp"] || keys["w"]) nextY -= currentSpeed;
                    if (keys["ArrowDown"] || keys["s"]) nextY += currentSpeed;
                    if (keys["ArrowLeft"] || keys["a"]) nextX -= currentSpeed;
                    if (keys["ArrowRight"] || keys["d"]) nextX += currentSpeed;

                    // 맵 경계선 (월드 밖) 이탈 방지
                    nextX = Math.max(playerRadius, Math.min(nextX, WORLD_WIDTH - playerRadius));
                    nextY = Math.max(playerRadius, Math.min(nextY, WORLD_HEIGHT - playerRadius));

                    // 지형 장애물 충돌 검사
                    if (checkObstacleCollision(nextX - playerRadius, nextY - playerRadius)) {
                        nextX = player.x; nextY = player.y; // 벽에 막히면 이전 좌표로 롤백
                    }

                    // 걷는 중이거나 멈춰있을 때 스태미나 자연 회복 (약 1초당 1 회복)
                    if (!isSprinting && player.currentStamina < player.maxStamina) {
                        player.staminaRegenTimer++;
                        if (player.staminaRegenTimer >= 60) {
                            player.currentStamina = Math.min(player.maxStamina, player.currentStamina + 1);
                            player.staminaRegenTimer = 0;
                        }
                    } else {
                        player.staminaRegenTimer = 0;
                    }
                }

                // 이동 연산이 끝난 최종 좌표를 플레이어에 반영
                player.x = nextX;
                player.y = nextY;

                // [MOD-018-3: 사거리 내 몬스터 자동 감지 및 공격(오토 어택)]
                if (attackTimer > 0) attackTimer--;

                // 공격 대기시간이 끝났을 때만 검사
                if (attackTimer <= 0) { 
                    const baseRange = 85; // 무기 스윙 반경(도달거리)
                    const totalDmg = (player.stats.str * 3) + 5; 

                    if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                        const gob = MAP_DATA.dungeon.goblin;
                        let targetToAttack = null;

                        // 1순위: 좌클릭으로 고정(락온)해 둔 몬스터가 사거리 내에 있을 때
                        if (player.lockedTarget && Math.hypot(player.lockedTarget.x - pCenterX, player.lockedTarget.y - pCenterY) <= baseRange + player.lockedTarget.size / 2) {
                            targetToAttack = player.lockedTarget;
                        } 
                        // 2순위: 락온이 없거나 락온된 적이 멀어진 경우, 사거리 안의 고블린 찾기
                        else if (Math.hypot(gob.x - pCenterX, gob.y - pCenterY) <= baseRange + gob.size / 2) {
                            targetToAttack = gob;
                        }

                        // 타겟이 범위 내에 존재하면 스태미나 소모 없이 즉시 무기를 스윙하여 데미지 입힘
                        if (targetToAttack) {
                            attackTimer = 30; // 30프레임 (약 0.5초) 간격으로 타격 및 애니메이션 재생
                            player.lastAttackAngle = Math.atan2(targetToAttack.y - pCenterY, targetToAttack.x - pCenterX);
                            applyDamageToGoblin(totalDmg);
                        }
                    }
                }

            } 
            // 피격 시 잠시 조작을 잃고 밀려나는 넉백 상태
            else if (gameState === "knockback") {
                player.x += player.knockbackDirX * 25;
                player.y += player.knockbackDirY * 5;
                
                if (player.x <= playerRadius || player.x >= WORLD_WIDTH - playerRadius || player.y <= playerRadius) {
                    player.x = Math.max(playerRadius, Math.min(player.x, WORLD_WIDTH - playerRadius));
                    gameState = "dead";
                    document.getElementById("deathUI").style.display = "flex";
                }
            }

            // [MOD-018-4: 카메라 트래킹 및 월드 배경 렌더링]
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            // 카메라가 맵 경계선 밖으로 나가지 않도록 Clamp(제한)
            camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - canvas.width));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - canvas.height));

            // === [월드 렌더링 시작] ===
            ctx.save();
            ctx.translate(-camera.x, -camera.y); // 카메라 좌표만큼 전체 캔버스를 오프셋 이동

            // 100px 간격의 타일 격자(그리드) 라인 그리기
            ctx.strokeStyle = "#3a3a3a";
            ctx.lineWidth = 1;
            for(let i = 0; i <= WORLD_WIDTH; i += 100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_HEIGHT); ctx.stroke();
            }
            for(let i = 0; i <= WORLD_HEIGHT; i += 100) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_WIDTH, i); ctx.stroke();
            }

            // 길드 내부 지형지물 (포탈, 창고) 렌더링
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;

                ctx.fillStyle = por.color; ctx.fillRect(por.x, por.y, por.w, por.h);
                ctx.fillStyle = "white"; ctx.font = "bold 14px sans-serif"; 
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("포탈", por.x + por.w/2, por.y - 15);

                ctx.fillStyle = chs.color; ctx.fillRect(chs.x, chs.y, chs.w, chs.h);
                ctx.strokeStyle = "#8B6508"; ctx.lineWidth = 3; ctx.strokeRect(chs.x, chs.y, chs.w, chs.h);
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("개인 창고", chs.x + chs.w/2, chs.y - 10);
            } 
            // 던전 내부 고블린 로직 및 렌더링
            else if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined") {
                let gob = MAP_DATA.dungeon.goblin;
                if (gob.active) {
                    const dx = pCenterX - gob.x, dy = pCenterY - gob.y;
                    const dist = Math.hypot(dx, dy);
                    if (gameState === "playing") {
                        // 플레이어를 향해 서서히 다가오는 단순 어그로 AI
                        if (dist > 20) {
                            gob.x += (dx / dist) * gob.speed; gob.y += (dy / dist) * gob.speed;
                        } else {
                            // 완전히 붙으면 낮은 확률로 지속 피해 입힘
                            if (Math.random() < 0.05) { 
                                player.currentHp -= gob.damage;
                                addFloatingText(pCenterX, player.y - 10, gob.damage, "red");
                                if (player.currentHp < 0) player.currentHp = 0; 
                            }
                        }
                    }

                    // 타겟 락온이 되어있다면 고블린 밑에 붉은색 점선 원형 강조 표시
                    if (player.lockedTarget === gob) {
                        ctx.beginPath();
                        ctx.arc(gob.x, gob.y, gob.size + 10, 0, Math.PI * 2);
                        ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
                        ctx.lineWidth = 3;
                        ctx.setLineDash([6, 6]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // 몬스터 바디 렌더링 (초록색 삼각형)
                    ctx.fillStyle = "limegreen";
                    ctx.beginPath(); ctx.moveTo(gob.x, gob.y - gob.size / 2);
                    ctx.lineTo(gob.x - gob.size / 2, gob.y + gob.size / 2);
                    ctx.lineTo(gob.x + gob.size / 2, gob.y + gob.size / 2); ctx.fill();

                    // 몬스터 머리 위 이름표 및 체력바
                    const tagY = gob.y - gob.size - 25;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(gob.x - 40, tagY, 80, 16);
                    ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; 
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(gob.name, gob.x, tagY + 8);
                    ctx.fillStyle = "red"; ctx.fillRect(gob.x - 40, tagY + 18, 80 * Math.max(0, gob.hp / gob.maxHp), 3);
                }
            }

            // 시각적 파티클/이펙트(원형 파장) 렌더링 후 타이머 차감 및 제거
            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let eff = visualEffects[i];
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.fillStyle = eff.color; ctx.globalAlpha = eff.alpha; ctx.fill(); ctx.restore();
                eff.alpha -= 0.04; eff.timer--;
                if (eff.timer <= 0) visualEffects.splice(i, 1);
            }

            // [MOD-018-5: 플레이어 본체 및 무기 스윙 렌더링]
            // 파란색 동그라미 본체
            ctx.beginPath();
            ctx.arc(player.x, player.y, playerRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#00a2ff"; 
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#004488"; 
            ctx.stroke();

            // 안 보이는 오른팔(오프셋 적용)을 기점으로 한 무기 회전축 시스템
            if (gameState === "playing") {
                let wMouseX = mouseX + camera.x;
                let wMouseY = mouseY + camera.y;
                const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX); // 마우스가 위치한 각도

                // 우클릭으로 꾹 누르고 있는 스킬 조준선 UI를 표시합니다.
                if (player.aimingSkill === "leap_only") {
                    const fixedLeapDist = player.width * 3;
                    const leapW = player.width + 10;
                    ctx.save(); ctx.translate(pCenterX, pCenterY); ctx.rotate(aimAngle);
                    ctx.fillStyle = "rgba(255, 215, 0, 0.3)"; ctx.fillRect(0, -leapW / 2, fixedLeapDist, leapW);
                    ctx.strokeStyle = "gold"; ctx.lineWidth = 2; ctx.strokeRect(0, -leapW / 2, fixedLeapDist, leapW); ctx.restore();
                }
                else if (player.aimingSkill === "jump_slam") {
                    ctx.save(); ctx.beginPath(); ctx.arc(wMouseX, wMouseY, 80, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 69, 0, 0.25)"; ctx.fill();
                    ctx.strokeStyle = "orangered"; ctx.lineWidth = 2; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(pCenterX, pCenterY); ctx.lineTo(wMouseX, wMouseY);
                    ctx.strokeStyle = "rgba(255, 69, 0, 0.4)"; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.restore();
                } 
                else if (player.aimingSkill === "charge") {
                    const chargeDist = Math.hypot(wMouseX - pCenterX, wMouseY - pCenterY);
                    const chargeW = player.width + 10;
                    ctx.save(); ctx.translate(pCenterX, pCenterY); ctx.rotate(aimAngle);
                    ctx.fillStyle = "rgba(255, 215, 0, 0.25)"; ctx.fillRect(0, -chargeW / 2, chargeDist, chargeW);
                    ctx.strokeStyle = "gold"; ctx.lineWidth = 2; ctx.strokeRect(0, -chargeW / 2, chargeDist, chargeW); ctx.restore();
                } 
                
                // === 기본 무기 (하얀 네모) 렌더링 ===
                const weaponLength = 50;  // 무기의 긴 길이
                const weaponWidth = 12;   // 무기 두께
                const pivotX = 0;         // 어깨축 (중앙)
                const pivotY = playerRadius + 25; // 몸통에서 25px 떨어진 위치 (오른손)

                let currentAngle = aimAngle; // 평소 캐릭터 어깨가 조준하는 기본 각도
                let isSwinging = (attackTimer > 0 && player.lastAttackAngle !== undefined);
                
                // 평소에는 손목을 안쪽으로 30도 꺾어 가드를 올리고 있는 비스듬한 상태 유지
                let wristAngle = -Math.PI / 6; 

                // 공격 발동 시 휘두르는 애니메이션 재생 (30프레임 동안 역동적 변화)
                if (isSwinging) {
                    let progress = 1.0 - (attackTimer / 30); // 0.0 -> 1.0
                    
                    // 타겟 방향 기준 120도 범위를 그으며 스윙
                    let startAngle = player.lastAttackAngle - Math.PI / 3;
                    let endAngle = player.lastAttackAngle + Math.PI / 3;
                    
                    currentAngle = startAngle + (endAngle - startAngle) * progress;

                    // 원심력을 받아 무기가 바깥쪽으로 쫙 펴졌다가(0도) 다시 돌아오는(-30도) 손목 스냅
                    wristAngle = (-Math.PI / 6) * (1 - Math.sin(progress * Math.PI));

                    // 무기 끝이 허공에 남기는 검기(궤적) 이펙트 라인
                    ctx.beginPath();
                    const swingRadius = Math.hypot(weaponLength, pivotY);
                    const tipOffsetAngle = Math.atan2(pivotY, weaponLength);
                    ctx.arc(pCenterX, pCenterY, swingRadius, startAngle + tipOffsetAngle, currentAngle + tipOffsetAngle);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                    ctx.lineWidth = 15;
                    ctx.stroke();
                }

                // 어깨-팔-손목 계층적 관절(Hierarchical Transform) 좌표 연산
                ctx.save();
                ctx.translate(pCenterX, pCenterY); // 캐릭터 중심
                ctx.rotate(currentAngle);          // 어깨 회전
                
                ctx.translate(pivotX, pivotY);     // 오른손 위치로 이동
                ctx.rotate(wristAngle);            // 손목 꺾기
                
                // 실제 무기 렌더링 영역
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.fillRect(0, -weaponWidth / 2, weaponLength, weaponWidth);
                
                // 무기 판정용 붉은 테두리 (히트박스 윤곽선)
                ctx.strokeStyle = "red";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0, -weaponWidth / 2, weaponLength, weaponWidth);
                
                // 손 위치를 나타내는 흰색 점 (회전축)
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.fill();
                ctx.strokeStyle = "black";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore(); // 관절 변형 복구
            }

            // 허공으로 날아가는 플로팅 텍스트(데미지 숫자) 렌더링 후 삭제
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
                ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(ft.text, ft.x, ft.y);
                ft.y -= 1; ft.alpha -= 0.03; ft.timer--;
                if (ft.timer <= 0) floatingTexts.splice(i, 1); 
            }
            ctx.globalAlpha = 1.0; 

            ctx.restore(); 
            // === [월드 렌더링 종료 - 이후는 카메라에 구애받지 않는 고정 UI] ===

            // [MOD-018-6: 좌상단 HUD 및 우상단 퀘스트 창 렌더링]
            const hudX = 10, hudY = 10, hudW = 210, hudH = 95;

            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(hudX, hudY, hudW, hudH);

            ctx.fillStyle = "white"; ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "left"; ctx.textBaseline = "top";
            ctx.fillText(`[Lv.${player.level}] ${player.name}`, hudX + 10, hudY + 10); 

            const barW = 180, barH = 10;
            let currentBarY = hudY + 30;

            // HP 게이지 (빨강)
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "red"; ctx.fillRect(hudX + 15, currentBarY, barW * (Math.max(0, player.currentHp) / player.maxHp), barH);
            ctx.fillStyle = "white"; ctx.font = "10px sans-serif"; ctx.fillText(`HP: ${Math.floor(player.currentHp)}/${player.maxHp}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            // ST(스태미나) 게이지 (노랑)
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "yellow"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.currentStamina / player.maxStamina), barH);
            ctx.fillStyle = "black"; ctx.fillText(`ST: ${Math.floor(player.currentStamina)}/${player.maxStamina}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            // MP 게이지 (파랑)
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH);
            ctx.fillStyle = "dodgerblue"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.currentMana / player.maxMana), barH);
            ctx.fillStyle = "white"; ctx.fillText(`MP: ${Math.floor(player.currentMana)}/${player.maxMana}`, hudX + 20, currentBarY - 1);
            currentBarY += 15;

            // EXP 게이지 (초록, 게이지 두께가 조금 얇음)
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(hudX + 15, currentBarY, barW, barH - 2);
            ctx.fillStyle = "limegreen"; ctx.fillRect(hudX + 15, currentBarY, barW * (player.exp / player.maxExp), barH - 2);
            ctx.fillStyle = "black"; ctx.fillText(`EXP: ${Math.floor(player.exp)}/${player.maxExp}`, hudX + 20, currentBarY - 2);

            // 우측 상단 퀘스트 목표 알리미 창
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(canvas.width - 220, 10, 210, 36);
            ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillStyle = quest.active && quest.current >= quest.target ? "gold" : "white"; // 완료 시 금색 하이라이트
            ctx.fillText(quest.active ? `퀘스트: 고블린 (${quest.current}/${quest.target})` : "진행중인 퀘스트 없음", canvas.width - 210, 28);

            // 다음 프레임 예약 루프 (모니터 주사율에 맞춰 반복)
            requestAnimationFrame(gameLoop);
        }
        // [MOD-018-END]

// [MOD-020: 그리드 인벤토리 시스템 (비정형 테트리스 렌더링 및 4방향 회전)]
        
        // [MOD-020-1: 그리드 환경 변수]
        const GRID_CELL_SIZE = 40; 
        const INV_COLS = 8;        
        const INV_ROWS = 10;       
        
        let gridMap = Array.from({ length: INV_ROWS }, () => Array(INV_COLS).fill(null));
        
        // [MOD-020-2: 아이템 규격 데이터베이스 (Shape Matrix 기반)]
        // 1은 꽉 찬 공간, 0은 빈 공간을 뜻합니다.
        const ITEM_DB = {
            "sword_basic": { name: "기본 검", shape: [[1],[1],[1]], color: "rgba(120, 120, 150, 0.9)" }, // 1x3
            "armor_iron":  { name: "철갑옷",  shape: [[1, 1], [1, 1]], color: "rgba(80, 80, 80, 0.9)" },    // 2x2
            "potion_hp":   { name: "포션",   shape: [[1]], color: "rgba(200, 50, 50, 0.9)" }, // 1x1
            "axe_battle":  { name: "ㄱ자 도끼", shape: [[1, 1], [1, 0], [1, 0]], color: "rgba(180, 100, 50, 0.9)" } // 비정형 ㄱ자 아이템!
        };

        // isRotated(bool) 대신 rot(0~3)으로 4방향 회전값을 가집니다.
        let myInventoryItems = [
            { uid: "item_1", baseId: "sword_basic", gridX: 0, gridY: 0, rot: 0 },
            { uid: "item_2", baseId: "armor_iron",  gridX: 2, gridY: 0, rot: 0 },
            { uid: "item_3", baseId: "potion_hp",   gridX: 4, gridY: 0, rot: 0 },
            { uid: "item_4", baseId: "sword_basic", gridX: 0, gridY: 4, rot: 1 }, // 90도 회전된 검 
            { uid: "item_5", baseId: "axe_battle",  gridX: 5, gridY: 5, rot: 0 }  // 추가된 ㄱ자 도끼
        ];

        // [MOD-020-3: 배열 회전 유틸리티 함수]
        // 2차원 배열(Shape)을 시계방향으로 90도씩 주어진 횟수(rot)만큼 회전시킵니다.
        function getRotatedShape(shape, rot) {
            let s = shape;
            for(let step = 0; step < rot; step++) {
                const rows = s.length;
                const cols = s[0].length;
                let newS = Array.from({length: cols}, () => Array(rows).fill(0));
                for(let r = 0; r < rows; r++) {
                    for(let c = 0; c < cols; c++) {
                        newS[c][rows - 1 - r] = s[r][c]; 
                    }
                }
                s = newS;
            }
            return s;
        }

        // [MOD-020-4: 드래그 상태 관리 객체]
        let dragItemState = {
            active: false, itemRef: null, ghostEl: null, 
            offsetX: 0, offsetY: 0, origX: 0, origY: 0, 
            isValid: false, currentGridX: 0, currentGridY: 0,
            lastClientX: 0, lastClientY: 0
        };

        // [MOD-020-5: 비정형 그리드 렌더링 로직]
        function renderGridInventory() {
            const board = document.getElementById("inventoryBoard");
            if (!board) return;
            board.innerHTML = ""; 
            gridMap = Array.from({ length: INV_ROWS }, () => Array(INV_COLS).fill(null));

            myInventoryItems.forEach(item => {
                const baseItem = ITEM_DB[item.baseId];
                if (!baseItem) return;

                const shape = getRotatedShape(baseItem.shape, item.rot);
                const h = shape.length;
                const w = shape[0].length;

                // 충돌 맵에 1이 있는 부위만 uid 기록
                for(let r = 0; r < h; r++) {
                    for(let c = 0; c < w; c++) {
                        if(shape[r][c] === 1) {
                            let gy = item.gridY + r, gx = item.gridX + c;
                            if(gy >= 0 && gy < INV_ROWS && gx >= 0 && gx < INV_COLS) gridMap[gy][gx] = item.uid;
                        }
                    }
                }

                // 래퍼 생성
                let wrapper = document.createElement("div");
                wrapper.className = "grid-item-wrapper";
                wrapper.id = item.uid;
                wrapper.style.width = (w * GRID_CELL_SIZE) + "px";
                wrapper.style.height = (h * GRID_CELL_SIZE) + "px";
                wrapper.style.left = (item.gridX * GRID_CELL_SIZE) + "px";
                wrapper.style.top = (item.gridY * GRID_CELL_SIZE) + "px";

                // 1이 위치한 곳마다 시각적 블록 추가
                let labelPlaced = false;
                for(let r = 0; r < h; r++) {
                    for(let c = 0; c < w; c++) {
                        if(shape[r][c] === 1) {
                            let block = document.createElement("div");
                            block.className = "grid-item-block";
                            block.style.width = GRID_CELL_SIZE + "px";
                            block.style.height = GRID_CELL_SIZE + "px";
                            block.style.left = (c * GRID_CELL_SIZE) + "px";
                            block.style.top = (r * GRID_CELL_SIZE) + "px";
                            block.style.backgroundColor = baseItem.color;
                            wrapper.appendChild(block);

                            // 이름 라벨은 모양 내 첫 번째 블록 중앙에 배치
                            if(!labelPlaced) {
                                let title = document.createElement("div");
                                title.className = "item-label";
                                title.innerText = baseItem.name;
                                title.style.left = (c * GRID_CELL_SIZE + GRID_CELL_SIZE/2) + "px";
                                title.style.top = (r * GRID_CELL_SIZE + GRID_CELL_SIZE/2) + "px";
                                wrapper.appendChild(title);
                                labelPlaced = true;
                            }
                        }
                    }
                }

                // 회전 핸들: 맨 윗줄의 가장 오른쪽 블록 위에 부착
                let handleC = 0;
                for(let c = w - 1; c >= 0; c--) {
                    if(shape[0][c] === 1) { handleC = c; break; }
                }
                let rotateHandle = document.createElement("div");
                rotateHandle.className = "rotate-handle";
                rotateHandle.style.left = (handleC * GRID_CELL_SIZE + GRID_CELL_SIZE - 15) + "px";
                rotateHandle.style.top = "3px";
                
                const triggerRotate = (e) => { e.stopPropagation(); e.preventDefault(); attemptRotate(item, wrapper); };
                rotateHandle.addEventListener("mousedown", triggerRotate);
                rotateHandle.addEventListener("touchstart", triggerRotate, { passive: false });
                wrapper.appendChild(rotateHandle);

                wrapper.addEventListener("mousedown", (e) => startDrag(e, item, wrapper));
                wrapper.addEventListener("touchstart", (e) => startDrag(e, item, wrapper), { passive: false });
                board.appendChild(wrapper);
            });
        }

        // [MOD-020-6: 비정형 블록 제자리 회전 충돌 검사 로직]
        function attemptRotate(itemObj, htmlEl) {
            const baseItem = ITEM_DB[itemObj.baseId];
            let nextRot = (itemObj.rot + 1) % 4; // 0 -> 1 -> 2 -> 3 순환
            const newShape = getRotatedShape(baseItem.shape, nextRot);
            const newH = newShape.length, newW = newShape[0].length;
            let canRotate = true;

            for(let r = 0; r < newH; r++) {
                for(let c = 0; c < newW; c++) {
                    if(newShape[r][c] === 1) {
                        let gy = itemObj.gridY + r, gx = itemObj.gridX + c;
                        // 공간 경계 및 충돌 판정
                        if(gy < 0 || gy >= INV_ROWS || gx < 0 || gx >= INV_COLS) { canRotate = false; break; }
                        if(gridMap[gy][gx] !== null && gridMap[gy][gx] !== itemObj.uid) { canRotate = false; break; }
                    }
                }
                if(!canRotate) break;
            }

            if (canRotate) {
                itemObj.rot = nextRot;
                renderGridInventory(); 
            } else {
                let blocks = htmlEl.querySelectorAll('.grid-item-block');
                blocks.forEach(b => {
                    const originalColor = b.style.backgroundColor;
                    b.style.backgroundColor = "rgba(255, 0, 0, 0.8)";
                    setTimeout(() => { b.style.backgroundColor = originalColor; }, 200);
                });
            }
        }

        // [MOD-020-7: 드래그 앤 드롭 함수]
        function startDrag(e, itemObj, htmlEl) {
            if (e.type === "mousedown" && e.button !== 0) return; 

            dragItemState.active = true;
            dragItemState.itemRef = itemObj;
            dragItemState.origX = itemObj.gridX;
            dragItemState.origY = itemObj.gridY;

            let clientX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;

            const rect = htmlEl.getBoundingClientRect();
            dragItemState.offsetX = clientX - rect.left;
            dragItemState.offsetY = clientY - rect.top;
            dragItemState.lastClientX = clientX;
            dragItemState.lastClientY = clientY;

            // 드래그 중인 1 파츠만 맵에서 지우기
            const baseItem = ITEM_DB[itemObj.baseId];
            const shape = getRotatedShape(baseItem.shape, itemObj.rot);
            const h = shape.length, w = shape[0].length;
            for(let r = 0; r < h; r++) {
                for(let c = 0; c < w; c++) {
                    if(shape[r][c] === 1) {
                        let gy = itemObj.gridY + r, gx = itemObj.gridX + c;
                        if(gy >= 0 && gy < INV_ROWS && gx >= 0 && gx < INV_COLS) gridMap[gy][gx] = null;
                    }
                }
            }

            let ghost = document.createElement("div");
            ghost.className = "grid-item-wrapper dragging"; 
            ghost.style.width = htmlEl.style.width;
            ghost.style.height = htmlEl.style.height;
            ghost.innerHTML = htmlEl.innerHTML; 
            
            document.getElementById("inventoryBoard").appendChild(ghost);
            dragItemState.ghostEl = ghost;
            htmlEl.style.display = "none";

            document.addEventListener("mousemove", onDragMove);
            document.addEventListener("mouseup", onDragEnd);
            document.addEventListener("touchmove", onDragMove, { passive: false });
            document.addEventListener("touchend", onDragEnd);
            
            updateDragGhost(); 
        }

        function onDragMove(e) {
            if (!dragItemState.active) return;
            if(e.type === "touchmove" && e.touches.length > 0) {
                dragItemState.lastClientX = e.touches[0].clientX;
                dragItemState.lastClientY = e.touches[0].clientY;
            } else if(e.type === "mousemove") {
                dragItemState.lastClientX = e.clientX;
                dragItemState.lastClientY = e.clientY;
            }
            updateDragGhost();
        }

        function updateDragGhost() {
            const board = document.getElementById("inventoryBoard");
            if(!board) return;
            const boardRect = board.getBoundingClientRect();

            let localX = dragItemState.lastClientX - boardRect.left;
            let localY = dragItemState.lastClientY - boardRect.top;

            let rawGridX = Math.round((localX - dragItemState.offsetX) / GRID_CELL_SIZE);
            let rawGridY = Math.round((localY - dragItemState.offsetY) / GRID_CELL_SIZE);

            const baseItem = ITEM_DB[dragItemState.itemRef.baseId];
            const shape = getRotatedShape(baseItem.shape, dragItemState.itemRef.rot);
            const h = shape.length, w = shape[0].length;

            dragItemState.currentGridX = rawGridX;
            dragItemState.currentGridY = rawGridY;
            dragItemState.isValid = true;
            
            for(let r = 0; r < h; r++) {
                for(let c = 0; c < w; c++) {
                    if(shape[r][c] === 1) {
                        let gy = rawGridY + r, gx = rawGridX + c;
                        if (gy < 0 || gy >= INV_ROWS || gx < 0 || gx >= INV_COLS) { dragItemState.isValid = false; break; }
                        if (gridMap[gy][gx] !== null) { dragItemState.isValid = false; break; }
                    }
                }
                if(!dragItemState.isValid) break;
            }

            dragItemState.ghostEl.style.left = (rawGridX * GRID_CELL_SIZE) + "px";
            dragItemState.ghostEl.style.top = (rawGridY * GRID_CELL_SIZE) + "px";
            
            let blocks = dragItemState.ghostEl.querySelectorAll('.grid-item-block');
            blocks.forEach(b => {
                if (dragItemState.isValid) {
                    b.style.backgroundColor = "rgba(0, 255, 0, 0.5)"; 
                    b.style.border = "2px solid #0f0";
                } else {
                    b.style.backgroundColor = "rgba(255, 0, 0, 0.5)"; 
                    b.style.border = "2px solid #f00";
                }
            });
        }

        function onDragEnd(e) {
            if (!dragItemState.active) return;
            document.removeEventListener("mousemove", onDragMove);
            document.removeEventListener("mouseup", onDragEnd);
            document.removeEventListener("touchmove", onDragMove);
            document.removeEventListener("touchend", onDragEnd);

            if (dragItemState.isValid) {
                dragItemState.itemRef.gridX = dragItemState.currentGridX;
                dragItemState.itemRef.gridY = dragItemState.currentGridY;
            } else {
                dragItemState.itemRef.gridX = dragItemState.origX;
                dragItemState.itemRef.gridY = dragItemState.origY;
            }

            dragItemState.active = false;
            if(dragItemState.ghostEl) {
                dragItemState.ghostEl.remove();
                dragItemState.ghostEl = null;
            }
            renderGridInventory();
        }
        // [MOD-020-END]
        
        // [MOD-019: 메인 실행부]
        // 엔진 및 초기 변수 선언이 끝난 후 게임 루프를 킥오프(Kickoff) 합니다.
        gameLoop();
        // [MOD-019-END]
    </script>
