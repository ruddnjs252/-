<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리퀘 (Re-Quest) v0.2.5.1010.1</title>
    
    <style>
        /* [MOD-001: 기본 화면 및 컨테이너 스타일] */
        /* [MOD-001-1: 전체 바디 및 캔버스 영역] */
        /* 브라우저 기본 여백을 없애고 스크롤/터치 기본 동작을 막아 게임 화면에 집중하도록 설정합니다. */
        body { background-color: #222; color: white; font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        h1 { display: none; } /* 게임 캔버스가 전체화면을 덮도록 기존 텍스트 타이틀을 숨김 처리합니다. */
        
        #gameContainer { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            margin: 0; border: none; overflow: hidden; 
            background-color: #2a2a2a; /* 캔버스 바깥 여백이 생길 경우 보여질 기본 배경색 */
        }
        /* 마우스 커서를 조준선(crosshair)으로 변경하여 전투 몰입감을 높입니다. */
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        /* [MOD-001-END] */

        /* [MOD-002: UI 레이어 및 팝업 공통 스타일] */
        /* [MOD-002-1: 모달 배경 및 패널] */
        /* 게임 화면을 덮는 반투명 검은색 배경 레이어입니다. z-index를 높여 최상단에 배치합니다. */
        .ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10; }
        .panel { padding: 15px; box-sizing: border-box; overflow-y: auto; }
        
        /* [MOD-002-2: 인벤토리 및 직업 리스트 아이템 디자인] */
        .item, .class-item { background: #444; padding: 10px; margin-bottom: 5px; border: 1px solid #777; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .item:hover { background: #555; } /* 마우스 오버 시 밝아지는 효과 */
        .class-item:hover:not(.locked) { background: #555; }
        .class-item.selected { border: 2px solid gold; background: #665500; } /* 선택된 직업 강조 */
        .class-item.locked { background: #222; color: #555; border: 1px dashed #444; cursor: not-allowed; } /* 스탯 부족으로 잠긴 직업 */
       
        /* [MOD-002-3: 그리드 인벤토리 스타일 (테트리스형 비정형 블록)] */
        .inventory-board {
            position: relative; background-color: #1a1a1a; border: 2px solid #555; width: 320px; height: 400px; 
            background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .grid-item-wrapper {
            position: absolute; cursor: grab; user-select: none; z-index: 2;
            pointer-events: none; /* [버그수정] 껍데기의 빈 공간은 클릭(드래그)을 무시하도록 설정 */
        }

        .grid-item-block {
            position: absolute; box-sizing: border-box; border: 1px solid #aaa; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: border 0.2s, filter 0.2s, background-color 0.15s ease-out;
            pointer-events: auto; /* [버그수정] 실제 색칠된 1x1 블록 칸들만 클릭을 허용 */
        }

        .grid-item-wrapper:hover .grid-item-block { border: 1px solid #fff; filter: brightness(1.2); }

        .rotate-handle {
            position: absolute; width: 12px; height: 12px; background-color: gold; border-radius: 50%; border: 1px solid #000; cursor: pointer; z-index: 5; transition: transform 0.1s;
            pointer-events: auto; /* [버그수정] 회전 핸들 클릭 허용 */
        }
        .rotate-handle:hover { background-color: #ffaa00; transform: scale(1.3); }

        .grid-item-wrapper.dragging { opacity: 0.8; pointer-events: none; z-index: 9999; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7)); }
        .item-label { position: absolute; transform: translate(-50%, -50%); color: white; font-size: 11px; font-weight: bold; pointer-events: none; text-align: center; width: 50px; text-shadow: 1px 1px 2px black; z-index: 4; }
        /* [MOD-002-3-END] */

     /* [MOD-002-4: 장착 장비 및 아티팩트 UI 패널 (3:7 비율 압축 버전)] */
        #inventoryUI { display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); }
        .inv-container { background: #111; padding: 15px; border: 3px solid #555; border-radius: 8px; display: flex; gap: 15px; position: relative; transform-origin: center; }
        
        /* 좌측 패널 넓이를 150px로 극단적 축소 (3:7 비율) */
        #leftPanel { width: 150px; height: 400px; display: flex; flex-direction: column; background: #1a1a1a; border: 2px solid #444; box-sizing: border-box; }
        
        #equipSection { position: relative; width: 100%; height: 140px; background: #222; border-bottom: 2px solid #333; }
        .equip-slot { position: absolute; width: 34px; height: 34px; background-color: #2a2a2a; border: 2px solid #555; display: flex; align-items: center; justify-content: center; border-radius: 4px; box-sizing: border-box; transition: 0.2s; cursor: pointer; }
        .equip-slot:hover { border-color: gold; box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .slot-hint { font-size: 9px; color: #666; pointer-events: none; }
        
        /* 150px 넓이에 맞춰 중앙(75px) 기준으로 십자가 좌표 재설계 */
        .slot-head { top: 15px; left: 58px; }
        .slot-mainWeapon { top: 53px; left: 20px; }
        .slot-chest { top: 53px; left: 58px; }
        .slot-subWeapon { top: 53px; left: 96px; }
        .slot-shoes { top: 91px; left: 58px; }
        
        .slot-throwable { top: 94px; left: 99px; width: 28px; height: 28px; }
        .slot-throwable::after { content: "투척"; position: absolute; bottom: -16px; font-size: 9px; color: #888; }

        /* 아티팩트 영역 압축 */
        #artifactSection { display: flex; gap: 3px; justify-content: center; align-items: flex-end; height: 55px; padding-bottom: 8px; background: #222; border-bottom: 2px solid #333; position: relative; box-sizing: border-box; }
        .artifact-label { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #888; font-weight: bold; }
        .artifact-slot { width: 26px; height: 26px; background-color: #2a2a2a; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-sizing: border-box; }
        .artifact-slot:hover { border-color: #00ffcc; }

        #statSection { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #1a1a1a; overflow: hidden; }

        .socket-slot { width: 36px; height: 36px; background-color: #222; border: 2px dashed #666; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .socket-slot:hover { border-color: gold; background-color: #333; box-shadow: 0 0 8px rgba(255,215,0,0.5); }
       
        /* [MOD-002-4]의 맨 아래에 추가: ui_2 전용 인챈트 타겟 슬롯 */
        .enchant-target-slot {
            width: 50px; height: 50px; background-color: #222; border: 2px dashed #666; 
            border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; box-sizing: border-box; cursor: pointer;
            position: relative;
        }
        .enchant-target-slot:hover { border-color: gold; box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .enchant-target-hint { font-size: 10px; color: #555; text-align: center; pointer-events: none; }
        
        /* [MOD-002-4-END] */

        /* [MOD-002-5: 인챈트 애니메이션 및 팝업 스타일] */
        @keyframes slideFadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .socket-animated {
            animation: slideFadeUp 0.4s ease forwards;
            opacity: 0; /* 처음엔 투명하게 시작 */
        }
        /* 각 소켓마다 0.15초씩 딜레이를 주어 순서대로 스스륵 나타나게 함 */
        .socket-animated:nth-child(1) { animation-delay: 0.1s; }
        .socket-animated:nth-child(2) { animation-delay: 0.25s; }
        .socket-animated:nth-child(3) { animation-delay: 0.4s; }

        .enchant-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; border: 2px solid gold; border-radius: 8px; padding: 15px;
            display: none; flex-direction: column; gap: 8px; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); width: 200px; box-sizing: border-box;
        }
        .enchant-scroll-item {
            background: #333; border: 1px solid #555; color: white; padding: 10px;
            font-size: 12px; cursor: pointer; text-align: center; transition: 0.2s; border-radius: 4px;
        }
        .enchant-scroll-item:hover { background: #444; border-color: gold; color: gold; box-shadow: 0 0 8px rgba(255,215,0,0.5); }
        /* [MOD-002-5-END] */

        /* [MOD-002-7: 빵부스러기 알림 뱃지(느낌표) 스타일] */
        .noti-badge {
            position: absolute; top: -6px; right: -6px;
            background-color: #ff3333; color: white;
            font-size: 12px; font-weight: bold;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 20; pointer-events: none;
            box-shadow: 0 0 8px rgba(255, 50, 50, 0.8);
            animation: pulse-noti 1.2s infinite;
        }
        @keyframes pulse-noti {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 1; }
        }
        /* [MOD-002-7-END] */

        /* [MOD-002-8: 아이템 정보 툴팁 창] */
        .item-tooltip {
            position: fixed; display: none; background: rgba(10, 10, 15, 0.95);
            border: 2px solid #555; padding: 12px; border-radius: 6px;
            color: white; font-size: 12px; z-index: 10000; pointer-events: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); width: 160px;
        }
        .item-tooltip-title { font-weight: bold; font-size: 14px; margin-bottom: 3px; color: gold; }
        .item-tooltip-type { color: #888; margin-bottom: 8px; font-size: 11px; }
        .item-tooltip-stat { color: #00ffcc; font-weight: bold; margin-bottom: 4px; }
        .item-tooltip-enchant-title { color: #ff8800; font-weight: bold; margin-top: 8px; border-top: 1px dashed #555; padding-top: 6px; font-size: 11px; }
        .item-tooltip-enchant-item { color: #ff4444; font-size: 11px; padding-left: 5px; }
        .item-tooltip-desc { color: #ccc; margin-top: 8px; border-top: 1px solid #444; padding-top: 6px; font-size: 11px; line-height: 1.4; }
        /* [MOD-002-8-END] */
        
        
        /* [MOD-003: 버튼 컨트롤 및 모바일 가상 패드(vmin 반응형) 스타일] */
        /* [MOD-003-1: 일반 버튼 및 텍스트] */
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 5px 15px; background: red; color: white; border: none; cursor: pointer; font-weight: bold; z-index: 20; }
        .btn { padding: 8px 20px; background: #555; color: white; border: 1px solid #888; cursor: pointer; margin: 5px; font-weight: bold; border-radius: 4px; }
        .btn:hover:not(:disabled) { background: #777; }
        .stat-text { font-size: 13px; color: lightgray; margin-bottom: 3px; }
        .nav-btn { padding: 10px; background: #222; color: white; border: 1px solid #666; cursor: pointer; width: 48%; }
        .nav-btn.active { background: #555; font-weight: bold; }
        #ccPlayerName { padding: 8px; font-size: 16px; width: 220px; background: #111; color: white; border: 1px solid #777; text-align: center; margin-bottom: 10px; }
        
        /* 캐릭터 생성 창의 스탯 조절 버튼 영역 */
        .stat-control-box { text-align: center; background: #111; padding: 5px; border-radius: 5px; border: 1px solid #444;}
        .stat-btn { background: #333; color: white; border: 1px solid #666; cursor: pointer; width: 25px; height: 25px; font-weight: bold; }
        .stat-btn:hover { background: #555; }

        /* [MOD-003-2: 모바일 가상 조이패드 및 버튼] */
        .vpad-btn { position: fixed; border-radius: 50%; background: rgba(0, 0, 0, 0.65); border: 2px solid rgba(255, 255, 255, 0.5); color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; z-index: 9999; }
        .vpad-btn:active { background: rgba(255, 255, 255, 0.4); }
        
        #vpad-atk { right: 4vmin; bottom: 6vmin; width: 16vmin; height: 16vmin; font-size: 3.5vmin; border-color: #ff5555; }
        #vpad-skill { right: 23vmin; bottom: 4vmin; width: 14vmin; height: 14vmin; font-size: 3vmin; border-color: #55ff55; }
        #vpad-r { right: 5vmin; bottom: 25vmin; width: 11vmin; height: 11vmin; font-size: 2.5vmin; border-color: #ffaa00; }
        #vpad-e { right: 21vmin; bottom: 21vmin; width: 10vmin; height: 10vmin; font-size: 2.2vmin; border-color: #aaaaaa; }
        
        #vpad-stick-base { position: fixed; left: 8vmin; bottom: 8vmin; width: 26vmin; height: 26vmin; border-radius: 50%; background: rgba(0, 0, 0, 0.6); border: 3px solid #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); display: none; z-index: 9999; }
        #vpad-stick-knob { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border-radius: 50%; background: #00ffff; box-shadow: 0 0 8px #ffffff; }

        /* [추가] PC(마우스 사용) 환경에서는 모바일 전용 버튼들을 완전히 숨깁니다. */
        @media (hover: hover) and (pointer: fine) {
            .vpad-btn, #vpad-stick-base { display: none !important; }
        }
        /* [MOD-003-2-END] */
       /* [MOD-003-3: 가로형 5칸 사다리 퀵슬롯 UI (페이드아웃 + 딸깍 애니메이션)] */
        #quick-slot-wrapper {
            position: fixed; 
            bottom: 4vmin; 
            left: 50%; transform: translateX(-50%);
            display: flex; justify-content: center; align-items: center;
            z-index: 9000;
            pointer-events: none;
            
            border-top: 3px solid rgba(255, 255, 255, 0.8);
            border-bottom: 3px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 0; 
            
            /* ★ 핵심: 사다리 전체(뼈대 포함)가 양끝에서 15% 지점부터 자연스럽게 투명해지는 마스크 효과 */
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        
        .q-slot-ladder {
            width: 10vmin; height: 10vmin;
            border-right: 2px solid rgba(255, 255, 255, 0.6);
            display: flex; align-items: center; justify-content: center;
            
            /* ★ 핵심: '슥~' 미끄러지는 대신, 0.15초 만에 기계적으로 '딸깍!' 하고 튕기듯 달라붙는 탄성 곡선 */
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto; cursor: pointer;
            box-sizing: border-box;
            position: relative;
        }
        #q-slot-0 { border-left: 2px solid rgba(255, 255, 255, 0.6); }
        
        .q-slot-inner {
            text-align: center; color: white;
            font-size: 1.6vmin; font-weight: bold; pointer-events: none;
            text-shadow: 1px 1px 2px black;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* 중앙 네온 발광 칸 */
        .q-slot-center {
            width: 12vmin; height: 12vmin;
            background: rgba(0, 255, 255, 0.15); 
            border: 3px solid #00ffff !important; 
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.8), 0 0 25px rgba(0, 255, 255, 0.9);
            z-index: 10;
            margin: -1vmin 0; 
        }
        .q-slot-center .q-slot-inner { 
            font-size: 2.2vmin; 
            color: #ffffff; 
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; 
        }
        
        /* 양옆 대기 스킬 */
        .q-slot-side { opacity: 0.8; z-index: 5; background: rgba(0, 0, 0, 0.3); } 
        
        /* 극좌/극우 사라지는 스킬 (투명도 대폭 낮춤) */
        .q-slot-far { opacity: 0.1; z-index: 1; background: transparent; }  
        /* [MOD-003-3-END] */

       /* [MOD-024: 스킬 덱 빌딩 UI 스타일] */
        .skill-icon { 
            width: 45px; height: 45px; background: #222; border: 2px solid #666; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 11px; font-weight: bold; cursor: grab; user-select: none; 
            transition: 0.2s; box-sizing: border-box; box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        .skill-icon:hover { border-color: #00ffcc; background: #333; }
        
        /* 덱 장착 사다리 슬롯 */
        .deck-slot { 
            width: 50px; height: 50px; border-right: 2px solid rgba(255,255,255,0.6); 
            display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: rgba(0,0,0,0.5);
        }
        .deck-slot:first-child { border-left: 2px solid rgba(255,255,255,0.6); }
        .deck-slot.highlight { background: rgba(0, 255, 255, 0.3); border-color: #00ffff; }
        
        .skill-ghost { 
            position: fixed; pointer-events: none; opacity: 0.9; z-index: 9999; 
            transform: translate(-50%, -50%); box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        /* ★ 세로 스크롤바 커스텀 디자인 */
        #skillListContainer::-webkit-scrollbar { width: 6px; }
        #skillListContainer::-webkit-scrollbar-track { background: #222; border-radius: 3px; }
        #skillListContainer::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        #skillListContainer::-webkit-scrollbar-thumb:hover { background: #777; }
        /* [MOD-024-END] */
        
    </style>
</head>
<body>
    <!-- [MOD-004: 오버레이 UI 및 캔버스 렌더링 영역] -->
    <!-- [MOD-004-1: 모바일 가상 패드 및 사다리형 퀵슬롯 HTML] -->
    <div id="vpad-container">
        <!-- 5칸 사다리형 슬롯 -->
        <div id="quick-slot-wrapper">
            <div id="q-slot-0" class="q-slot-ladder q-slot-far"><div class="q-slot-inner"></div></div>
            <div id="q-slot-1" class="q-slot-ladder q-slot-side"><div class="q-slot-inner"></div></div>
            <div id="q-slot-2" class="q-slot-ladder q-slot-center"><div class="q-slot-inner"></div></div>
            <div id="q-slot-3" class="q-slot-ladder q-slot-side"><div class="q-slot-inner"></div></div>
            <div id="q-slot-4" class="q-slot-ladder q-slot-far"><div class="q-slot-inner"></div></div>
        </div>
        
        <div id="vpad-stick-base"><div id="vpad-stick-knob"></div></div>
        <div id="vpad-atk" class="vpad-btn">공격</div>
        <div id="vpad-skill" class="vpad-btn">스킬</div>
        <div id="vpad-r" class="vpad-btn">R변경</div>
        <div id="vpad-e" class="vpad-btn">가방</div>
    </div>
    <!-- [MOD-004-1-END] -->
    
    <!-- [MOD-004-2: 메인 게임 캔버스] -->
    <div id="gameContainer">
        <!-- 내부 렌더링 크기는 1000x750 기준이며, JS를 통해 브라우저 해상도에 맞춰 스케일링 됨 -->
        <canvas id="gameCanvas" width="1000" height="750"></canvas>
    <!-- [MOD-004-END] -->
        
        <!-- [MOD-005: 길드 가입 신청서 (캐릭터 생성) UI] -->
        <!-- [MOD-005-1: 스탯 분배 패널] -->
        <div id="charCreationUI" class="ui-layer" style="display: none; flex-direction: column; align-items: center; justify-content: center;">

    <!-- [MOD-009: 외부 데이터 스크립트 파일 연결] -->
    <!-- 맵 좌표 데이터 및 직업 스탯 데이터 (현재 HTML 환경 내엔 생략됨) -->
    <script src="data/maps.js"></script>

    <!-- [MOD-009-END] -->

    <script>
        // [MOD-010: 게임 엔진 초기화 및 전역 변수 선언]
        // [MOD-010-1: 캔버스 및 카메라 설정]
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const WORLD_WIDTH = 3000;  // 전체 월드의 가로 크기
        const WORLD_HEIGHT = 3000; // 전체 월드의 세로 크기
        let camera = { x: 0, y: 0, width: 1000, height: 750 }; // 카메라 뷰포트 영역

        // 창 크기 변경 시 캔버스 해상도를 동기화하여 깨짐 방지
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            camera.width = canvas.width;
            camera.height = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // [MOD-010-2: 게임 상태 및 플레이어 데이터 객체]
        let gameState = "playing"; 
        let currentMap = "guild";  

        let player = {
            name: "방랑자",
            x: 500, y: 500, width: 30, height: 30, color: "cyan", speed: 5, 
            stats: { hp: 3, str: 3, dex: 3, mana: 3, stamina: 3, charm: 3 }, 
            baseStats: { hp: 3, str: 3, dex: 3, mana: 3, stamina: 3, charm: 3 }, // <-- [핵심 수정] 한글 스탯명을 모두 영어로 통일!
            equipment: { 
                head: null, mainWeapon: null, chest: null, subWeapon: null, shoes: null, throwable: null,
                artifact_0: null, artifact_1: null, artifact_2: null, artifact_3: null, artifact_4: null
            },
            job: "무소속", 
            acquiredJobs: [], 
            currentSkillIdx: 0,
            skillCooldowns: {}, 
            level: 1, exp: 0, maxExp: 100, 
            maxHp: 9, currentHp: 9, 
            maxStamina: 9, currentStamina: 9, staminaRegenTimer: 0, 
            maxMana: 9, currentMana: 9, 
            knockbackDirX: 0, knockbackDirY: 0, 
            dashSpeed: 0, dashDirX: 0, dashDirY: 0, dashTimer: 0, 
            targetX: 0, targetY: 0, 
            activeSkillType: null, 
            aimingSkill: null, 
            currentQuickSlotIdx: 0, 
            lockedTarget: null 
        };
        // (기존에 있던 잘못된 [MOD-030] 부분은 여기서 완전히 삭제되었습니다.)

        // [MOD-010-3: 시스템, 퀘스트, 이펙트 등 전역 관리 변수]
        let quest = { active: false, target: 10, current: 0 }; // 퀘스트 진행 상태
        let floatingTexts = []; // 데미지, 타겟팅 텍스트 등 공중에 뜨는 글자 관리
        let visualEffects = []; // 스킬 타격 이펙트 (원형 파티클 등) 관리
        let inventory = []; // 플레이어 가방 (그리드 연동)
        let equipment = []; // 장착 중인 장비
        let personalStorage = []; // 창고 보관 아이템
        
        // [신규] 필드 바닥에 떨어진 아이템 및 현재 타겟팅 중인 아이템 보관 변수
        let fieldItems = []; 
        let targetedFieldItem = null; 

        let totalFreePoints = 30; // 캐릭터 생성 시 주어지는 잔여 스탯 포인트
        let tempSelectedJobs = []; // 캐릭터 생성 시 임시로 선택한 직업 목록

        let mouseX = 0, mouseY = 0; // 월드 좌표계 기준 마우스 위치
        let attackTimer = 0; // 기본 공격 쿨타임 및 무기 스윙 애니메이션 프레임 제어
        let keys = {}; // 키보드 입력 상태 저장 객체
        const statKeys = ["hp", "str", "dex", "mana", "stamina", "charm"];
        // [MOD-010-END]
        
        // [MOD-011: 직업 및 스킬 정보 반환 (외부 js 연동 영역)]
        // 외부 파일(jobs.js)에서 데이터를 불러올 공간입니다.
        // [MOD-011-END]

        // [MOD-012: NPC 상호작용 및 맵 이동 이벤트 처리]
        // [MOD-012-1: NPC 메뉴 열기 및 닫기]
        // 길드 내 오브젝트(접수원, 포탈) 클릭 시 팝업을 띄우는 로직입니다.
        function openNPCMenu(type) {
            gameState = "npcMenu";
            const ui = document.getElementById("npcMenuUI");
            const title = document.getElementById("npcMenuTitle");
            const content = document.getElementById("npcMenuContent");
            ui.style.display = "flex";

            if (type === 'receptionist') {
                title.innerText = "접수원";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="talkReceptionist()">대화하기</button>
                    <button class="btn" style="padding: 15px; background: darkred;" onclick="attackReceptionist()">공격하기</button>
                `;
            } else if (type === 'receptionist_talk') {
                title.innerText = "접수원: 무엇을 도와드릴까요?";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px;" onclick="openCharCreation()">길드 가입 작성</button>
                    <button class="btn" style="padding: 15px;" onclick="takeQuest()">퀘스트 받기</button>
                `;
            } else if (type === 'portal') {
                title.innerText = "포탈";
                content.innerHTML = `
                    <button class="btn" style="padding: 15px; background: purple;" onclick="enterDungeon()">발러 던전 입장</button>
                `;
            }
        }

        function closeNPCMenu() {
            gameState = "playing"; // 메뉴를 닫고 조작 권한 반환
            document.getElementById("npcMenuUI").style.display = "none";
        }

        // [MOD-012-2: 대화, 공격, 퀘스트 수락 및 부활 액션]
        function talkReceptionist() { openNPCMenu('receptionist_talk'); }

        // 접수원을 공격하면 즉사 후 뒤로 밀려나는 연출(knockback)을 발생시킵니다.
        function attackReceptionist() {
            closeNPCMenu();
            addFloatingText(player.x, player.y, "9999", "red");
            player.currentHp = 0;
            player.knockbackDirX = player.x < MAP_DATA.guild.receptionist.x ? -1 : 1;
            player.knockbackDirY = -0.5; 
            gameState = "knockback";
        }

        // 데스 스크린에서 '길드에서 부활하기' 버튼 클릭 시 스탯을 모두 회복시키고 길드 중앙으로 좌표를 옮깁니다.
        function respawn() {
            player.currentHp = player.maxHp;
            player.currentStamina = player.maxStamina;
            player.currentMana = player.maxMana;
            player.x = 500; player.y = 500;
            currentMap = "guild";
            // 던전에 있던 몬스터(고블린)의 상태를 비활성화(어그로 해제) 시킵니다.
            if (typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon) {
                MAP_DATA.dungeon.goblin.active = false;
            }
            player.aimingSkill = null;
            player.dashTimer = 0;
            gameState = "playing";
            document.getElementById("deathUI").style.display = "none";
        }

        function takeQuest() {
            quest.active = true;
            quest.current = 0;
            alert("퀘스트 수락: 고블린 10마리 잡기");

        // [MOD-014: 캐릭터 생성(스탯 분배 및 직업 선택) 로직]
   // [MOD-014-1: 육각형 레이더 차트 렌더링 (폭 150px 비율 초압축 최적화)]
        function drawRadarChart(canvasId) {
            const rc = document.getElementById(canvasId);
            if (!rc) return;
            const rctx = rc.getContext("2d");
            
            const w = rc.width;
            const h = rc.height;
            const cx = Math.round(w / 2);
            const cy = Math.round(h / 2); 
            
            let maxR = 0;
            let fontSize = 12;
            let textOffset = 35;
            
            let labelsContainer = document.getElementById(canvasId + "_labels");
            if (labelsContainer) labelsContainer.innerHTML = "";
            
            if (canvasId === "infoRadarCanvas") {
                // 폭이 150px로 좁아졌으므로 캔버스를 뚫고 나가지 않도록 반지름(52)과 여백(14)을 세밀하게 조임
                maxR = 52; 
                textOffset = 14; 
            } else {
                maxR = cx - 75;
                fontSize = 12;
                textOffset = 35;
            }

            const maxStat = 25; 
            rctx.clearRect(0, 0, w, h);
            const labels = ["체력", "힘", "민첩", "마나", "스테미나", "매력"];

            rctx.strokeStyle = "#555"; 
            rctx.lineWidth = (canvasId === "infoRadarCanvas" ? 2 : 1); 
            
            for(let step = 1; step <= 4; step++) {
                let r = maxR * (step / 4);
                rctx.beginPath();
                for(let i=0; i<6; i++) {
                    let angle = (Math.PI / 3) * i - (Math.PI / 2);
                    let x = Math.round(cx + Math.cos(angle) * r);
                    let y = Math.round(cy + Math.sin(angle) * r);
                    if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
                }
                rctx.closePath(); rctx.stroke();
            }

            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                let xEnd = Math.round(cx + Math.cos(angle) * maxR);
                let yEnd = Math.round(cy + Math.sin(angle) * maxR);
                
                rctx.beginPath();
                rctx.moveTo(cx, cy);
                rctx.lineTo(xEnd, yEnd);
                rctx.stroke();

                let currentOffset = textOffset;
                // 측면 스탯들이 150px 경계를 넘어가지 않게 미세하게만 밀어냄
                if (canvasId === "infoRadarCanvas" && (i === 1 || i === 2 || i === 4 || i === 5)) {
                    currentOffset += 8; 
                }

                let lx = cx + Math.cos(angle) * (maxR + currentOffset);
                let ly = cy + Math.sin(angle) * (maxR + currentOffset);

                if (canvasId === "infoRadarCanvas" && labelsContainer) {
                    let scaledX = Math.round(lx / 2); 
                    let scaledY = Math.round(ly / 2);
                    
                    let div = document.createElement("div");
                    div.style.position = "absolute";
                    div.style.left = scaledX + "px";
                    div.style.top = scaledY + "px";
                    div.style.transform = "translate(-50%, -50%)";
                    div.style.pointerEvents = "none"; 
                    div.style.color = "white";
                    div.style.fontSize = "10px"; // 좁은 공간을 위한 폰트 축소
                    div.style.fontWeight = "bold";
                    div.style.whiteSpace = "nowrap";
                    
                    div.innerText = `${labels[i]}: ${player.stats[statKeys[i]]}`;
                    labelsContainer.appendChild(div);
                } else {
                    rctx.fillStyle = "white"; 
                    rctx.font = `bold ${fontSize}px sans-serif`;
                    rctx.textAlign = "center"; rctx.textBaseline = "middle";
                    rctx.fillText(`${labels[i]}: ${player.stats[statKeys[i]]}`, lx, ly);
                }
            }

            rctx.fillStyle = "rgba(255, 215, 0, 0.5)"; 
            rctx.strokeStyle = "gold"; 
            rctx.lineWidth = (canvasId === "infoRadarCanvas" ? 3 : 2);
            rctx.beginPath();
            for(let i=0; i<6; i++) {
                let angle = (Math.PI / 3) * i - (Math.PI / 2);
                let val = Math.min(player.stats[statKeys[i]], maxStat); 
                let r = maxR * (val / maxStat);
                let x = Math.round(cx + Math.cos(angle) * r);
                let y = Math.round(cy + Math.sin(angle) * r);
                if(i===0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
            }
            rctx.closePath(); rctx.fill(); rctx.stroke();
        }
        // [MOD-014-1-END]
        
        // [MOD-014-2: 스탯 증감 및 UI 업데이트]
        // 포인트 잔여량과 최소 한계치(3)를 검사하여 스탯을 더하거나 뺍니다.
        function adjustStat(stat, amount) {
            if (amount > 0 && totalFreePoints > 0) {
                player.stats[stat]++;
                totalFreePoints--;
            } else if (amount < 0 && player.stats[stat] > 3) {
                player.stats[stat]--;
                totalFreePoints++;
            }
            updateCharCreationUI();
        }
