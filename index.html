        // [MOD-014-3: 직업 요구사항 확인 및 토글]
        // 클릭한 직업의 스탯 요구치(req)를 확인하고 만족하면 배열에 추가/제거합니다.
        function toggleJob(job) {
            let targetVal = job.reqVal || 6;
            let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);

            if (!meetsReq && job.req.length > 0) {
                alert(`스탯 조건을 먼저 만족해야 합니다! (${job.desc})`);
                return;
            }

            let idx = tempSelectedJobs.indexOf(job.name);
            if (idx > -1) {
                if (tempSelectedJobs.length <= 1) {
                    alert("최소 1개의 직업은 선택되어 있어야 합니다!");
                    return;
                }
                tempSelectedJobs.splice(idx, 1);
            } else {
                // 상위 직업(기사)과 하위 직업(견습 기사)의 상호 배제 처리
                if (job.name === "기사") {
                    let kIdx = tempSelectedJobs.indexOf("견습 기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                } else if (job.name === "견습 기사") {
                    let kIdx = tempSelectedJobs.indexOf("기사");
                    if (kIdx > -1) tempSelectedJobs.splice(kIdx, 1);
                }
                tempSelectedJobs.push(job.name);
            }
            updateCharCreationUI();
        }

        // 직업이 최소 1개 선택되었을 때만 '가입 완료' 버튼을 활성화합니다.
        function checkStartBtn() {
            const btn = document.getElementById("ccStartBtn");
            if (tempSelectedJobs.length > 0) {
                btn.disabled = false;
                btn.style.background = "limegreen";
            } else {
                btn.disabled = true;
                btn.style.background = "gray";
            }
        }

        // JOB_DATA를 순회하며 충족 여부에 따라 CSS 클래스(locked, selected 등)를 입혀 리스트 렌더링
        function renderClassList() {
            const listDiv = document.getElementById("ccClassList");
            listDiv.innerHTML = "";
            
            if (typeof JOB_DATA !== "undefined") {
                JOB_DATA.forEach(job => {
                    let targetVal = job.reqVal || 6;
                    let meetsReq = job.req.every(reqStat => player.stats[reqStat] >= targetVal);
                    let isSelected = tempSelectedJobs.includes(job.name);

                    let div = document.createElement("div");
                    div.className = "class-item";
                    
                    if (isSelected) {
                        div.classList.add("selected");
                        div.innerHTML = `<span style='color:gold;'>[보유 중]</span> ${job.name} <br><small style="color:white;">R스킬: ${job.skill.name}</small>`;
                    } else if (!meetsReq && job.req.length > 0) {
                        div.classList.add("locked");
                        div.innerHTML = `<span style="color:gray;">[조건 미달]</span> ${job.name} <br><small>${job.desc}</small>`;
                    } else {
                        div.innerHTML = `<span style='color:cyan;'>[습득 가능]</span> ${job.name} <br><small style="color:lightgray;">${job.desc}</small>`;
                    }
                    
                    div.onclick = () => toggleJob(job);
                    listDiv.appendChild(div);
                });
            }
        }

        // [MOD-014-4: 스탯 최종 반영]
        // 가입 완료 버튼을 누르면 스탯을 기반으로 최대 HP/MP/ST를 계산하여 세팅합니다.
        function finishGuildJoin() {
            const nameInput = document.getElementById("ccPlayerName").value.trim();
            if (!nameInput) { alert("캐릭터 이름을 입력해주세요!"); return; }
            if (tempSelectedJobs.length === 0) return;

            player.name = nameInput;
            player.acquiredJobs = [...tempSelectedJobs];
            player.job = player.acquiredJobs.join(" + ");
            player.currentSkillIdx = 0;
            player.aimingSkill = null;

            player.maxHp = player.stats.hp * 3;
            player.currentHp = player.maxHp;
            player.maxStamina = player.stats.stamina * 3;
            player.currentStamina = player.maxStamina;
            player.maxMana = player.stats.mana * 3;
            player.currentMana = player.maxMana;

            gameState = "playing"; // 게임 상태 복귀
            document.getElementById("charCreationUI").style.display = "none";
        }
        // [MOD-014-END]

        // [MOD-015: 스킬 시스템 및 전투 연산 로직]
        // [MOD-015-1: 스킬 데이터 모형 및 퀵슬롯 초기화]
        const MOCK_SKILLS = {
            leap: { id: "leap", name: "도약", type: "leap_only", cooldown: 2, bonusDmg: 0 },
            charge: { id: "charge", name: "돌진", type: "charge", cooldown: 3, bonusDmg: 10 },
            slam: { id: "slam", name: "강타", type: "jump_slam", cooldown: 5, bonusDmg: 20 },
            slash: { id: "slash", name: "베기", type: "slash", cooldown: 1, bonusDmg: 5 },
            heal: { id: "heal", name: "치료", type: "heal", cooldown: 10, bonusDmg: 0 },
            fire: { id: "fire", name: "화염", type: "fire", cooldown: 4, bonusDmg: 15 },
            ice: { id: "ice", name: "얼음", type: "ice", cooldown: 4, bonusDmg: 12 },
            wind: { id: "wind", name: "바람", type: "wind", cooldown: 3, bonusDmg: 8 },
            teleport: { id: "teleport", name: "순간이동", type: "teleport", cooldown: 5, bonusDmg: 0 } // ★ 순간이동 추가
        };
        
        if (!player.quickSlots) {
            player.quickSlots = [ null, null, null, null, null ];
            player.currentQuickSlotIdx = 0;
            player.lockedTarget = null;
        }

        // ★ 습득 스킬 및 알림 뱃지 관리 변수
        if (!player.unlockedSkills) {
            player.unlockedSkills = ["leap", "charge", "slam", "slash", "heal"];
        }
        if (!player.newlyAcquiredSkills) {
            player.newlyAcquiredSkills = [];
        }

        player.width = 44;
        player.height = 44;

        function getActiveQuickSlotSkill() {
            return player.quickSlots[player.currentQuickSlotIdx];
        }
        // [MOD-015-2: 사다리형 UI 회전 로직]
        function handleRKey() {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            
            const N = player.quickSlots.length;
            if (N > 0) {
                // R키를 누르면 현재 인덱스를 다음으로 넘김
                player.currentQuickSlotIdx = (player.currentQuickSlotIdx + 1) % N;
                player.aimingSkill = null; 
                updateQuickSlotUI(); 
            }
        }

        function updateQuickSlotUI() {
            const N = player.quickSlots.length;
            if (N === 0) return;

            const centerIdx = player.currentQuickSlotIdx;
            
            // 화면에 보여줄 5개의 스킬 인덱스 계산 (좌측 2개, 중앙, 우측 2개)
            const displayIndices = [
                (centerIdx - 2 + N) % N,
                (centerIdx - 1 + N) % N,
                centerIdx,
                (centerIdx + 1) % N,
                (centerIdx + 2) % N
            ];

            for (let i = 0; i < 5; i++) {
                let slot = document.getElementById("q-slot-" + i);
                let inner = slot ? slot.querySelector('.q-slot-inner') : null;
                if (!slot || !inner) continue;
                
                let skillIdx = displayIndices[i];
                let skill = player.quickSlots[skillIdx];
                
                inner.innerHTML = skill ? skill.name : "";

                // 순서에 맞게 클래스(디자인)를 다시 배정하여 밀려가는 효과를 줌
                slot.className = "q-slot-ladder";
                if (i === 0 || i === 4) slot.classList.add("q-slot-far");
                else if (i === 1 || i === 3) slot.classList.add("q-slot-side");
                else if (i === 2) slot.classList.add("q-slot-center");
            }
        }
        // [MOD-015-2-END]

        // [MOD-015-3: 스킬 조준 및 발동 로직]
        // 마우스 우클릭 시 현재 선택된 슬롯의 스킬 쿨타임을 점검하고 조준(aiming) 상태로 전환합니다.
        function aimCurrentQuickSlot() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) { addFloatingText(player.x, player.y - 10, "빈 슬롯입니다.", "gray"); return; }
            let cd = player.skillCooldowns[activeSkill.id] || 0;
            if (cd > 0) { addFloatingText(player.x, player.y - 10, `${activeSkill.name} 쿨타임!`, "yellow"); return; }
            player.aimingSkill = activeSkill.type;
            addFloatingText(player.x, player.y - 30, `[${activeSkill.name}] 조준 중...`, "cyan");
        }

        function startSkillCooldown(skillId, cooldownSec) {
            player.skillCooldowns[skillId] = cooldownSec * 60; // 60프레임 = 1초
        }

        // 마우스 좌클릭 시 조준 중이던 스킬을 마우스 커서 위치(월드 좌표)로 발사/이동시킵니다.
        function executeAimingSkill() {
            const activeSkill = getActiveQuickSlotSkill();
            if (!activeSkill) return false;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x;
            const pCenterY = player.y;
            const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);
            const playerRadius = player.width / 2;

            // 이동계 스킬 1: 도약 (마우스 방향으로 짧고 빠르게 전진)
            if (player.aimingSkill === "leap_only") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                player.dashSpeed = 15;
                player.dashDirX = Math.cos(aimAngle);
                player.dashDirY = Math.sin(aimAngle);
                player.dashTimer = 6;
                player.activeSkillType = "leap_only";
                addVisualEffect(pCenterX, pCenterY, 30, "cyan");
                player.aimingSkill = null;
                return true;
            }
            // 이동+공격계 스킬: 강타 (마우스 커서 지점으로 텔레포트하듯 점프 후 착지 딜레이/데미지)
            else if (player.aimingSkill === "jump_slam") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                let targetX = Math.max(playerRadius, Math.min(WORLD_WIDTH - playerRadius, wMouseX));
                let targetY = Math.max(playerRadius, Math.min(WORLD_HEIGHT - playerRadius, wMouseY));
                
                // 장애물이 없다면 즉시 좌표 이동
                if (!checkObstacleCollision(targetX - playerRadius, targetY - playerRadius)) {
                    player.x = targetX;
                    player.y = targetY;
                }
                const slamX = player.x;
                const slamY = player.y;
                addVisualEffect(slamX, slamY, 80, "red"); // 붉은 파장 생성

                const totalDmg = (player.stats.str * 3) + activeSkill.bonusDmg;
                // 고블린이 범위 내에 있다면 광역 데미지
                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    if (Math.hypot(MAP_DATA.dungeon.goblin.x - slamX, MAP_DATA.dungeon.goblin.y - slamY) < 80 + MAP_DATA.dungeon.goblin.size / 2) {
                        applyDamageToGoblin(totalDmg);
                    }
                }
                player.aimingSkill = null;
                return true;
            } 
            // 이동+공격계 스킬: 돌진 (마우스 커서 방향으로 긴 거리를 쭉 밀고 나감)
            else if (player.aimingSkill === "charge") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                const dx = wMouseX - pCenterX;
                const dy = wMouseY - pCenterY;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const speed = 22; 
                    player.dashSpeed = speed;
                    player.dashDirX = dx / dist;
                    player.dashDirY = dy / dist;
                    player.dashTimer = Math.min(40, Math.ceil(dist / speed));
                    player.targetX = wMouseX;
                    player.targetY = wMouseY;
                    player.activeSkillType = "charge";
                    addVisualEffect(pCenterX, pCenterY, 40, "yellow");
                }
                player.aimingSkill = null;
                return true;
            }
            // ★ 이동계 스킬 2: 순간이동 (마우스 방향으로 일정 거리 즉시 이동)
            else if (player.aimingSkill === "teleport") {
                startSkillCooldown(activeSkill.id, activeSkill.cooldown);
                
                const maxDist = 250; // 최대 순간이동 거리 (사거리)
                const dx = wMouseX - pCenterX;
                const dy = wMouseY - pCenterY;
                const dist = Math.hypot(dx, dy);
                
                let targetX = wMouseX;
                let targetY = wMouseY;
                
                // 사거리를 벗어났으면 최대 사거리 지점으로 보정
                if (dist > maxDist) {
                    targetX = pCenterX + (dx / dist) * maxDist;
                    targetY = pCenterY + (dy / dist) * maxDist;
                }
                
                // 맵 경계선 뚫기 방지
                targetX = Math.max(playerRadius, Math.min(WORLD_WIDTH - playerRadius, targetX));
                targetY = Math.max(playerRadius, Math.min(WORLD_HEIGHT - playerRadius, targetY));
                
                // 벽(장애물) 충돌 검사
                if (!checkObstacleCollision(targetX - playerRadius, targetY - playerRadius)) {
                    addVisualEffect(player.x, player.y, 40, "purple"); // 사라질 때 보라색 파장
                    player.x = targetX;
                    player.y = targetY;
                    addVisualEffect(player.x, player.y, 40, "cyan");   // 나타날 때 하늘색 파장
                } else {
                    addFloatingText(player.x, player.y - 20, "막힌 공간입니다!", "red");
                }
                
                player.aimingSkill = null;
                return true;
            }
            return false;
        }

        // [MOD-015-4: 타격 및 경험치/레벨업 로직]
        function applyDamageToGoblin(dmg) {
            let gob = MAP_DATA.dungeon.goblin;
            gob.hp -= dmg;
            addFloatingText(gob.x, gob.y - gob.size, dmg, "orange"); // 딜 캐치 텍스트
            
            // 고블린 체력 소진 시 맵 랜덤 위치에 즉시 리스폰 및 경험치 처리
            if (gob.hp <= 0) {
                gob.hp = gob.maxHp;
                gob.x = Math.random() * (WORLD_WIDTH - 200) + 100;
                gob.y = Math.random() * (WORLD_HEIGHT - 200) + 100;
                
                player.lockedTarget = null; // 죽었으므로 락온 해제

                player.exp += gob.expReward;
                // 경험치 임계치 도달 시 레벨업 및 상태 풀 회복
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp = Math.floor(player.maxExp * 1.5); // 다음 요구 경험치 1.5배 증가
                    player.currentHp = player.maxHp;
                    player.currentStamina = player.maxStamina;
                    player.currentMana = player.maxMana;
                    addFloatingText(player.x, player.y - 30, "LEVEL UP!", "gold");
                }
            }
        }

        // 지정된 좌표에 15프레임간 지속되며 크기가 줄어드는 이펙트 추가
        function addVisualEffect(x, y, radius, color) {
            visualEffects.push({ x: x, y: y, radius: radius, color: color, alpha: 0.6, timer: 15 });
        }
        
        setTimeout(updateQuickSlotUI, 100); // 로드 시 UI 강제 갱신
        // [MOD-015-END]
        
       // [MOD-016: 입력 이벤트 리스너]
        // [MOD-016-1: 단축키 및 슬롯 클릭 처리]
        function selectQuickSlot(index) {
            if (gameState !== "playing" || player.dashTimer > 0) return;
            player.currentQuickSlotIdx = index;
            player.aimingSkill = null; 
            if (typeof updateQuickSlotUI === "function") updateQuickSlotUI();
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                if (typeof handleEscAction === "function") handleEscAction();
                return;
            }

            if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return; 

            const introStates = ["title", "login", "intro", "lobby", "npcMenu"];
            if (introStates.includes(gameState)) return; 

            keys[e.key] = true;
            if (e.key.length === 1) keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'r') handleRKey();
            
            if (e.key.toLowerCase() === 'f' && gameState === "playing") {
                if (targetedFieldItem) pickupFieldItem(targetedFieldItem);
            }

            if (e.key.toLowerCase() === 'e' && gameState !== "dead" && gameState !== "knockback") {
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    document.getElementById("vpad-container").style.display = "none";
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            }
            
            // 숫자키 1~5로 스킬 덱 직접 선택
            if (gameState === "playing") {
                if (e.key >= '1' && e.key <= '5') { selectQuickSlot(parseInt(e.key) - 1); }
            }
        });

        window.addEventListener("keyup", (e) => { 
            keys[e.key] = false; 
            if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener("contextmenu", (e) => { e.preventDefault(); });

        // 화면 5칸을 클릭/터치 시 중앙으로 불러오기
        for (let i = 0; i < 5; i++) {
            let el = document.getElementById("q-slot-" + i);
            if (el) {
                const triggerIdx = () => {
                    if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return;
                    const N = player.quickSlots.length;
                    const centerIdx = player.currentQuickSlotIdx;
                    const displayIndices = [
                        (centerIdx - 2 + N) % N,
                        (centerIdx - 1 + N) % N,
                        centerIdx,
                        (centerIdx + 1) % N,
                        (centerIdx + 2) % N
                    ];
                    // 클릭한 위치에 해당하는 실제 스킬 인덱스로 장전
                    selectQuickSlot(displayIndices[i]); 
                };
                el.addEventListener("touchstart", (e) => { e.preventDefault(); triggerIdx(); });
                el.addEventListener("mousedown", (e) => { e.preventDefault(); triggerIdx(); });
            }
        }
        // [MOD-016-1-END]

        // [MOD-016-2: 마우스 이동 및 클릭 처리]
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x: x + (Math.random() * 20 - 10), y: y - 10, text: text, color: color, alpha: 1.0, timer: 30 });
        }

        canvas.addEventListener("mousedown", (e) => {
            if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return; 
            if (gameState !== "playing") return;

            let wMouseX = mouseX + camera.x;
            let wMouseY = mouseY + camera.y;
            const pCenterX = player.x + player.width / 2;
            const pCenterY = player.y + player.height / 2;

            if (e.button === 2) { aimCurrentQuickSlot(); return; }

            if (e.button === 0) { 
                if (player.aimingSkill) { executeAimingSkill(); return; }

                if (targetedFieldItem) {
                    let distToItem = Math.hypot(wMouseX - targetedFieldItem.x, wMouseY - targetedFieldItem.y);
                    if (distToItem < 45) { 
                        pickupFieldItem(targetedFieldItem);
                        return;
                    }
                }

                if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                    const rec = MAP_DATA.guild.receptionist;
                    const por = MAP_DATA.guild.portal;
                    const chs = MAP_DATA.guild.personalChest;
                    if (wMouseX >= rec.x && wMouseX <= rec.x + rec.size && wMouseY >= rec.y && wMouseY <= rec.y + rec.size) {
                        if (Math.hypot((rec.x+15) - pCenterX, (rec.y+15) - pCenterY) < 100) { openNPCMenu('receptionist'); return; }
                    }
                    if (wMouseX >= por.x && wMouseX <= por.x + por.w && wMouseY >= por.y && wMouseY <= por.y + por.h) {
                        if (Math.hypot((por.x+20) - pCenterX, (por.y+100) - pCenterY) < 100) { openNPCMenu('portal'); return; }
                    }
                    if (wMouseX >= chs.x && wMouseX <= chs.x + chs.w && wMouseY >= chs.y && wMouseY <= chs.y + chs.h) {
                        if (Math.hypot((chs.x+chs.w/2) - pCenterX, (chs.y+chs.h/2) - pCenterY) < 100) { openStorage(); return; }
                    }
                }
                
                if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                    const gob = MAP_DATA.dungeon.goblin;
                    if (Math.hypot(wMouseX - gob.x, wMouseY - gob.y) < gob.size) {
                        player.lockedTarget = gob;
                        addFloatingText(gob.x, gob.y - 30, "타겟 고정!", "red");
                    } else {
                        player.lockedTarget = null;
                    }
                }
            }
        });

        // [MOD-016-3: 모바일 터치 패드 초기화]
        (function initVirtualPad() {
            const stickBase = document.getElementById("vpad-stick-base");
            const stickKnob = document.getElementById("vpad-stick-knob");
            const btnAtk = document.getElementById("vpad-atk");
            const btnSkill = document.getElementById("vpad-skill");
            const btnR = document.getElementById("vpad-r");
            const btnE = document.getElementById("vpad-e");

            let touchId = null;
            let startX = 0, startY = 0;

            window.addEventListener("touchstart", (e) => {
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return; 
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.clientX < window.innerWidth / 2 && touchId === null) {
                        touchId = t.identifier;
                        startX = t.clientX;
                        startY = t.clientY;
                        if(stickBase) {
                            stickBase.style.left = (startX - (window.innerWidth * 0.08)) + "px";
                            stickBase.style.top = (startY - (window.innerHeight * 0.08)) + "px";
                            stickBase.style.bottom = "auto";
                            stickBase.style.display = "block";
                            if(stickKnob) stickKnob.style.transform = `translate(0px, 0px)`;
                        }
                    }
                }
            }, { passive: false });

            window.addEventListener("touchmove", (e) => {
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return; 
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if (t.identifier === touchId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxR = 45; 
                        if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
                        if(stickKnob) stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

                        keys["w"] = dy < -12; keys["s"] = dy > 12;
                        keys["a"] = dx < -12; keys["d"] = dx > 12;

                        if (dist > 5) {
                            let moveAngle = Math.atan2(dy, dx);
                            let screenPx = player.x + player.width/2 - camera.x;
                            let screenPy = player.y + player.height/2 - camera.y;
                            
                            mouseX = screenPx + Math.cos(moveAngle) * 120;
                            mouseY = screenPy + Math.sin(moveAngle) * 120;
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        if(stickBase) stickBase.style.display = "none";
                        keys["w"] = false; keys["s"] = false; keys["a"] = false; keys["d"] = false;
                    }
                }
            };
            window.addEventListener("touchend", endTouch);
            window.addEventListener("touchcancel", endTouch);

            if(btnAtk) btnAtk.addEventListener("touchstart", (e) => { 
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return;
                e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 0 })); 
            });
            if(btnSkill) btnSkill.addEventListener("touchstart", (e) => { 
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return;
                e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { button: 2 })); 
            });
            if(btnR) btnR.addEventListener("touchstart", (e) => { 
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return;
                e.preventDefault(); handleRKey(); 
            });
            
            if(btnE) btnE.addEventListener("touchstart", (e) => {
                if (typeof isMenuOpen !== 'undefined' && isMenuOpen) return;
                e.preventDefault();
                if (gameState === "playing") {
                    gameState = "inventory";
                    document.getElementById("inventoryUI").style.display = "flex";
                    document.getElementById("vpad-container").style.display = "none";
                    if(typeof switchTab === "function") switchTab('inv');
                } else {
                    if(typeof closeUI === "function") closeUI();
                }
            });
        })();
        // [MOD-016-3-END]
        
        // [MOD-017: UI 제어 및 충돌(Collision) 유틸리티]
        
 // [MOD-017-1: 장비창 UI 업데이트, 인챈트 로직 및 스마트 알림 뱃지 (스탯 패널 연동을 위한 터치 정리)]
        let currentRightView = 'inventory'; 
        let currentEnchantTargetSlot = null; 
        let pendingEnchant = null; 

        const SLOT_HINTS = {
            head: "머리", mainWeapon: "주무기", chest: "갑옷",
            subWeapon: "부무기", shoes: "신발", throwable: "" 
        };

        function clearEnchantRegistration() {
            if (!currentEnchantTargetSlot) return; 
            currentEnchantTargetSlot = null;
            pendingEnchant = null; 
            
            const content = document.getElementById("enchantContent");
            const targetSlotHint = document.getElementById("enchantTargetHint");
            const targetSlot = document.getElementById("enchantTargetSlot");
            
            if (targetSlotHint) targetSlotHint.innerHTML = `장비<br>등록`;
            if (targetSlot) {
                targetSlot.style.borderColor = "#666"; 
                targetSlot.style.backgroundColor = "#222";
            }
            if (content) content.innerHTML = `좌측 장비창에서 장비를<br>클릭하여 올려주세요.`;
            
            updateNotiBadges(); 
        }

        setTimeout(() => {
            const targetSlot = document.getElementById("enchantTargetSlot");
            if (targetSlot) {
                targetSlot.addEventListener("click", clearEnchantRegistration);
                targetSlot.style.cursor = "pointer"; 
            }
        }, 500);

        function updateNotiBadges() {
            document.querySelectorAll('.noti-badge:not(.socket-badge)').forEach(e => e.remove());

            let allScrolls = [...myInventoryItems];
            if (gameState === "storage") {
                allScrolls = allScrolls.concat(personalStorage);
            }

            let hasScroll = allScrolls.some(i => ITEM_DB[i.baseId] && ITEM_DB[i.baseId].type === "enchant");
            if (!hasScroll) return;

            let enchantableSlots = [];
            for(let slotKey in player.equipment) {
                let item = player.equipment[slotKey];
                if(item && item.sockets && item.sockets.includes(null)) {
                    enchantableSlots.push(slotKey);
                }
            }
            if (enchantableSlots.length === 0) return;

            if (currentRightView === 'inventory') {
                let btn = document.getElementById("modeSwitchBtn");
                if (btn) {
                    let badge = document.createElement("div");
                    badge.className = "noti-badge";
                    badge.innerText = "!";
                    btn.appendChild(badge);
                }
            } else if (currentRightView === 'enchant') {
                enchantableSlots.forEach(slotKey => {
                    if (currentEnchantTargetSlot !== slotKey) {
                        let slotEl = document.querySelector(`.slot-${slotKey}, [data-slot="${slotKey}"]`);
                        if(slotEl) {
                            let badge = document.createElement("div");
                            badge.className = "noti-badge";
                            badge.innerText = "!";
                            slotEl.appendChild(badge);
                        }
                    }
                });
            }
        }

        function renderEquipSlotsUI() {
            for(let slot in player.equipment) {
                let el = document.querySelector(`.slot-${slot}, [data-slot="${slot}"]`);
                if(!el) continue;
                
                let item = player.equipment[slot];
                
                el.onmousedown = null; el.ontouchstart = null;

                if(item) {
                    let baseItem = ITEM_DB[item.baseId];
                    el.style.backgroundColor = baseItem.color;
                    el.innerHTML = `<span style="color:white; font-size:9px; font-weight:bold; pointer-events:none; text-align:center;">${baseItem.name}</span>`;
                    
                    // 더블 터치 및 기존 호버 로직 제거. 클릭/터치 시 즉시 드래그 및 패널 호출로 일원화
                    el.onmousedown = (e) => { 
                        if (currentRightView !== 'enchant') startDragFromEquip(e, slot, item); 
                    };
                    
                    el.ontouchstart = (e) => { 
                        if (currentRightView !== 'enchant') {
                            e.preventDefault(); 
                            startDragFromEquip(e, slot, item); 
                        }
                    };
                } else {
                    el.style.backgroundColor = "#2a2a2a";
                    let hintText = SLOT_HINTS[slot] || "";
                    el.innerHTML = hintText ? `<span class="slot-hint">${hintText}</span>` : "";
                }
            }
            setTimeout(updateNotiBadges, 10);
        }

        function updatePlayerTotalStats() {
            for(let key in player.baseStats) player.stats[key] = player.baseStats[key];

            for(let slot in player.equipment) {
                let item = player.equipment[slot];
                if(!item) continue;
                
                let baseItem = ITEM_DB[item.baseId];
                if(baseItem.stats) {
                    for(let sKey in baseItem.stats) player.stats[sKey] += baseItem.stats[sKey];
                }
                
                if(item.sockets) {
                    item.sockets.forEach(scrollId => {
                        if(scrollId) {
                            let enchData = ITEM_DB[scrollId].enchantEffect;
                            player.stats[enchData.stat] += enchData.value;
                        }
                    });
                }
            }
            if (typeof drawRadarChart === "function") drawRadarChart("infoRadarCanvas");
        }

        function toggleRightPanelView() {
            const btn = document.getElementById("modeSwitchBtn");
            const viewInv = document.getElementById("viewInventory");
            const viewEnc = document.getElementById("viewEnchant");
            
            if (currentRightView === 'inventory') {
                currentRightView = 'enchant';
                viewInv.style.display = 'none'; viewEnc.style.display = 'flex';
                btn.innerHTML = '&laquo;'; 
            } else {
                currentRightView = 'inventory';
                viewInv.style.display = 'block'; viewEnc.style.display = 'none';
                btn.innerHTML = '&raquo;';
                document.getElementById('enchantPopupUI').style.display = 'none';
                
                clearEnchantRegistration();
                if (typeof renderGridInventory === "function") renderGridInventory();
            }
            updateNotiBadges();
            autoScaleInventory(); 
        }

        function selectEquipSlotForEnchant(slotNameKOR, slotKey) {
            if (currentRightView !== 'enchant') return;
            
            const content = document.getElementById("enchantContent");
            const targetSlotHint = document.getElementById("enchantTargetHint");
            const targetSlot = document.getElementById("enchantTargetSlot");
            
            currentEnchantTargetSlot = slotKey;
            let item = player.equipment[slotKey];

            if(!item) {
                targetSlotHint.innerHTML = `장비<br>등록`;
                targetSlot.style.borderColor = "#666"; targetSlot.style.backgroundColor = "#222";
                content.innerHTML = `좌측 장비창에서 장비를<br>클릭하여 올려주세요.`;
                updateNotiBadges();
                return;
            }

            let baseItem = ITEM_DB[item.baseId];
            targetSlotHint.innerHTML = `<span style="color: white; font-weight: bold; font-size: 11px;">${baseItem.name}</span>`;
            targetSlot.style.borderColor = "gold"; targetSlot.style.backgroundColor = baseItem.color;

            let allScrolls = [...myInventoryItems];
            if (gameState === "storage") {
                allScrolls = allScrolls.concat(personalStorage);
            }
            let hasScroll = allScrolls.some(i => ITEM_DB[i.baseId] && ITEM_DB[i.baseId].type === "enchant");
            
            let foundFirstEmpty = false;
            let socketsHtml = '';
            
            for(let i = 0; i < baseItem.maxSockets; i++) {
                let scrollId = item.sockets[i];
                if(scrollId) {
                    let effect = ITEM_DB[scrollId].enchantEffect;
                    socketsHtml += `<div class="socket-slot socket-animated" style="background:#ff4444; border-color:white; position:relative;">
                        <span style="font-size:9px; color:#fff; font-weight:bold;">${effect.stat}+${effect.value}</span>
                    </div>`;
                } else if (pendingEnchant && pendingEnchant.slotKey === slotKey && pendingEnchant.socketIndex === i) {
                    let pScroll = myInventoryItems.find(x => (x.id||x.uid) === pendingEnchant.scrollId) || personalStorage.find(x => (x.id||x.uid) === pendingEnchant.scrollId);
                    if (pScroll) {
                        let effect = ITEM_DB[pScroll.baseId].enchantEffect;
                        socketsHtml += `<div class="socket-slot socket-animated" style="background:#ff8800; border:2px dashed gold; animation: pulse-noti 1.2s infinite; position:relative;">
                            <span style="font-size:9px; color:#fff; font-weight:bold;">${effect.stat}+${effect.value}</span>
                        </div>`;
                    }
                } else {
                    let badgeHtml = "";
                    if (!foundFirstEmpty && hasScroll && !pendingEnchant) {
                        badgeHtml = `<div class="noti-badge socket-badge">!</div>`;
                        foundFirstEmpty = true; 
                    }
                    socketsHtml += `<div class="socket-slot socket-animated" style="position:relative;" onclick="openEnchantPopup('${slotKey}', ${i})">${badgeHtml}</div>`;
                }
            }

            let confirmUI = '';
            if (pendingEnchant && pendingEnchant.slotKey === slotKey) {
                confirmUI = `
                    <div style="display:flex; gap:10px; justify-content:center; margin-top: 10px;">
                        <button style="padding:8px 20px; background:limegreen; border:2px solid white; color:white; font-weight:bold; border-radius:4px; cursor:pointer;" onclick="confirmPendingEnchant()">확정</button>
                        <button style="padding:8px 20px; background:gray; border:2px solid white; color:white; font-weight:bold; border-radius:4px; cursor:pointer;" onclick="cancelPendingEnchant('${slotNameKOR}', '${slotKey}')">취소</button>
                    </div>
                `;
            } else {
                confirmUI = `<div style="font-size: 11px; color: #888;">빈 소켓을 클릭하면<br>인챈트 북 목록이 표시됩니다.</div>`;
            }

            content.innerHTML = `
                <div style="color: white; font-weight: bold; margin-bottom: 20px; font-size: 13px;">[${slotNameKOR}] 소켓 정보</div>
                <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                    ${socketsHtml}
                </div>
                ${confirmUI}
            `;
            
            setTimeout(updateNotiBadges, 10); 
        }

        function openEnchantPopup(slotKey, socketIndex) {
            let allScrolls = [...myInventoryItems];
            if (gameState === "storage") {
                allScrolls = allScrolls.concat(personalStorage);
            }

            let scrolls = allScrolls.filter(i => ITEM_DB[i.baseId] && ITEM_DB[i.baseId].type === "enchant");
            let popup = document.getElementById("enchantPopupUI");
            
            if(scrolls.length === 0) {
                popup.innerHTML = `<div style="color:gray; font-size:11px; text-align:center;">사용 가능한<br>인챈트 두루마리가 없습니다.</div>
                <button onclick="document.getElementById('enchantPopupUI').style.display='none'" style="margin-top:10px; background:#444; color:#fff; border:none; padding:5px; border-radius:4px;">닫기</button>`;
            } else {
                let listHtml = scrolls.map(scroll => {
                    let base = ITEM_DB[scroll.baseId];
                    let sourceText = myInventoryItems.some(i => (i.id || i.uid) === (scroll.id || scroll.uid)) ? "가방" : "창고";
                    return `<div class="enchant-scroll-item" onclick="stageEnchant('${slotKey}', ${socketIndex}, '${scroll.id || scroll.uid}')">
                        <span style="color:#aaa; font-size:9px;">[${sourceText}]</span> ${base.name} <span style="color:gold; font-size:10px;">${base.enchantEffect.name}</span>
                    </div>`;
                }).join('');
                
                popup.innerHTML = `<div style="color:gold; font-weight:bold; font-size:12px; margin-bottom:10px; text-align:center;">인챈트 선택</div>
                ${listHtml}
                <button onclick="document.getElementById('enchantPopupUI').style.display='none'" style="margin-top:10px; background:#444; color:#fff; border:none; padding:5px; border-radius:4px;">취소</button>`;
            }
            popup.style.display = 'flex';
        }

        function stageEnchant(slotKey, socketIndex, scrollId) {
            pendingEnchant = { slotKey, socketIndex, scrollId };
            document.getElementById('enchantPopupUI').style.display = 'none';
            let slotNameKOR = document.querySelector(`[data-slot="${slotKey}"]`).innerText;
            selectEquipSlotForEnchant(slotNameKOR, slotKey); 
        }

        function confirmPendingEnchant() {
            if(!pendingEnchant) return;
            let slotKey = pendingEnchant.slotKey;
            let socketIndex = pendingEnchant.socketIndex;
            let scrollId = pendingEnchant.scrollId;
            
            let item = player.equipment[slotKey];
            let scroll = null;
            
            let invIdx = myInventoryItems.findIndex(i => (i.id || i.uid) === scrollId);
            if (invIdx > -1) {
                scroll = myInventoryItems.splice(invIdx, 1)[0];
            } else if (gameState === "storage") {
                let stoIdx = personalStorage.findIndex(i => (i.id || i.uid) === scrollId);
                if (stoIdx > -1) {
                    scroll = personalStorage.splice(stoIdx, 1)[0];
                    if (typeof renderGridInventory === "function") renderGridInventory();
                }
            }
            
            if (scroll) {
                item.sockets[socketIndex] = scroll.baseId;
            }
            
            pendingEnchant = null;
            updatePlayerTotalStats();
            
            let slotNameKOR = document.querySelector(`[data-slot="${slotKey}"]`).innerText;
            selectEquipSlotForEnchant(slotNameKOR, slotKey); 
        }

        function cancelPendingEnchant(slotNameKOR, slotKey) {
            pendingEnchant = null;
            selectEquipSlotForEnchant(slotNameKOR, slotKey);
        }

        function closeUI() {
            gameState = "playing";
            document.getElementById("inventoryUI").style.display = "none";
            
            let sp = document.getElementById("storagePanel");
            if(sp) sp.style.display = "none";
            
            clearEnchantRegistration();

            if (currentRightView === 'enchant') toggleRightPanelView(); 
            const vpad = document.getElementById("vpad-container");
            if(vpad) vpad.style.display = "block"; 
        }
        
        function autoScaleInventory() {
            const container = document.querySelector('.inv-container');
            if (!container) return;

            let baseW = 520; 
            if (currentRightView === 'enchant' || gameState === 'storage') {
                baseW = 860; 
            }
            const baseH = 450; 

            const scaleX = (window.innerWidth * 0.9) / baseW;
            const scaleY = (window.innerHeight * 0.9) / baseH;
            let scale = Math.min(scaleX, scaleY);
            scale = Math.max(0.5, Math.min(scale, 1.8));
            
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', autoScaleInventory);

        function switchTab(tabId) {
            renderEquipSlotsUI(); 
            if (typeof renderGridInventory === "function") renderGridInventory();
            updatePlayerTotalStats(); 
            autoScaleInventory(); 
        }
        // [MOD-017-1-END]
        
        // [MOD-017-2: AABB 2D 사각형 충돌 계산 유틸리티]
        function checkRectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        // 플레이어의 다음 이동 좌표(x, y)에 지형지물(접수원, 포탈, 상자)이 있는지 미리 검사합니다.
        function checkObstacleCollision(x, y) {
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const rec = MAP_DATA.guild.receptionist;
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;
                if (checkRectCollision(x, y, player.width, player.height, rec.x, rec.y, rec.size, rec.size)) return true;
                if (checkRectCollision(x, y, player.width, player.height, por.x, por.y, por.w, por.h)) return true;
                if (checkRectCollision(x, y, player.width, player.height, chs.x, chs.y, chs.w, chs.h)) return true;
            }
            return false;
        }
        // [MOD-017-END]

       // [MOD-018: 메인 게임 루프 (60프레임 반복 렌더링)]
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 타이틀, 로그인, 로비 화면일 때는 무거운 월드 렌더링을 건너뜀
            if (gameState === "title" || gameState === "login" || gameState === "intro" || gameState === "lobby" || gameState === "charCreation" || gameState === "npcMenu") { 
                requestAnimationFrame(gameLoop); return; 
            }

            const pCenterX = player.x;
            const pCenterY = player.y;
            const playerRadius = player.width / 2;
            
            const activeSkill = typeof getActiveQuickSlotSkill === "function" ? getActiveQuickSlotSkill() : null;

            for (let sId in player.skillCooldowns) {
                if (player.skillCooldowns[sId] > 0) player.skillCooldowns[sId]--;
            }

            if (gameState === "playing") {
                let wMouseX = mouseX + camera.x;
                let wMouseY = mouseY + camera.y;
                let minScore = Infinity;
                let bestTarget = null;
                const PICKUP_RADIUS = 105; 

                for (let i = 0; i < fieldItems.length; i++) {
                    let fItem = fieldItems[i];
                    if (fItem.pickupDelay > 0) fItem.pickupDelay--;
                    if (fItem.errorFlashTimer > 0) fItem.errorFlashTimer--;

                    let distToPlayer = Math.hypot(fItem.x - pCenterX, fItem.y - pCenterY);
                    
                    if (distToPlayer <= PICKUP_RADIUS) {
                        let distToMouse = Math.hypot(fItem.x - wMouseX, fItem.y - wMouseY);
                        let score = distToMouse < 45 ? distToMouse : distToPlayer + 100;
                        if (score < minScore) {
                            minScore = score;
                            bestTarget = fItem;
                        }
                    }
                }
                targetedFieldItem = bestTarget;
            }

            if (gameState === "playing") {
                let nextX = player.x;
                let nextY = player.y;

                if (player.dashTimer > 0) {
                    player.dashTimer--;
                    nextX += player.dashDirX * player.dashSpeed;
                    nextY += player.dashDirY * player.dashSpeed;

                    if (player.activeSkillType === "charge") {
                        const distToTarget = Math.hypot((player.targetX) - nextX, (player.targetY) - nextY);
                        if (distToTarget <= player.dashSpeed) {
                            nextX = player.targetX; nextY = player.targetY; player.dashTimer = 0;
                        }
                    }

                    if (nextX - playerRadius <= 0 || nextX + playerRadius >= WORLD_WIDTH || nextY - playerRadius <= 0 || nextY + playerRadius >= WORLD_HEIGHT || checkObstacleCollision(nextX - playerRadius, nextY - playerRadius)) {
                        player.dashTimer = 0; nextX = player.x; nextY = player.y; 
                    }

                    if ((player.activeSkillType === "charge" || player.activeSkillType === "leap_attack") && currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                        let gob = MAP_DATA.dungeon.goblin;
                        if (Math.hypot(nextX - gob.x, nextY - gob.y) < playerRadius + gob.size/2) {
                            const dmg = (player.stats.str * 3) + (activeSkill ? activeSkill.bonusDmg : 0);
                            applyDamageToGoblin(dmg);
                        }
                    }
                } else {
                    let isMoving = keys["ArrowUp"] || keys["w"] || keys["s"] || keys["ArrowDown"] || keys["a"] || keys["ArrowLeft"] || keys["d"] || keys["ArrowRight"];
                    let currentSpeed = player.speed;
                    let isSprinting = false;

                    if (keys["Shift"] && isMoving && player.currentStamina >= 1) {
                        isSprinting = true;
                        currentSpeed = player.speed * 1.6;
                        player.sprintTimer = (player.sprintTimer || 0) + 1;
                        if (player.sprintTimer >= 60) {
                            player.currentStamina -= 1;
                            player.sprintTimer = 0;
                        }
                    } else {
                        player.sprintTimer = 0;
                    }

                    if (keys["ArrowUp"] || keys["w"]) nextY -= currentSpeed;
                    if (keys["ArrowDown"] || keys["s"]) nextY += currentSpeed;
                    if (keys["ArrowLeft"] || keys["a"]) nextX -= currentSpeed;
                    if (keys["ArrowRight"] || keys["d"]) nextX += currentSpeed;

                    nextX = Math.max(playerRadius, Math.min(nextX, WORLD_WIDTH - playerRadius));
                    nextY = Math.max(playerRadius, Math.min(nextY, WORLD_HEIGHT - playerRadius));

                    if (checkObstacleCollision(nextX - playerRadius, nextY - playerRadius)) {
                        nextX = player.x; nextY = player.y;
                    }

                    if (!isSprinting && player.currentStamina < player.maxStamina) {
                        player.staminaRegenTimer++;
                        if (player.staminaRegenTimer >= 60) {
                            player.currentStamina = Math.min(player.maxStamina, player.currentStamina + 1);
                            player.staminaRegenTimer = 0;
                        }
                    } else {
                        player.staminaRegenTimer = 0;
                    }
                }

                player.x = nextX;
                player.y = nextY;

                if (attackTimer > 0) attackTimer--;

                if (attackTimer <= 0) { 
                    const baseRange = 85;
                    const totalDmg = (player.stats.str * 3) + 5; 

                    if (currentMap === "dungeon" && typeof MAP_DATA !== "undefined" && MAP_DATA.dungeon.goblin.active) {
                        const gob = MAP_DATA.dungeon.goblin;
                        let targetToAttack = null;

                        if (player.lockedTarget && Math.hypot(player.lockedTarget.x - pCenterX, player.lockedTarget.y - pCenterY) <= baseRange + player.lockedTarget.size / 2) {
                            targetToAttack = player.lockedTarget;
                        } else if (Math.hypot(gob.x - pCenterX, gob.y - pCenterY) <= baseRange + gob.size / 2) {
                            targetToAttack = gob;
                        }

                        if (targetToAttack) {
                            attackTimer = 30;
                            player.lastAttackAngle = Math.atan2(targetToAttack.y - pCenterY, targetToAttack.x - pCenterX);
                            applyDamageToGoblin(totalDmg);
                        }
                    }
                }

            } else if (gameState === "knockback") {
                player.x += player.knockbackDirX * 25;
                player.y += player.knockbackDirY * 5;
                
                if (player.x <= playerRadius || player.x >= WORLD_WIDTH - playerRadius || player.y <= playerRadius) {
                    player.x = Math.max(playerRadius, Math.min(player.x, WORLD_WIDTH - playerRadius));
                    gameState = "dead";
                    document.getElementById("deathUI").style.display = "flex";
                }
            }

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - canvas.width));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - canvas.height));

            // === [월드 렌더링 시작] ===
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 타일 격자
            ctx.strokeStyle = "#3a3a3a";
            ctx.lineWidth = 1;
            for(let i = 0; i <= WORLD_WIDTH; i += 100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_HEIGHT); ctx.stroke();
            }
            for(let i = 0; i <= WORLD_HEIGHT; i += 100) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_WIDTH, i); ctx.stroke();
            }

            // 길드 오브젝트
            if (currentMap === "guild" && typeof MAP_DATA !== "undefined") {
                const por = MAP_DATA.guild.portal;
                const chs = MAP_DATA.guild.personalChest;

                ctx.fillStyle = por.color; ctx.fillRect(por.x, por.y, por.w, por.h);
                ctx.fillStyle = "white"; ctx.font = "bold 14px sans-serif"; 
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("포탈", por.x + por.w/2, por.y - 15);

                ctx.fillStyle = chs.color; ctx.fillRect(chs.x, chs.y, chs.w, chs.h);
                ctx.strokeStyle = "#8B6508"; ctx.lineWidth = 3; ctx.strokeRect(chs.x, chs.y, chs.w, chs.h);
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("개인 창고", chs.x + chs.w/2, chs.y - 10);
            } 
            // 던전 고블린

                const aimAngle = Math.atan2(wMouseY - pCenterY, wMouseX - pCenterX);

                if (player.aimingSkill === "leap_only") {

                } else if (player.aimingSkill === "charge") {

                    ctx.save(); ctx.translate(pCenterX, pCenterY); ctx.rotate(aimAngle);

                    const maxDist = 250;
                    const dist = Math.min(maxDist, Math.hypot(wMouseX - pCenterX, wMouseY - pCenterY));
                    const targetX = pCenterX + Math.cos(aimAngle) * dist;
                    const targetY = pCenterY + Math.sin(aimAngle) * dist;
                    
                    ctx.save();

                    ctx.beginPath(); ctx.arc(targetX, targetY, playerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(100, 50, 255, 0.3)"; ctx.fill();
                    ctx.strokeStyle = "purple"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke();

                const weaponLength = 50, weaponWidth = 12, pivotX = 0, pivotY = playerRadius + 25;
                let currentAngle = aimAngle;
                let isSwinging = (attackTimer > 0 && player.lastAttackAngle !== undefined);
                let wristAngle = -Math.PI / 6; 

                if (isSwinging) {
                    let progress = 1.0 - (attackTimer / 30);
                    let startAngle = player.lastAttackAngle - Math.PI / 3;
                    let endAngle = player.lastAttackAngle + Math.PI / 3;
                    currentAngle = startAngle + (endAngle - startAngle) * progress;
                    wristAngle = (-Math.PI / 6) * (1 - Math.sin(progress * Math.PI));

                    ctx.beginPath();
                    const swingRadius = Math.hypot(weaponLength, pivotY);
                    const tipOffsetAngle = Math.atan2(pivotY, weaponLength);
                    ctx.arc(pCenterX, pCenterY, swingRadius, startAngle + tipOffsetAngle, currentAngle + tipOffsetAngle);

                ctx.rotate(currentAngle);
                ctx.translate(pivotX, pivotY);
                ctx.rotate(wristAngle);

                ctx.fillRect(0, -weaponWidth / 2, weaponLength, weaponWidth);
                ctx.strokeStyle = "red";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0, -weaponWidth / 2, weaponLength, weaponWidth);
                
                ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2);

        // [MOD-018-END]
        
// [MOD-020-1: 그리드 환경 변수 및 장비 슬롯 정의]

        // [MOD-020-3: 배열 회전 유틸리티 함수]
        function getRotatedShape(shape, rot) {
            let s = shape;
            for(let step = 0; step < rot; step++) {
                const rows = s.length;
                const cols = s[0].length;
                let newS = Array.from({length: cols}, () => Array(rows).fill(0));
                for(let r = 0; r < rows; r++) {
                    for(let c = 0; c < cols; c++) {
                        newS[c][rows - 1 - r] = s[r][c]; 
                    }
                }
                s = newS;
            }
            return s;
        }
